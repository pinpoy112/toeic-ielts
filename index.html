<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WORDVERSE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#0B0D12; --bg2:#141821; --card:#1B202B; --vio:#8B5CF6; --blue:#60A5FA; --mint:#5EEAD4;
  --tx:#F8FAFC; --tx2:#94A3B8; --line:rgba(255,255,255,.08); --glass:rgba(27,32,43,.72);
  --bad:#FB7185; --good:#5EEAD4; --warn:#FBBF24;
  --f:"Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sw:248px; --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 50% at 85% -5%,rgba(139,92,246,.22),transparent 70%),radial-gradient(45% 40% at -5% 100%,rgba(96,165,250,.16),transparent 70%),radial-gradient(35% 30% at 50% 110%,rgba(94,234,212,.08),transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
i[data-lucide],svg.lucide{width:20px;height:20px;stroke-width:2;flex:none;display:inline-block}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--tx2)} .small{font-size:.8125rem}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .25s}
.app.collapsed{--sw:76px}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:rgba(20,24,33,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);z-index:30;overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:800;letter-spacing:.08em;font-size:1.0625rem;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--vio),var(--blue));box-shadow:0 0 22px rgba(139,92,246,.55);flex:none}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--tx2);font-weight:500;text-align:left;white-space:nowrap;transition:background .2s,color .2s;min-height:44px}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(139,92,246,.28),rgba(96,165,250,.12));color:var(--tx);box-shadow:inset 0 0 0 1px rgba(139,92,246,.35)}
.nav .cnt{margin-left:auto;font-size:.75rem;background:rgba(255,255,255,.08);padding:1px 8px;border-radius:99px}
.collapsed .nav span,.collapsed .logo span.t,.collapsed .nav .cnt,.collapsed .side .foot span{display:none}
.side .foot{margin-top:auto;display:grid;gap:6px}
.side .foot button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--tx2);min-height:44px;white-space:nowrap}
.side .foot button:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.main{min-width:0;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrapin{max-width:1180px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 0;background:linear-gradient(var(--bg) 60%,transparent)}
.srch{position:relative;flex:1;min-width:0;max-width:460px}
.srch i,.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx2);pointer-events:none;width:18px;height:18px}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--tx);min-height:44px;transition:border-color .2s,box-shadow .2s}
.srch .inp{padding-left:42px}
.inp:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(139,92,246,.25);outline:0}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select.inp option{background:var(--bg2);color:var(--tx)}
.hd-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:.8125rem;white-space:nowrap}
.pill i,.pill svg{width:16px;height:16px}
.fire{color:#FB923C;animation:flame 1.4s ease-in-out infinite;transform-origin:50% 90%}
.ibtn{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--tx2);background:var(--glass);border:1px solid var(--line);transition:color .2s,border-color .2s,transform .15s}
.ibtn:hover{color:var(--tx);border-color:rgba(139,92,246,.5)}
.ibtn:active{transform:scale(.94)}
.ibtn.on{color:var(--bad);border-color:rgba(251,113,133,.4)}
.ibtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--vio),var(--mint));font-weight:700;color:#0B0D12;display:grid;place-items:center}
.menu-b{display:none}
.bnav{display:none}

/* ---------- Common ---------- */
.view{padding-bottom:24px}
.view.enter{animation:up .35s ease-out}
.gap{display:grid;gap:18px}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.hover{transition:transform .2s,border-color .2s,box-shadow .2s}
.card.hover:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.45);box-shadow:0 12px 34px -14px rgba(139,92,246,.5)}
.lbl{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
.sech{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 12px;flex-wrap:wrap}
.sech h2{font-size:1.25rem}
.pg-t{display:grid;gap:4px;margin:6px 0 14px}
.pg-t h1{font-size:1.75rem;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;font-weight:600;background:linear-gradient(135deg,var(--vio),#6D5CF6 55%,var(--blue));color:#fff;box-shadow:0 8px 24px -10px rgba(139,92,246,.8);transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:none;border:1px solid var(--line);color:var(--tx)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.875rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--vio),var(--blue),var(--mint));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.6875rem;font-weight:600;background:rgba(139,92,246,.18);color:#C4B5FD}
.tag.l1{background:rgba(94,234,212,.15);color:var(--mint)} .tag.l2{background:rgba(96,165,250,.16);color:var(--blue)} .tag.l3{background:rgba(251,113,133,.16);color:#FDA4AF}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.gauto{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.big{font-size:2.25rem;font-weight:800;line-height:1}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:26px 16px}
.empty .slot{width:min(260px,70%);aspect-ratio:1}

/* ---------- Spline slot + fallback ---------- */
.slot{position:relative;border-radius:var(--r);overflow:hidden;min-height:200px;width:100%}
.slot spline-viewer{display:block;width:100%;height:100%;min-height:260px}
.slot.hero{min-height:300px;height:100%}
.slotchip{position:absolute;left:10px;bottom:8px;font-size:.6875rem;color:var(--tx2);background:rgba(11,13,18,.6);border:1px solid var(--line);padding:2px 8px;border-radius:99px;pointer-events:none}
.orb{position:absolute;inset:0;display:grid;place-items:center;perspective:700px}
.orb .core{position:relative;width:min(46%,170px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,#E9D5FF,var(--vio) 38%,#3B2A8F 78%,#1A1446);box-shadow:0 0 60px rgba(139,92,246,.65),0 40px 40px -20px rgba(0,0,0,.6),inset -14px -18px 34px rgba(0,0,0,.4);animation:float 5s ease-in-out infinite}
.orb .core::after{content:"Aa";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:clamp(1.6rem,5vw,2.6rem);color:rgba(255,255,255,.92);text-shadow:0 2px 12px rgba(0,0,0,.35)}
.orb .ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid rgba(96,165,250,.45);transform:translate(-50%,-50%) rotateX(72deg)}
.orb .r1{width:68%;aspect-ratio:1;animation:spin 14s linear infinite}
.orb .r2{width:88%;aspect-ratio:1;border-color:rgba(94,234,212,.3);animation:spin 22s linear infinite reverse}
.orb .chip{position:absolute;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 20px -8px rgba(0,0,0,.6);animation:float 6s ease-in-out infinite}
.orb .c1{left:12%;top:18%;color:var(--mint)} .orb .c2{right:12%;top:24%;color:var(--blue);animation-delay:-2s} .orb .c3{left:22%;bottom:14%;color:#C4B5FD;animation-delay:-4s}
.orb .shadow{position:absolute;bottom:9%;left:50%;width:34%;height:14px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(4px)}

/* ---------- Home ---------- */
.welcome{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:stretch;overflow:hidden;position:relative;background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(27,32,43,.75) 55%)}
.welcome h1{font-size:clamp(1.75rem,3.4vw,2.5rem);font-weight:800;margin:6px 0 10px}
.welcome h1 em{font-style:normal;background:linear-gradient(90deg,var(--vio),var(--blue),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wk div{display:grid;justify-items:center;gap:4px;font-size:.6875rem;color:var(--tx2)}
.wk span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.wk .on span{background:linear-gradient(135deg,var(--vio),var(--blue));color:#fff;border-color:transparent}
.wk .td span{box-shadow:0 0 0 2px var(--mint)}
.dw .w{font-size:2rem;font-weight:800}
.ipa{color:var(--blue);font-weight:500}

/* ---------- Category cards ---------- */
.cat{display:grid;gap:10px;text-align:left;width:100%;color:inherit}
.cat .ci{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(96,165,250,.2));color:#DDD6FE}
.cat .no{font-size:.75rem;color:var(--tx2);font-weight:600}
.cat h3{font-size:1.0625rem}

/* ---------- Flip cards ---------- */
.fcard{perspective:900px;cursor:pointer;min-height:210px}
.fi{position:relative;width:100%;height:100%;min-height:210px;transition:transform .55s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.fcard.flip .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:16px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;overflow:hidden}
.ff.back{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(139,92,246,.22),rgba(27,32,43,.92))}
.fcard:hover .ff{border-color:rgba(139,92,246,.45)}
.ff .w{font-size:1.5rem;font-weight:800;overflow-wrap:anywhere}
.ff .acts{margin-top:auto;display:flex;gap:6px;align-items:center}
.ff .th{font-size:1.25rem;font-weight:700;color:var(--mint)}
.ff .dfn{font-size:.8125rem;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx2);background:rgba(255,255,255,.05);transition:color .2s,background .2s,transform .15s}
.mini:hover{color:var(--tx);background:rgba(255,255,255,.1)}
.mini:active{transform:scale(.9)}
.mini.on{color:var(--bad)} .mini.ok{color:var(--mint)}
.mini.on svg,.mini.on i{fill:currentColor}
.badge-l{position:absolute;top:12px;right:12px}
.lrn{position:absolute;top:14px;right:14px;color:var(--mint)}

.filters{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:10px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.8125rem;font-weight:500;color:var(--tx2);min-height:36px}
.chip[aria-pressed="true"]{background:rgba(139,92,246,.25);color:#fff;border-color:rgba(139,92,246,.5)}

/* ---------- Modal / toast / notif ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(5,7,12,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .2s}
.mbox{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);animation:pop .25s ease-out}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.bigcard{perspective:1100px;cursor:pointer;min-height:300px}
.bigcard .fi{min-height:300px}
.bigcard .ff{padding:22px;gap:8px}
.bigcard .w{font-size:2.25rem}
.blur{filter:blur(7px);user-select:none}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--vio);border-radius:12px;padding:10px 14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.7);animation:up .25s ease-out;font-size:.9375rem}
.toast.ok{border-left-color:var(--mint)} .toast.warn{border-left-color:var(--warn)}
.notif{position:absolute;right:0;top:52px;width:min(340px,calc(100vw - 32px));background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 24px 60px -16px rgba(0,0,0,.8);z-index:40;animation:pop .2s ease-out;display:grid;gap:6px}
.notif div{display:flex;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04)}
.rel{position:relative}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:#000;color:#fff;font-size:.6875rem;padding:3px 8px;border-radius:6px;z-index:60;pointer-events:none}

/* ---------- Quiz / practice ---------- */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);min-height:52px;transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not(:disabled){border-color:rgba(139,92,246,.6);background:rgba(139,92,246,.12)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--mint);background:rgba(94,234,212,.14);animation:pulse .45s}
.opt.no{border-color:var(--bad);background:rgba(251,113,133,.14);animation:shake .4s}
.opt .k{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-weight:700;font-size:.8125rem;flex:none}
.qtype{display:grid;gap:8px;text-align:left;width:100%;padding:16px;border-radius:16px;background:rgba(255,255,255,.04);border:1.5px solid var(--line);transition:border-color .2s,background .2s}
.qtype[aria-pressed="true"]{border-color:var(--vio);background:rgba(139,92,246,.16)}
.qtype i,.qtype svg{color:var(--blue)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .opt{justify-content:center;text-align:center;overflow-wrap:anywhere}
.mt .opt.sel{border-color:var(--blue);background:rgba(96,165,250,.16)}
.score{font-size:3.25rem;font-weight:800;background:linear-gradient(90deg,var(--vio),var(--blue),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.prow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .e{font-weight:700}
.kbd{font-size:.6875rem;padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx2)}

/* ---------- Charts ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars div{flex:1;display:grid;grid-template-rows:1fr auto;gap:6px;height:100%;justify-items:center;min-width:0;text-align:center}
.bars .col{width:100%;max-width:38px;align-self:end;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--vio),var(--blue));min-height:4px;transition:height .7s cubic-bezier(.2,.8,.2,1);position:relative}
.bars .col span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.6875rem;color:var(--tx2)}
.bars small{font-size:.6875rem;color:var(--tx2)}
.skel{height:110px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:shim 1.1s linear infinite}
.sw{position:relative;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--vio)} .sw[aria-checked="true"]::after{transform:translateX(20px)}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set:first-of-type{border-top:0}
.set .inp{width:auto;min-width:140px}
input[type=range]{accent-color:var(--vio);width:160px}

@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotateX(72deg) rotate(360deg)}}
@keyframes flame{50%{transform:scale(1.18) rotate(-4deg)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.025)}}
@keyframes shim{to{background-position:-200% 0}}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .filters{grid-template-columns:1fr 1fr} .filters .full{grid-column:1/-1}}

}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pad(n){return n<10?"0"+n:""+n}
function ymd(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function reduced(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}}
var KEY="wordverse.v1";
function defData(){return {learned:{},fav:{},quiz:[],act:{},days:{},hist:[],recent:[],set:{name:"Learner",goal:5,accent:"en-US",rate:1,collapsed:false,slots:true}}}
function loadData(){
  var d=defData();
  try{var t=localStorage.getItem(KEY); if(t){var p=JSON.parse(t); Object.keys(d).forEach(function(k){if(p[k]!==undefined)d[k]=(k==="set")?Object.assign(d.set,p.set):p[k]})}}catch(e){}
  return d;
}

/* ---------------------------------------------------------------------
   Derived progress
   --------------------------------------------------------------------- */
function learnedCount(){return Object.keys(S.d.learned).length}
function isL(id){return !!S.d.learned[id]}
function isF(id){return !!S.d.fav[id]}
function todayLearned(){return S.d.act[ymd()]||0}
function streak(){var n=0,d=new Date(); if(!S.d.days[ymd(d)])d.setDate(d.getDate()-1); while(S.d.days[ymd(d)]){n++;d.setDate(d.getDate()-1)} return n}
function level(){var n=1+Math.floor(learnedCount()/5), t=["Beginner","Explorer","Scholar","Master","Legend"]; return {n:n,t:t[Math.min(4,Math.floor((n-1)/3))]}}
function catWords(c){return WORDS.filter(function(w){return w.c===c})}
function catProg(c){var ws=catWords(c),l=ws.filter(function(w){return isL(w.id)}).length; return {t:ws.length,l:l,p:ws.length?Math.round(l/ws.length*100):0}}
function catDiff(c){var ws=catWords(c); if(!ws.length)return 1; var a=ws.reduce(function(s,w){return s+w.lv},0)/ws.length; return a<1.67?1:a<2.34?2:3}
function dailyWord(){var d=new Date(), n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); return WORDS[n%WORDS.length]}
function mark(){S.d.days[ymd()]=1}
function pushHist(t,label){S.d.hist.unshift({t:t,l:label,at:Date.now()}); S.d.hist=S.d.hist.slice(0,40)}
function touchCat(c){S.d.recent=[c].concat(S.d.recent.filter(function(x){return x!==c})).slice(0,6)}

/* ---------------------------------------------------------------------
   Toast, speech, confetti
   --------------------------------------------------------------------- */
function toast(m,kind){
  var t=document.createElement("div"); t.className="toast "+(kind||""); t.textContent=m; $("#toasts").appendChild(t);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},2600);
}
function say(text){
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){toast("This browser does not support speech playback.","warn");return false}
  try{
    var u=new SpeechSynthesisUtterance(text), vs=speechSynthesis.getVoices()||[], a=S.d.set.accent;
    u.lang=a; u.rate=S.d.set.rate;
    var v=vs.filter(function(x){return x.lang.replace("_","-")===a})[0]||vs.filter(function(x){return x.lang.slice(0,2)==="en"})[0];
    if(v)u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u); return true;
  }catch(e){toast("Could not play audio.","warn");return false}
}
function confetti(){
  if(reduced())return;
  try{
    var cv=document.createElement("canvas"); cv.setAttribute("aria-hidden","true");
    cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120";
    var W=cv.width=innerWidth,H=cv.height=innerHeight; document.body.appendChild(cv);
    var cx=cv.getContext("2d"),cols=["#8B5CF6","#60A5FA","#5EEAD4","#F8FAFC","#FBBF24"],ps=[];
    for(var i=0;i<80;i++)ps.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*11,vy:-Math.random()*12-3,s:5+Math.random()*6,c:cols[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.4});
    var t0=Date.now();
    (function f(){var el=Date.now()-t0;cx.clearRect(0,0,W,H);
      ps.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-el/1700);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()});
      if(el<1700)requestAnimationFrame(f);else if(cv.parentNode)cv.parentNode.removeChild(cv)})();
  }catch(e){}
}

/* ---------------------------------------------------------------------
   Spline slots (with graceful fallback)
   --------------------------------------------------------------------- */
function splineOk(u){return /^https:\/\//.test(u||"")}
function anySpline(){return Object.keys(SPLINE).some(function(k){return splineOk(SPLINE[k])})}
function fallbackArt(){return '<div class="orb" aria-hidden="true"><span class="ring r1"></span><span class="ring r2"></span><span class="core"></span><b class="chip c1">Aa</b><b class="chip c2">ABC</b><b class="chip c3">?!</b><span class="shadow"></span></div>'}
function slot(key,label,cls){
  var u=SPLINE[key], ok=splineOk(u)&&!S.splineFail;
  return '<div class="slot '+(cls||key)+'" data-slot="'+key+'">'+(ok?'<spline-viewer url="'+esc(u)+'" loading-anim-type="spinner-small-dark"></spline-viewer>':fallbackArt())+(S.d.set.slots&&!ok?'<span class="slotchip">3D slot · '+esc(label)+'</span>':'')+'</div>';
}
var splineLoading=false;
function ensureSpline(){
  if(!anySpline()||S.splineFail||splineLoading||customElements.get("spline-viewer"))return;
  splineLoading=true;
  var s=document.createElement("script"); s.type="module"; s.src=SPLINE_VIEWER;
  s.onerror=function(){failSpline()}; document.head.appendChild(s);
  setTimeout(function(){if(!customElements.get("spline-viewer"))failSpline()},6000);
}
function failSpline(){if(S.splineFail)return; S.splineFail=true; render(true)}

/* ---------------------------------------------------------------------
   Learned / favorite actions
   --------------------------------------------------------------------- */
function toggleLearned(id){
  var w=BYID[id]; if(!w)return;
  if(isL(id)){delete S.d.learned[id]; toast("Moved back to learning.")}
  else{
    S.d.learned[id]=Date.now(); var t=ymd(); S.d.act[t]=(S.d.act[t]||0)+1; mark(); touchCat(w.c); pushHist("learned",w.w);
    var tl=todayLearned(), g=S.d.set.goal;
    if(tl===g){toast("Daily goal reached! 🎉","ok"); confetti()} else toast("Marked as learned: "+w.w,"ok");
  }
  save();
}
function toggleFav(id){
  if(isF(id)){delete S.d.fav[id]; toast("Removed from favorites.")} else {S.d.fav[id]=Date.now(); toast("Saved to favorites.","ok")}
  save();
}

function filtered(){
  var f=S.vf, q=S.vq.trim().toLowerCase();
  return WORDS.filter(function(w){
    if(f.cat&&w.c!==f.cat)return false; if(f.cat&&f.sub>=0&&w.s!==f.sub)return false;
    if(f.lv&&w.lv!==f.lv)return false;
    if(f.st==="learned"&&!isL(w.id))return false; if(f.st==="unlearned"&&isL(w.id))return false;
    if(f.fav&&!isF(w.id))return false;
    if(q&&w.w.toLowerCase().indexOf(q)<0&&w.th.indexOf(q)<0&&w.def.toLowerCase().indexOf(q)<0&&w.syn.join(" ").toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function vocabResults(){
  var list=filtered(), f=S.vf, show=list.slice(0,f.n);
  if(!list.length)return emptyState("No words found","Try a different search or clear a filter.",'<button class="btn sm ghost" data-a="clearf">Clear filters</button>');
  return '<p class="muted small" style="margin:12px 0">'+list.length+' word'+(list.length===1?"":"s")+'</p><div class="gauto">'+show.map(wordCard).join("")+'</div>'+(list.length>show.length?'<div class="row" style="justify-content:center;margin-top:18px"><button class="btn ghost" data-a="more">Show more ('+(list.length-show.length)+' left)</button></div>':'');
}

/* ----- Practice (flashcard learning mode) ----- */
function scopeWords(scope){
  if(scope==="fav")return WORDS.filter(function(w){return isF(w.id)});
  if(scope==="new")return WORDS.filter(function(w){return !isL(w.id)});
  if(scope.indexOf("cat:")===0){var c=+scope.slice(4); return WORDS.filter(function(w){return w.c===c})}
  return WORDS.slice();
}
function scopeSelect(sel){
  return '<select class="inp" data-cfg="scope" aria-label="Word set"><option value="all"'+(sel==="all"?" selected":"")+'>All words ('+WORDS.length+')</option><option value="new"'+(sel==="new"?" selected":"")+'>Not learned yet ('+scopeWords("new").length+')</option><option value="fav"'+(sel==="fav"?" selected":"")+'>My favorites ('+scopeWords("fav").length+')</option>'+CATS.map(function(c,i){return '<option value="cat:'+(i+1)+'"'+(sel==="cat:"+(i+1)?" selected":"")+'>'+pad(i+1)+' '+esc(c[0])+'</option>'}).join("")+'</select>';
}
function startPractice(ids,cat){

  S.pr={list:ids,i:0,rev:false,mast:0,end:false}; if(cat)touchCat(cat); save(); go("practice",true);
}

/* ----- Quiz ----- */
function buildQuiz(type,scope){
  var pool=scopeWords(scope), need=type==="match"?5:4;
  if(type==="fill")pool=pool.filter(function(w){return new RegExp("\\b"+w.w+"\\b","i").test(w.ex)});
  if(pool.length<need){toast("Need at least "+need+" words in this set to play this quiz.","warn");return null}
  var Q={type:type,scope:scope,i:0,score:0,wrong:[],ans:null,done:false,items:[],rounds:null,total:0};
  if(type==="match"){
    var rn=pool.length>=10?2:1; var ws=shuffle(pool); Q.rounds=[]; Q.total=rn*5;
    for(var r=0;r<rn;r++){var ids=ws.slice(r*5,r*5+5).map(function(w){return w.id}); Q.rounds.push({ids:ids,right:shuffle(ids),dn:{},sel:null,bad:-1,miss:{}})}
    return Q;
  }
  var items=shuffle(pool).slice(0,10);
  Q.items=items.map(function(w){
    var others=shuffle(WORDS.filter(function(x){return x.id!==w.id})).slice(0,3), opts=shuffle([w].concat(others));
    var it={id:w.id,opts:opts.map(function(x){return x.id}),a:opts.indexOf(w)};
    if(type==="fill")it.s=w.ex.replace(new RegExp("\\b"+w.w+"\\b","i"),"_____");
    return it;
  });
  Q.total=Q.items.length; return Q;
}
function quizSetup(){
  var h=pageTitle("Quiz","Pick a quiz type and a word set.");
  h+='<div class="gap"><div class="g3" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">'+QTYPES.map(function(t){return '<button class="qtype" data-a="qtype" data-t="'+t[0]+'" aria-pressed="'+(S.qCfg.type===t[0])+'">'+ic(t[3])+'<b>'+t[1]+'</b><span class="muted small">'+t[2]+'</span></button>'}).join("")+'</div>'+

  if(S.d.quiz.length){h+='<div class="sech" style="margin-top:22px"><h2>Recent scores</h2></div><div class="card">'+S.d.quiz.slice(-5).reverse().map(function(q){var tt=QTYPES.filter(function(t){return t[0]===q.t})[0];return '<div class="prow"><b>'+esc(tt?tt[1]:q.t)+'</b><span class="muted small">'+esc(new Date(q.at).toLocaleDateString())+'</span><span style="margin-left:auto;font-weight:700">'+q.s+'/'+q.n+' · '+Math.round(q.s/q.n*100)+'%</span></div>'}).join("")+'</div>'}
  return h;
}
function quizRun(){
  var Q=S.qz, tt=QTYPES.filter(function(t){return t[0]===Q.type})[0];

     '<p class="muted small" style="margin:14px 0 10px">Tap an English word, then its Thai meaning.</p><div class="mt"><div class="gap" style="gap:8px">'+R.ids.map(function(id){var d=R.dn[id];return '<button class="opt'+(d?' ok':(R.sel===id?' sel':''))+'" data-a="mL" data-id="'+id+'"'+(d?' disabled':'')+'>'+esc(BYID[id].w)+'</button>'}).join("")+'</div><div class="gap" style="gap:8px">'+R.right.map(function(id){var d=R.dn[id];return '<button class="opt'+(d?' ok':(R.bad===id?' no':''))+'" data-a="mR" data-id="'+id+'"'+(d?' disabled':'')+'>'+esc(BYID[id].th)+'</button>'}).join("")+'</div></div></div>';
  }

  else if(Q.type==="th2en"){q='<div class="big" style="font-size:1.75rem">'+esc(w.th)+'</div>'; sub="Choose the English word"}
  else if(Q.type==="fill"){q='<div style="font-size:1.25rem;font-weight:600">'+esc(it.s)+'</div>'; sub="Choose the word that fits"}
  else {q='<button class="btn" data-a="say" data-t="'+esc(w.w)+'">'+ic("volume-2")+'Play word</button>'; sub="Choose the word you hear"}
  var h=pageTitle("Quiz")+'<div class="card" style="max-width:640px">'+head+'<div class="row small muted" style="justify-content:space-between;margin:8px 0"><span>Question '+(Q.i+1)+' / '+Q.total+'</span><span>Score '+Q.score+'</span></div>'+bar(Math.round(Q.i/Q.total*100))+
   '<div style="margin:20px 0 6px;display:grid;gap:6px">'+q+'</div><p class="muted small" style="margin-bottom:12px">'+sub+'</p><div class="gap" style="gap:10px">'+it.opts.map(function(id,oi){
     var o=BYID[id], t=(Q.type==="mc")?o.th:o.w, c="";
     if(Q.ans!==null){c=oi===it.a?" ok":(oi===Q.ans?" no":"")}
     return '<button class="opt'+c+'" data-a="qans" data-i="'+oi+'"'+(Q.ans!==null?' disabled':'')+'><span class="k">'+"ABCD"[oi]+'</span><span>'+esc(t)+'</span></button>'}).join("")+'</div>';
  if(Q.ans!==null){
    var ok=Q.ans===it.a;
    h+='<div class="card" style="margin-top:14px;background:'+(ok?'rgba(94,234,212,.1)':'rgba(251,113,133,.1)')+'"><b>'+(ok?'Correct!':'Not quite')+'</b><p class="small muted" style="margin-top:4px">'+esc(w.w)+' = '+esc(w.th)+' · “'+esc(w.ex)+'”</p></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-a="qnext">'+(Q.i===Q.total-1?"See results":"Next")+ic("chevron-right")+'</button></div>';
  }
  return h+'</div>';
}
function quizDone(){
  var Q=S.qz, pct=Math.round(Q.score/Q.total*100), msg=pct>=90?"Outstanding!":pct>=70?"Great work!":pct>=50?"Good effort, keep going!":"Every mistake is a lesson.";
  var h=pageTitle("Quiz results")+'<div class="card empty" style="max-width:640px">'+slot("quiz","Quiz complete","empty")+'<div class="score">'+Q.score+' / '+Q.total+'</div><h3>'+pct+'% · '+msg+'</h3><div class="row" style="justify-content:center"><button class="btn" data-a="qretry">'+ic("rotate-ccw")+'Retry</button><button class="btn ghost" data-a="qquit">New quiz</button>'+(Q.wrong.length?'<button class="btn ghost" data-a="qprac">Practice mistakes</button>':'')+'</div></div>';

  var bn=[["home","Home","layout-dashboard"],["vocabulary","Words","book-open"],["practice","Practice","layers"],["quiz","Quiz","list-checks"],["progress","Progress","trending-up"]];
  $("#bnav").innerHTML=bn.map(function(n){return '<button data-a="go" data-p="'+n[0]+'"'+(S.page===n[0]?' aria-current="page"':'')+'>'+ic(n[2])+n[1]+'</button>'}).join("");
  var lv=level(); $("#lvl").innerHTML=ic("trending-up")+'Lv '+lv.n+' · '+lv.t;
  $("#stkn").textContent=streak();
  $("#av").textContent=(S.d.set.name||"L").trim().charAt(0).toUpperCase()||"L";
  $("#bdot").style.display=todayLearned()>=S.d.set.goal?"none":"block";
  var np=$("#np"); np.innerHTML=S.notif?'<div class="notif" role="dialog" aria-label="Notifications">'+notifItems().map(function(n){return '<div><span style="color:var(--mint)">'+ic(n.i)+'</span><span><b>'+esc(n.t)+'</b><br><span class="muted small">'+esc(n.m)+'</span></span></div>'}).join("")+'</div>':"";
  var g=$("#gq"); if(g&&document.activeElement!==g)g.value=S.page==="vocabulary"?S.vq:g.value;
}
function render(keepScroll){
  var v=$("#view"); v.innerHTML=pages[S.page](); v.classList.remove("enter"); void v.offsetWidth; if(!keepScroll)v.classList.add("enter");
  renderChrome(); refreshIcons(); ensureSpline();
}
function go(p,keep){
  S.page=p; S.notif=false; $("#app").classList.remove("open");
  if(S.busy)return;
  if(reduced()||keep){render(keep); if(!keep)window.scrollTo(0,0); return}
  S.busy=true; $("#view").innerHTML='<div class="gap"><div class="skel" style="height:56px;width:50%"></div><div class="skel"></div><div class="skel"></div></div>'; renderChrome(); refreshIcons();
  window.scrollTo(0,0);
  setTimeout(function(){S.busy=false; render()},160);
}
function updateVres(){var r=$("#vres"); if(r){r.innerHTML=vocabResults(); refreshIcons()}}

/* ---------------------------------------------------------------------
   Events
   --------------------------------------------------------------------- */
function refreshHere(){render(true)}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(S.notif&&!e.target.closest("#np")&&!(el&&el.dataset.a==="notif")){S.notif=false; renderChrome(); refreshIcons()}
  if($("#app").classList.contains("open")&&!e.target.closest("#side")&&!(el&&el.dataset.a==="menu"))$("#app").classList.remove("open");
  if(!el)return;
  var a=el.dataset.a, id=+el.dataset.id;
  if(a==="ovclose"){if(e.target===el){S.modal=null; renderModal()} return}
  if(a==="go"){go(el.dataset.p)}
  else if(a==="menu"){$("#app").classList.toggle("open")}
  else if(a==="notif"){S.notif=!S.notif; renderChrome(); refreshIcons()}
  else if(a==="collapse"){S.d.set.collapsed=!S.d.set.collapsed; save(); renderChrome(); refreshIcons(); if(S.page==="settings")refreshHere()}
  else if(a==="slots"){S.d.set.slots=!S.d.set.slots; save(); refreshHere()}
  else if(a==="say"){say(el.dataset.t)}
  else if(a==="flip"){el.classList.toggle("flip")}
  else if(a==="flipbig"){el.classList.toggle("flip"); if(S.modal)S.modal.flip=el.classList.contains("flip"); if(S.pr)S.pr.rev=el.classList.contains("flip")}
  else if(a==="fav"){toggleFav(id); favSync(id)}
  else if(a==="unfav"){toggleFav(id); refreshHere(); renderChrome(); refreshIcons()}
  else if(a==="lrn"){toggleLearned(id); lrnSync(id)}
  else if(a==="detail"){openDetail(id,S.page==="vocabulary"?null:(S.page==="favorites"?Object.keys(S.d.fav).map(Number):null))}
  else if(a==="mclose"){S.modal=null; renderModal()}
  else if(a==="mprev"||a==="mnext"){var M=S.modal; M.i=(M.i+(a==="mnext"?1:-1)+M.list.length)%M.list.length; M.flip=false; renderModal()}
  else if(a==="mtr"){S.modal.tr=!S.modal.tr; renderModal()}
  else if(a==="openCat"){S.vf={cat:+el.dataset.c,sub:-1,lv:0,st:"all",fav:false,n:24}; S.vq=""; go("vocabulary")}
  else if(a==="clearf"){S.vf={cat:0,sub:-1,lv:0,st:"all",fav:false,n:24}; S.vq=""; $("#gq").value=""; render(true)}
  else if(a==="favf"){S.vf.fav=!S.vf.fav; S.vf.n=24; render(true)}
  else if(a==="sub"){S.vf.sub=+el.dataset.s; S.vf.n=24; render(true)}
  else if(a==="more"){S.vf.n+=24; updateVres()}
  else if(a==="pracCat"){var c=+el.dataset.c, ws=catWords(c), un=ws.filter(function(w){return !isL(w.id)}); startPractice(shuffle((un.length?un:ws)).map(function(w){return w.id}),c)}
  else if(a==="shuf"){S.prCfg.shuffle=!S.prCfg.shuffle; refreshHere()}
  else if(a==="pstart"){var ids=scopeWords(S.prCfg.scope).map(function(w){return w.id}); startPractice(S.prCfg.shuffle?shuffle(ids):ids)}
  else if(a==="pagain"){S.pr=null; refreshHere()}
  else if(a==="pexit"){S.pr=null; refreshHere()}
  else if(a==="pprev"){practiceMove(-1)}
  else if(a==="pnext"){practiceMove(1)}
  else if(a==="favReview"){startPractice(shuffle(Object.keys(S.d.fav).map(Number)).filter(function(i){return BYID[i]}))}
  else if(a==="favQuiz"){S.qCfg={type:"mc",scope:"fav"}; S.qz=buildQuiz("mc","fav"); if(S.qz){go("quiz",true)}}
  else if(a==="qtype"){S.qCfg.type=el.dataset.t; refreshHere()}
  else if(a==="qstart"){S.qz=buildQuiz(S.qCfg.type,S.qCfg.scope); if(S.qz){render(true); window.scrollTo(0,0); if(S.qz.type==="listen")autoSay()}}
  else if(a==="qquit"){S.qz=null; refreshHere()}
  else if(a==="qretry"){S.qz=buildQuiz(S.qz.type,S.qz.scope); refreshHere(); if(S.qz&&S.qz.type==="listen")autoSay()}
  else if(a==="qprac"){startPractice(S.qz.wrong.slice())}
  else if(a==="qans"){var Q=S.qz; if(!Q||Q.ans!==null)return; Q.ans=+el.dataset.i; var it=Q.items[Q.i]; if(Q.ans===it.a)Q.score++; else Q.wrong.push(it.id); render(true)}
  else if(a==="qnext"){var Q2=S.qz; if(Q2.i>=Q2.total-1){finishQuiz()}else{Q2.i++;Q2.ans=null} render(true); window.scrollTo(0,0); if(!Q2.done&&Q2.type==="listen")autoSay()}
  else if(a==="mL"){var R=S.qz.rounds[S.qz.i]; R.sel=id; R.bad=-1; render(true)}
  else if(a==="mR"){matchPick(id)}
  else if(a==="resetAsk"){S.modal={type:"reset"}; renderModal()}
  else if(a==="resetDo"){S.d=defData(); save(); S.modal=null; S.pr=null; S.qz=null; renderModal(); toast("Progress has been reset."); render(true)}
});
document.addEventListener("keydown",function(e){
  var tg=e.target, typing=tg&&(tg.tagName==="INPUT"||tg.tagName==="SELECT"||tg.tagName==="TEXTAREA");
  if(e.key==="Escape"){if(S.modal){S.modal=null;renderModal()} if(S.notif){S.notif=false;renderChrome();refreshIcons()} $("#app").classList.remove("open"); return}
  if((e.key==="Enter"||e.key===" ")&&tg&&tg.classList&&tg.classList.contains("fcard")){e.preventDefault(); tg.click(); return}
  if(typing)return;
  var M=S.modal&&S.modal.type==="word"?S.modal:null, P=(!M&&S.page==="practice"&&S.pr&&!S.pr.end)?S.pr:null;
  if(!M&&!P)return;
  if(e.key==="ArrowRight"){e.preventDefault(); M?($('[data-a="mnext"]').click()):practiceMove(1)}
  else if(e.key==="ArrowLeft"){e.preventDefault(); M?($('[data-a="mprev"]').click()):practiceMove(-1)}
  else if(e.key===" "){if(tg&&tg.tagName==="BUTTON")return; e.preventDefault(); var c=$(".bigcard"); if(c){c.classList.toggle("flip"); if(M)M.flip=c.classList.contains("flip"); else P.rev=c.classList.contains("flip")}}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="gq"){S.vq=t.value; if(S.page!=="vocabulary"){S.vf.n=24; go("vocabulary",true); var g=$("#gq"); if(g)g.focus()} else {var vq=$("#vq"); if(vq)vq.value=t.value; updateVres()}}
  else if(t.id==="vq"){S.vq=t.value; S.vf.n=24; $("#gq").value=t.value; updateVres()}
  else if(t.id==="fq"){S.fq=t.value; var l=$("#favlist"); if(l){var q=S.fq.trim().toLowerCase(); l.innerHTML=favRows(Object.keys(S.d.fav).map(Number).filter(function(i){return BYID[i]}).map(function(i){return BYID[i]}).filter(function(w){return !q||w.w.toLowerCase().indexOf(q)>=0||w.th.indexOf(q)>=0})); refreshIcons()}}
  else if(t.dataset.s==="rate"){S.d.set.rate=+t.value; var rt=$("#rt"); if(rt)rt.textContent=(+t.value).toFixed(1)+"×"; save()}
  else if(t.dataset.s==="name"){S.d.set.name=t.value.trim()||"Learner"; save(); renderChrome(); refreshIcons()}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.f){var k=t.dataset.f, v=t.value; S.vf[k]=(k==="st")?v:+v; if(k==="cat")S.vf.sub=-1; S.vf.n=24; render(true)}
  else if(t.dataset.cfg==="scope"){S.prCfg.scope=t.value; render(true)}
  else if(t.dataset.qcfg==="scope"){S.qCfg.scope=t.value; render(true)}
  else if(t.dataset.s==="goal"){S.d.set.goal=+t.value; save(); renderChrome(); refreshIcons(); toast("Daily target updated.","ok")}
  else if(t.dataset.s==="accent"){S.d.set.accent=t.value; save(); say("Hello, welcome to Wordverse.")}
});
function favSync(id){
  var on=isF(id);
  document.querySelectorAll('[data-a="fav"][data-id="'+id+'"],[data-a="fav"]').forEach(function(b){if(+b.dataset.id===id){b.classList.toggle("on",on); b.setAttribute("aria-pressed",on)}});
  if(S.modal&&S.modal.type==="word")renderModal();
  renderChrome(); refreshIcons();
}
function lrnSync(id){
  if(S.modal&&S.modal.type==="word"){renderModal()}
  if(S.page==="vocabulary"){var flipped=[].map.call(document.querySelectorAll(".fcard.flip:not(.bigcard)"),function(c){return c.dataset.id}); updateVres(); flipped.forEach(function(i){var c=document.querySelector('.fcard[data-id="'+i+'"]'); if(c)c.classList.add("flip")})}
  else if(S.page==="practice"){var c=$(".bigcard"), fl=c&&c.classList.contains("flip"); render(true); if(fl){var c2=$(".bigcard"); if(c2)c2.classList.add("flip")}; if(S.pr&&isL(id))S.pr.mast++}
  else render(true);
  renderChrome(); refreshIcons();
}
function practiceMove(d){
  var P=S.pr; if(!P)return;
  var n=P.i+d; if(n<0)return;
  if(n>=P.list.length){P.end=true; mark(); save(); confetti(); refreshHere(); return}
  P.i=n; P.rev=false; refreshHere();
}
function autoSay(){var Q=S.qz; if(Q&&Q.items[Q.i])setTimeout(function(){say(BYID[Q.items[Q.i].id].w)},250)}
function matchPick(id){
  var Q=S.qz, R=Q.rounds[Q.i]; if(R.sel===null){toast("Tap an English word first.","warn");return}
  if(id===R.sel){R.dn[id]=1; R.sel=null; R.bad=-1; if(!R.miss[id])Q.score++; if(Object.keys(R.dn).length===5){if(Q.i>=Q.rounds.length-1){finishQuiz()}else{Q.i++}}}
  else{R.miss[R.sel]=1; R.bad=id; if(Q.wrong.indexOf(R.sel)<0)Q.wrong.push(R.sel); R.sel=null}
  render(true);
}

/* ---------------------------------------------------------------------
   Start
   --------------------------------------------------------------------- */
try{if("speechSynthesis" in window&&speechSynthesis.getVoices)speechSynthesis.getVoices()}catch(e){}
$("#view").innerHTML='<div class="gap"><div class="skel" style="height:56px;width:50%"></div><div class="skel" style="height:240px"></div><div class="skel"></div></div>';
setTimeout(function(){render()},reduced()?0:260);
})();
</script>
