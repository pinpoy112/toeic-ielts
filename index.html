<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TOEIC IELTS Coach</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-column phone app. Bottom tabs, unit list, five-step unit pages.
   Highlighter yellow marks the key terms, like an exam paper that has been studied. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#14262B; --muted:#587076; --line:#D9E1E3; --soft:#E8EFF0;
  --accent:#0E7C7B; --accent-ink:#FFFFFF; --accent-soft:#D9EEEC;
  --mark:#FFE27A; --mark-ink:#3A2F00;
  --good:#1B7F51; --good-bg:#E1F3E9; --bad:#B03A2E; --bad-bg:#FAE8E5;
  --f-body:"Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Space Grotesk","Noto Sans Thai",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Noto Serif Thai",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1D; --surface:#162529; --ink:#E7F0F1; --muted:#93A9AD; --line:#27393D; --soft:#1D3034;
    --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#15373A;
    --mark:#7A6410; --mark-ink:#FFF3C4;
    --good:#5CCB92; --good-bg:#16352A; --bad:#F08A7E; --bad-bg:#3A1F1C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1D; --surface:#162529; --ink:#E7F0F1; --muted:#93A9AD; --line:#27393D; --soft:#1D3034;
  --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#15373A;
  --mark:#7A6410; --mark-ink:#FFF3C4;
  --good:#5CCB92; --good-bg:#16352A; --bad:#F08A7E; --bad-bg:#3A1F1C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-block:0 96px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:640px; margin:0 auto}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--f-head); line-height:1.25; margin:0; text-wrap:balance}
p{margin:0}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:16px 8px}
.brand{font-family:var(--f-head); font-weight:700; font-size:1.15rem; letter-spacing:.01em}
.brand i{font-style:normal; background:linear-gradient(transparent 55%, var(--mark) 55%); padding:0 3px}
.sync{font-size:.75rem; color:var(--muted); text-align:right; min-width:0}

.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--soft); padding:4px; border-radius:12px}
.seg button{border:0; background:transparent; padding:10px 8px; border-radius:9px; font-family:var(--f-head); font-weight:600; font-size:1rem; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}

.stack{display:flex; flex-direction:column; gap:16px; padding-block:8px 0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0}
.lbl{font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}

.cont{background:var(--accent); color:var(--accent-ink); border-color:transparent; display:flex; flex-direction:column; gap:10px}
.cont .lbl{color:inherit; opacity:.8}
.cont h2{font-size:1.25rem}
.cont p{opacity:.9}
.btn{border:0; border-radius:10px; padding:12px 18px; font-weight:600; background:var(--accent); color:var(--accent-ink); min-height:46px}
.btn.alt{background:var(--soft); color:var(--ink)}
.btn.line{background:transparent; border:1px solid var(--line); color:var(--ink)}
.btn.inv{background:var(--accent-ink); color:var(--accent)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn svg{vertical-align:-4px; margin-right:6px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

.bar{height:8px; background:var(--soft); border-radius:99px; overflow:hidden}
.bar b{display:block; height:100%; background:var(--accent); border-radius:99px}
.cont .bar{background:rgba(255,255,255,.25)} .cont .bar b{background:var(--accent-ink)}

.units{display:flex; flex-direction:column; gap:10px}
.unit{display:grid; grid-template-columns:44px 1fr 20px; gap:12px; align-items:center; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px}
.unit .no{font-family:var(--f-head); font-weight:700; font-size:1.25rem; width:44px; height:44px; border-radius:11px; background:var(--soft); display:grid; place-items:center}
.unit.full .no{background:var(--accent); color:var(--accent-ink)}
.unit h3{font-size:1rem}
.unit .th{font-size:.875rem; color:var(--muted)}
.dots{display:flex; gap:5px; margin-top:6px}
.dots i{width:18px; height:6px; border-radius:99px; background:var(--soft)}
.dots i.on{background:var(--accent)}
.unit > svg{color:var(--muted)}

.back{display:inline-flex; align-items:center; gap:4px; border:0; background:none; color:var(--accent); font-weight:600; padding:8px 0}
.uh{display:flex; flex-direction:column; gap:4px; padding-block:4px 8px}
.uh .tag{align-self:flex-start; background:var(--mark); color:var(--mark-ink); font-size:.75rem; font-weight:700; padding:2px 8px; border-radius:6px}
.uh h1{font-size:1.5rem}
.steps{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.steps button{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 2px; font-size:.8125rem; font-weight:600; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0}
.steps button.cur{border-color:var(--accent); color:var(--ink); background:var(--accent-soft)}
.steps button .ck{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center}
.steps button.done .ck{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.steps button .ck svg{width:10px; height:10px}

.sec h2{font-size:1.125rem; margin-bottom:8px}
.pt{padding-block:10px; border-top:1px solid var(--line)}
.pt:first-of-type{border-top:0; padding-top:0}
.pt .en{font-family:var(--f-read); font-size:1.0625rem; font-weight:600}
.pt .en span{background:linear-gradient(transparent 60%, var(--mark) 60%)}
.pt .tn{font-size:.9375rem; color:var(--muted)}
.vocab{display:grid; grid-template-columns:1fr; gap:0}
.vw{padding-block:10px; border-top:1px solid var(--line); display:grid; gap:2px}
.vw:first-child{border-top:0}
.vw b{font-family:var(--f-read); font-size:1.0625rem}
.vw b span{background:var(--mark); color:var(--mark-ink); padding:0 4px; border-radius:3px}
.vw em{font-family:var(--f-read); color:var(--muted); font-size:.9375rem}
.tipbox{background:var(--accent-soft); border-radius:10px; padding:12px 14px; font-size:.9375rem}

.passage{font-family:var(--f-read); font-size:1.125rem; line-height:1.75; display:flex; flex-direction:column; gap:12px}
.passage .hd{font-family:var(--f-head); font-weight:700; font-size:.9375rem}
.q{padding-block:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.q:first-of-type{border-top:0}
.qt{display:flex; gap:10px; font-weight:500}
.qn{flex:none; width:26px; height:26px; border-radius:50%; background:var(--soft); display:grid; place-items:center; font-family:var(--f-head); font-weight:700; font-size:.8125rem}
.opts{display:grid; gap:8px}
.opt{display:grid; grid-template-columns:28px 1fr; gap:8px; text-align:left; align-items:start; border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 12px; min-height:46px}
.opt .ol{font-family:var(--f-head); font-weight:700; color:var(--muted)}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.ok{border-color:var(--good); background:var(--good-bg)}
.opt.no{border-color:var(--bad); background:var(--bad-bg)}
.opt:disabled{cursor:default; color:var(--ink)}
.why{font-size:.9375rem; color:var(--muted); background:var(--soft); border-radius:10px; padding:10px 12px}
.result{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--accent-soft); border-radius:12px; padding:12px 14px}
.result b{font-family:var(--f-head); font-size:1.5rem}
.hint{color:var(--bad); font-size:.875rem; min-height:1.3em}

.player{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.player select{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; padding:10px 8px; font:inherit; min-height:46px}
details.tr{margin-top:12px}
details.tr summary{cursor:pointer; color:var(--accent); font-weight:600}
.script{font-family:var(--f-read); font-size:1.0625rem; margin-top:8px; display:flex; flex-direction:column; gap:6px}
.script b{font-family:var(--f-head); font-size:.8125rem; color:var(--muted); margin-right:6px}
.note{font-size:.875rem; color:var(--muted)}

textarea{width:100%; min-height:220px; resize:vertical; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); padding:12px; font-family:var(--f-read); font-size:1.0625rem; line-height:1.6}
.data{font-family:var(--f-head); background:var(--soft); border-radius:10px; padding:10px 12px; font-size:.9375rem; white-space:pre-wrap; overflow-x:auto}
.checks{display:grid; gap:6px; font-size:.9375rem}
.checks label{display:flex; gap:10px; align-items:flex-start}
.checks input{margin-top:5px; width:18px; height:18px; accent-color:var(--accent)}
.fb{white-space:pre-wrap; font-size:.9375rem; background:var(--soft); border-radius:12px; padding:12px 14px}
.model{white-space:pre-wrap; font-family:var(--f-read); font-size:1.0625rem; margin-top:8px}
ul.tips{margin:0; padding-left:20px; display:grid; gap:4px}

.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; min-width:0}
.tile b{display:block; font-family:var(--f-head); font-size:1.5rem; line-height:1.2}
.tile span{font-size:.75rem; color:var(--muted)}
.prow{padding-block:12px; border-top:1px solid var(--line); display:grid; gap:6px}
.prow:first-of-type{border-top:0}
.prow .meta{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.8125rem; color:var(--muted)}
.prow .meta b{color:var(--ink); font-family:var(--f-head)}
.links{display:grid; gap:6px}
.links a{color:var(--accent); font-weight:600}
.info{display:grid; grid-template-columns:1fr; gap:6px; font-size:.9375rem}
.info div{display:flex; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding-top:6px}
.info div:first-child{border-top:0; padding-top:0}
.info span{color:var(--muted)} .info b{text-align:right}
.pr-top{display:flex; justify-content:space-between; align-items:center; gap:10px}
.pr-q{font-size:1.125rem; font-weight:500}

.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.tabs .in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:2px}
.tabs button{border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px; color:var(--muted); font-size:.75rem; font-weight:600; border-radius:10px; min-height:52px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px; height:24px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.inp{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;min-height:46px;min-width:0;flex:1 1 150px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.owl{font-size:2.6rem;line-height:1;width:58px;height:58px;display:grid;place-items:center;background:var(--surface);border-radius:50%;border:2px solid var(--accent);flex:none;animation:bob 3s ease-in-out infinite}
.lvl{font-family:var(--f-head);font-size:1.0625rem}
.owlsay{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.9375rem;position:relative}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:.8125rem;font-weight:600}
.wotd{border-left:5px solid var(--mark)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{display:grid;gap:2px;justify-items:center;text-align:center;padding:10px 4px;border-radius:12px;background:var(--soft);opacity:.55;min-width:0}
.bdg.on{opacity:1;background:var(--accent-soft)}
.bdg .bi{font-size:1.75rem;line-height:1.2}
.bdg b{font-size:.8125rem;overflow-wrap:anywhere}
.bdg .small{font-size:.6875rem}
.xppop{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:var(--f-head);font-weight:700;font-size:1.5rem;color:var(--accent);background:var(--surface);border:2px solid var(--accent);border-radius:99px;padding:4px 16px;z-index:70;pointer-events:none;animation:rise 1.1s ease-out forwards}
.pop{animation:pop .35s ease-out}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-40px)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.owl,.pop,.xppop{animation:none}}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{padding:10px 2px;font-size:.9375rem}
.chip{display:inline-block;font-size:.6875rem;font-weight:600;background:var(--soft);color:var(--muted);padding:1px 7px;border-radius:99px;vertical-align:middle;margin-left:4px}
.unit.skip{opacity:.75}
.big{font-family:var(--f-head);font-size:2rem;line-height:1}
.todo{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:1fr 20px;gap:12px;align-items:center;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px}
.trow .th{font-size:.875rem;color:var(--muted)}
.trow>svg{color:var(--muted)}
.vcard{font-family:var(--f-read);font-size:2rem;font-weight:600;text-align:center;margin-top:8px}
.vex{font-family:var(--f-read);color:var(--muted);text-align:center;font-style:italic;margin-top:4px}
.vth{display:table;margin:16px auto 0;font-size:1.25rem;font-weight:600;background:linear-gradient(transparent 60%,var(--mark) 60%)}
.runbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:8px;border-bottom:1px solid var(--line)}
.tm{font-family:var(--f-head);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tm.low{color:var(--bad)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs button{min-width:0;line-height:1.2;text-align:center}
.wrow{display:grid;grid-template-columns:1fr auto auto auto;gap:4px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .en{font-family:var(--f-read);font-weight:600;font-size:1.0625rem;overflow-wrap:anywhere}
.wrow .wth{color:var(--muted);font-size:.9375rem}
.wrow .loc{font-size:.75rem;color:var(--muted)}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:10px;color:var(--muted);display:grid;place-items:center;flex:none}
.ib[aria-pressed="true"]{color:var(--accent)}
.acc{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:52px}
.acc[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.acc .bt1{display:block;font-size:.75rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9375rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.search .inp{flex:none}
.tabs button{font-size:.6875rem}
#lres:empty,#lkres:empty{display:none}
@media (prefers-reduced-motion: no-preference){ .bar b{transition:width .4s ease} }
@media (max-width:380px){ .tiles{grid-template-columns:1fr 1fr} .steps button{font-size:.75rem} }
</style>
</head>

 read:{title:"Notice to Staff: New Meeting Schedule",text:"Notice to Staff\n\nBeginning next month, department meetings will be held every second Wednesday at 9:00 a.m. instead of every Monday. The new schedule allows managers to review sales figures before discussions begin.\n\nEach team leader must send an agenda to the supervisor by the previous Friday. Meeting minutes will be posted on the intranet within two days. Staff members who cannot attend should inform their team leader in advance.",

 read:{title:"Quarterly Report Summary",text:"Quarterly Report Summary\n\nRevenue for the third quarter rose 8 percent compared with the same period last year, reaching $2.4 million. The increase was driven mainly by online sales, which grew twice as fast as in-store sales.\n\nHowever, shipping costs also climbed, reducing overall profit margins slightly. Management forecasts moderate growth in the fourth quarter and plans to expand the customer service team to handle higher order volumes.",

{id:"i1",tr:"ielts",title:"Reading: True / False / Not Given",th:"อ่าน: ข้อสอบ T/F/NG และการฟังกรอกแบบฟอร์ม",tag:"Reading + Listening S1",
 learn:{intro:"IELTS Reading ใช้เวลา 60 นาที มี 3 บทความ รวม 40 ข้อ ข้อ True / False / Not Given เป็นรูปแบบที่ผู้เรียนพลาดบ่อยที่สุด เพราะต้องแยก 'ขัดแย้ง' ออกจาก 'ไม่มีข้อมูล' บทนี้ยังฝึกฟังกรอกแบบฟอร์ม (Listening Section 1) ซึ่งเต็มไปด้วยตัวเลขและการสะกดชื่อ",
  pts:[["True = ข้อความตรงกับบทความ","บทความยืนยันตรงๆ หรือบอกเป็นคำพ้องความหมาย"],
       ["False = ข้อความขัดแย้งกับบทความ","บทความบอกตรงข้าม เช่น inside vs. outside"],
       ["Not Given = บทความไม่พูดถึง","ห้ามใช้ความรู้ส่วนตัวตัดสิน ถ้าหาหลักฐานในบทความไม่ได้ ให้เลือก Not Given"],
       ["ระวังคำจำกัด: all, only, never, always, some","ข้อความที่เปลี่ยนคำเหล่านี้จากบทความมักเป็น False หรือ Not Given"]],

 read:{title:"The Honeybee Dance",text:"Honeybees communicate the location of food through a movement known as the waggle dance. A forager that has found a rich source of nectar returns to the hive and moves in a figure-eight pattern on the vertical surface of the comb. The angle of the straight central run, measured against the vertical, shows the direction of the food relative to the sun, while the length of the run signals distance.\n\nResearchers first described this system in the 1940s. Since then, experiments have shown that bees can adjust the dance when the sun is hidden by clouds, although accuracy tends to fall. The dance is performed inside a dark hive, so other bees follow it by touch and by detecting vibrations rather than by sight.",
  qs:[{q:"The waggle dance is performed outside the hive.",o:TF,a:1,w:"False: บทความบอกว่า 'performed inside a dark hive' ตรงข้ามกับข้อความ"},
      {q:"The length of the central run shows how far away the food is.",o:TF,a:0,w:"True: 'the length of the run signals distance' (signals = shows)"},
      {q:"Younger bees perform the dance more accurately than older bees.",o:TF,a:2,w:"Not Given: บทความไม่ได้พูดถึงอายุของผึ้งเลย"}]},
 listen:{lines:[{s:"A",t:"Good morning, Riverside Language Centre. How can I help you?"},{s:"B",t:"Hello, I would like to enrol in the evening English course."},{s:"A",t:"Certainly. Could I have your surname, please?"},{s:"B",t:"Yes, it's Phongsri. That's P H O N G S R I."},{s:"A",t:"Thank you. And a contact number?"},{s:"B",t:"It's zero seven eight four, five five two, nine one six."},{s:"A",t:"Lovely. The course starts on the fourteenth of October. It runs on Tuesdays and Thursdays, from six thirty to eight thirty in the evening."},{s:"B",t:"And how much is the fee?"},{s:"A",t:"It's two hundred and eighty pounds, including all materials. Last year it was two hundred and fifty, but prices went up in September."},{s:"B",t:"That's fine. Thank you."}],
  qs:[{q:"When does the course start?",o:["4 October","14 October","18 October","24 October"],a:1,w:"'the fourteenth of October' ฟังให้ชัดระหว่าง fourteenth กับ fortieth"},
      {q:"On which days does the course run?",o:["Mondays and Wednesdays","Tuesdays and Thursdays","Wednesdays and Fridays","Saturdays and Sundays"],a:1,w:"'Tuesdays and Thursdays'"},
      {q:"What is the course fee?",o:["£250","£208","£280","£218"],a:2,w:"£280 คือราคาปัจจุบัน ส่วน £250 เป็นราคาปีที่แล้ว (ตัวหลอก)"}]},
 write:{prompt:"Summarise the honeybee passage in 50–70 words, using your own words (paraphrase; do not copy whole phrases).",min:40,
  tips:["เปลี่ยนคำ: communicate → tell, location → where, distance → how far","เปลี่ยนโครงสร้างประโยค ไม่ใช่แค่เปลี่ยนคำ","ครอบคลุม 3 ประเด็น: ทิศทาง ระยะทาง และวิธีที่ผึ้งตัวอื่นรับรู้","ไม่ใส่ความเห็นส่วนตัว"],
  model:"Honeybees tell nest-mates where food is by performing a waggle dance inside the hive. The direction of the central run, compared with vertical, points to the food relative to the sun, and the duration of that run shows how far away it is. When clouds hide the sun, bees can still adjust their dance, although they are less accurate. Because the hive is dark, other bees follow the dance mainly through touch and vibration."},
 quiz:[{q:"A statement contradicts the passage. The answer is:",o:["True","False","Not Given","Cannot tell"],a:1,w:"ขัดแย้งกับบทความ = False"},
       {q:"You cannot find any information about the statement in the passage. The answer is:",o:["True","False","Not Given","Guess from your own knowledge"],a:2,w:"ไม่มีข้อมูลในบทความ = Not Given ห้ามใช้ความรู้ส่วนตัว"},
       {q:"In IELTS Listening, how many times is each recording played?",o:["Once","Twice","Three times","As many times as you want"],a:0,w:"เปิดครั้งเดียว จึงต้องอ่านคำถามล่วงหน้า"},
       {q:"The passage says 'some bees'. The statement says 'all bees'. This is most likely:",o:["True","False or Not Given","Always True","Always Not Given"],a:1,w:"การเปลี่ยน some เป็น all เกินกว่าที่บทความบอก จึงมักเป็น False หรือ Not Given"}]},

{id:"i2",tr:"ielts",title:"Writing Task 1: Describing Charts",th:"เขียน Task 1: อธิบายกราฟและตาราง",tag:"Academic Writing",
 learn:{intro:"Writing Task 1 (Academic) ให้เวลาประมาณ 20 นาที เขียนอย่างน้อย 150 คำ อธิบายข้อมูลจากกราฟ ตาราง หรือแผนภาพ โดยไม่ใส่ความเห็นส่วนตัว โครงสร้างที่ปลอดภัยคือ 4 ย่อหน้า",
  pts:[["Intro: paraphrase คำสั่งข้อสอบ","The graph shows… → The line graph illustrates…"],
       ["Overview: บอกแนวโน้มหลัก 1–2 ข้อ ไม่ใส่ตัวเลข","Overall, … rose, whereas … fell."],
       ["Body 1–2: จัดกลุ่มข้อมูล เปรียบเทียบด้วยตัวเลขสำคัญ","เลือกจุดเด่น ไม่ต้องใส่ทุกตัวเลข"],
       ["Trend language: rose from 20 to 35 · peaked at · levelled off · fluctuated","เติมระดับการเปลี่ยนแปลง: sharply, steadily, slightly, gradually"]],
  vocab:[["peak","ถึงจุดสูงสุด","Sales peaked at 50 million."],["plateau","คงที่ในระดับสูง","The figure reached a plateau."],["fluctuate","ขึ้นลงไม่คงที่","Prices fluctuated during the year."],["proportion","สัดส่วน","The proportion of users doubled."],["approximately","ประมาณ","Approximately 40 percent agreed."],["whereas","ในขณะที่ (เปรียบเทียบ)","Cars rose, whereas buses fell."],["overall","โดยภาพรวม","Overall, usage increased."]],
  tip:"ผู้ตรวจดูสี่ด้านเท่ากัน: Task Achievement, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy ย่อหน้า Overview ที่หายไปทำให้คะแนนด้านแรกลดลงมาก"},
 read:{title:"Model Answer: Internet Access",text:"The line graph shows the percentage of households in Country X with internet access between 2000 and 2020.\n\nOverall, internet access rose dramatically over the period, and by 2020 almost every household was connected.\n\nIn 2000, only 10 percent of households had access. This figure climbed steadily to 45 percent in 2008 and then rose more sharply, reaching 80 percent in 2014. After that, growth slowed, and the proportion levelled off at around 96 percent by 2020.",
  qs:[{q:"What percentage of households had internet access in 2008?",o:["10 percent","45 percent","80 percent","96 percent"],a:1,w:"'climbed steadily to 45 percent in 2008'"},
      {q:"Which period had the fastest growth?",o:["2000–2008","2008–2014","2014–2020","The growth was equal"],a:1,w:"2008–2014 เพิ่ม 35 จุดใน 6 ปี เร็วกว่า 2000–2008 (35 จุดใน 8 ปี) และ 2014–2020 (16 จุด)"},
      {q:"What is the function of the sentence starting 'Overall'?",o:["It lists every number","It gives the main trend","It gives the writer's opinion","It repeats the question"],a:1,w:"Overview สรุปแนวโน้มหลัก ไม่มีรายละเอียดตัวเลขและไม่มีความเห็น"}]},
 listen:{lines:[{s:"A",t:"Today I'd like to talk about cycling in our city. Over the last ten years, the number of people who cycle to work every day has doubled, from about eight thousand to sixteen thousand. The main reason is the network of protected bike lanes that was completed in twenty nineteen. However, cycling still accounts for only five percent of all commuting trips, compared with sixty percent by car."}],
  qs:[{q:"How many people now cycle to work every day?",o:["About 8,000","About 16,000","About 60,000","About 5,000"],a:1,w:"'doubled, from about eight thousand to sixteen thousand'"},
      {q:"What is the main reason for the increase?",o:["Cheaper bicycles","Protected bike lanes","Higher bus fares","A cycling festival"],a:1,w:"'The main reason is the network of protected bike lanes'"},
      {q:"What percentage of commuting trips are made by bicycle?",o:["5%","16%","60%","20%"],a:0,w:"'only five percent' (60% คือการเดินทางด้วยรถยนต์)"}]},
 write:{prompt:"The table shows the average hours per week spent on social media in a country.\n\nWrite a Task 1 report of at least 100 words (in the real test, 150 words) comparing the two groups.",
  data:"Hours per week\n               2010   2015   2020\nTeenagers        4      9     14\nAdults over 40   2      3      5",min:90,
  tips:["Intro: paraphrase 'The table shows… → The table compares…'","Overview: ทั้งสองกลุ่มเพิ่มขึ้น แต่วัยรุ่นเพิ่มมากกว่า","Body 1: ปี 2010 และ 2015   Body 2: ปี 2020 และช่องว่างที่กว้างขึ้น","ใช้ whereas / while เปรียบเทียบสองกลุ่ม"],
  model:"The table compares the average number of hours per week that teenagers and adults over 40 spent on social media in 2010, 2015 and 2020.\n\nOverall, time spent on social media rose for both groups, but the increase was far greater among teenagers.\n\nIn 2010, teenagers spent 4 hours a week online, which was double the figure for older adults (2 hours). By 2015, the teenage figure had more than doubled to 9 hours, whereas adults over 40 rose only slightly, to 3 hours.\n\nThe gap widened further by 2020. Teenagers reached 14 hours, the highest figure in the table, while adults over 40 recorded 5 hours, still well below the teenage level."},
 quiz:[{q:"Sales ____ from 20 to 35 million between 2010 and 2015.",o:["rose","raised","arose","rises"],a:0,w:"rose (intransitive) ไม่มี object ส่วน raise ต้องมี object"},
       {q:"Which sentence is an overview?",o:["In 2010, sales were 20 million.","Overall, sales grew steadily over the period.","I think sales are too low.","Sales were 35 million in 2015."],a:1,w:"Overview บอกแนวโน้มรวม ไม่ใส่ตัวเลขเฉพาะปีและไม่ใส่ความเห็น"},
       {q:"Which verb describes going up and down repeatedly?",o:["peak","plateau","fluctuate","collapse"],a:2,w:"fluctuate = ขึ้นลงไม่คงที่"},
       {q:"In Task 1 you should NOT:",o:["Paraphrase the question","Give an overview","Compare key figures","Give your personal opinion"],a:3,w:"Task 1 รายงานข้อมูลเท่านั้น ไม่ใส่ความเห็นส่วนตัว"}]},

{id:"i3",tr:"ielts",title:"Writing Task 2: Opinion Essays",th:"เขียน Task 2: เรียงความแสดงความเห็น",tag:"Writing (60% of score)",
 learn:{intro:"Task 2 ใช้เวลาประมาณ 40 นาที เขียนอย่างน้อย 250 คำ และมีน้ำหนักคะแนนมากกว่า Task 1 ต้องตอบคำถามให้ครบทุกส่วนและมีจุดยืนที่ชัดตลอดบทความ",
  pts:[["Intro: paraphrase หัวข้อ + บอกจุดยืน (thesis)","Some people believe… In my opinion, …"],
       ["Body paragraph ใช้โครงสร้าง PEEL","Point (ประเด็น) → Explain (อธิบาย) → Example (ตัวอย่าง) → Link (โยงกลับไปที่คำถาม)"],
       ["คำเชื่อม: Firstly · Moreover · However · Therefore · For instance","ใช้ให้หลากหลาย อย่าใช้ also หรือ and ซ้ำทุกประโยค"],
       ["To what extent do you agree? → ต้องมีความเห็นชัดตลอดบทความ","ถ้าเห็นด้วยบางส่วน ให้บอกส่วนที่เห็นด้วยและไม่เห็นด้วยให้ชัด"]],
  vocab:[["advantage","ข้อดี","A key advantage is lower cost."],["drawback","ข้อเสีย","One drawback is the time required."],["society","สังคม","Technology has changed society."],["benefit","ผลประโยชน์","Exercise has many benefits."],["impact","ผลกระทบ","The impact on children is serious."],["ensure","ทำให้แน่ใจ","Schools must ensure safety."],["essential","จำเป็นอย่างยิ่ง","Sleep is essential for learning."]],
  tip:"วางแผน 5 นาทีก่อนเขียน: จุดยืน ประเด็นหลัก 2 ข้อ และตัวอย่างอย่างละหนึ่ง จะช่วยให้เขียนครบ 250 คำโดยไม่หลงประเด็น"},
 read:{title:"Model Answer: Free University Education",text:"Some people believe that university education should be free for all students. I partly agree with this view.\n\nOn the one hand, free tuition would give talented students from poor families an equal chance to succeed. For instance, in countries such as Germany, public universities charge very low fees, and many graduates enter skilled professions regardless of background.\n\nOn the other hand, completely free education places a heavy burden on taxpayers, who may not all benefit directly. Therefore, a better solution would be low fees combined with grants for students in need.",
  qs:[{q:"What is the writer's position?",o:["Strongly agrees","Partly agrees","Strongly disagrees","Has no opinion"],a:1,w:"'I partly agree with this view'"},
      {q:"Which phrase introduces an example?",o:["On the other hand","Therefore","For instance","Regardless"],a:2,w:"For instance = ยกตัวอย่าง"},
      {q:"What solution does the writer propose?",o:["Free education for everyone","Higher fees for all","Low fees plus grants for students in need","Closing public universities"],a:2,w:"'low fees combined with grants for students in need'"}]},
 listen:{lines:[{s:"A",t:"So, Maya, how is your essay on remote working going?"},{s:"B",t:"I've finished the introduction, but my second paragraph feels weak."},{s:"A",t:"What's the problem?"},{s:"B",t:"I make a point about productivity, but I don't give any example."},{s:"A",t:"Then add a specific one, for instance a study or a company case. Also, check your linking words. You use 'also' in almost every sentence."},{s:"B",t:"OK, I'll vary them and send the revised draft by Thursday."}],
  qs:[{q:"What is the problem with Maya's second paragraph?",o:["It is too long","It has no example","It has no introduction","It is off topic"],a:1,w:"'I make a point… but I don't give any example'"},
      {q:"Which linking word does Maya use too often?",o:["However","Therefore","Also","For instance"],a:2,w:"'You use also in almost every sentence'"},
      {q:"When will Maya send the revised draft?",o:["Tuesday","Wednesday","Thursday","Friday"],a:2,w:"'send the revised draft by Thursday'"}]},
 write:{prompt:"Some people think children should start learning a foreign language at primary school. Others believe it is better to start at secondary school.\n\nDiscuss both views and give your own opinion. (Practice: at least 120 words. In the real test: 250 words.)",min:120,
  tips:["Intro: paraphrase + บอกจุดยืนของคุณ","Body 1: มุมมองของฝ่ายที่ให้เริ่มทีหลัง   Body 2: มุมมองที่คุณเห็นด้วยพร้อมตัวอย่าง","ใช้ PEEL ในแต่ละย่อหน้า","Conclusion: สรุปจุดยืนด้วยคำพูดใหม่ ไม่เพิ่มประเด็นใหม่"],
  model:"People disagree about when children should begin learning a foreign language. While some argue that primary school is the best starting point, others prefer to wait until secondary school. In my opinion, an early start is more beneficial, provided that lessons are well designed.\n\nSupporters of starting later say that young children already have to master reading, writing and mathematics in their own language. Adding another subject could overload them. Moreover, secondary schools usually have specialist teachers.\n\nHowever, I believe the advantages of an early start are greater. Children imitate sounds easily, so they develop better pronunciation. For instance, many pupils in Scandinavian countries begin English at age seven and become confident speakers by their teens.\n\nIn conclusion, although a later start has some merits, I support teaching languages in primary school, using games and songs rather than heavy grammar."},
 quiz:[{q:"What is the minimum word count for IELTS Writing Task 2?",o:["150","200","250","300"],a:2,w:"Task 2 ต้องการอย่างน้อย 250 คำ (Task 1 คือ 150 คำ)"},
       {q:"Choose the best word: Cars are convenient; ____, they cause pollution.",o:["moreover","however","therefore","for instance"],a:1,w:"ประโยคหลังขัดแย้งกับประโยคแรก ใช้ however"},
       {q:"Which is the strongest thesis sentence for 'Is technology making people lonelier?'",o:["Technology is everywhere.","I will talk about technology.","I believe technology increases loneliness because it replaces face-to-face contact.","Many people like phones."],a:2,w:"Thesis ที่ดีมีจุดยืนและเหตุผลหลัก"},
       {q:"In the PEEL structure, what does the last step 'L' do?",o:["Lists new ideas","Links the paragraph back to the question","Leaves the topic","Lowers the argument"],a:1,w:"Link = โยงกลับไปตอบคำถามของโจทย์"}]},

{id:"i4",tr:"ielts",title:"Listening & Speaking Strategies",th:"กลยุทธ์ฟังและพูด",tag:"Listening + Speaking",
 learn:{intro:"IELTS Listening มี 4 ส่วน รวม 40 ข้อ ใช้เวลาราว 30 นาที เสียงเล่นครั้งเดียว ส่วน Speaking เป็นการสัมภาษณ์ 11–14 นาที แบ่งเป็น 3 ส่วน บทนี้รวมกลยุทธ์ที่ใช้ได้ทันที",
  pts:[["Listening: อ่านคำถามล่วงหน้าและขีดคำสำคัญ","คำตอบเรียงตามลำดับคำถามเสมอ"],
       ["ระวังตัวหลอก: 'at two… sorry, three o'clock'","ผู้พูดมักแก้ไขข้อมูล ให้เลือกคำตอบสุดท้ายที่ผู้พูดยืนยัน"],
       ["Speaking Part 1: ตอบสั้นๆ แต่ขยายด้วยเหตุผล","Yes, I do. I usually cook at weekends because it helps me relax."],
       ["Speaking Part 2: เตรียม 1 นาที พูด 1–2 นาที","จดเป็นคำสำคัญ 4–5 คำ ไม่เขียนเป็นประโยคเต็ม"]],
  vocab:[["distractor","ตัวหลอก","The speaker corrects herself, which is a distractor."],["paraphrase","พูดอีกแบบ","Paraphrase when you forget a word."],["fluency","ความคล่องแคล่ว","Fluency means smooth speech."],["hesitate","ลังเล หยุดคิด","Do not hesitate for too long."],["elaborate","อธิบายขยายความ","Please elaborate on your answer."],["cue card","บัตรหัวข้อใน Part 2","Read the cue card carefully."],["pronunciation","การออกเสียง","Clear pronunciation is important."]],
  tip:"ฝึกพูดแล้วอัดเสียงตัวเอง เปิดฟังเพื่อจับจุดที่ติดขัด และใช้เวลา 1–2 นาทีเป็นเกณฑ์ซ้อม Part 2"},
 read:{title:"Tips for Fluent Speaking",text:"Fluency does not mean speaking fast. Examiners listen for ideas that flow naturally, with few long pauses. Candidates often lose marks because they try to find the perfect word and stop talking.\n\nA better strategy is to paraphrase: if you forget the word 'ferry', say 'a boat that carries cars across the river'. It also helps to extend short answers with a reason and a short example.\n\nIn Part 2, use the one minute of preparation to note four or five key words rather than full sentences, because reading complete sentences sounds unnatural.",
  qs:[{q:"According to the passage, what does fluency mean?",o:["Speaking very fast","Ideas flowing naturally with few long pauses","Using difficult words","Never making mistakes"],a:1,w:"'Fluency does not mean speaking fast. Examiners listen for ideas that flow naturally'"},
      {q:"What should you do if you forget a word?",o:["Stop and wait","Say it in your own language","Paraphrase it","Skip the question"],a:2,w:"'A better strategy is to paraphrase'"},
      {q:"How should you make notes in the Part 2 preparation minute?",o:["Write full sentences","Write key words","Draw pictures only","Do not write anything"],a:1,w:"'note four or five key words rather than full sentences'"}]},
 listen:{lines:[{s:"A",t:"Welcome to the Harbour Museum. The museum opens at nine thirty, not ten as printed on the old leaflet. Today's guided tour begins in the main hall, then moves to the maritime gallery on the second floor. Photography is allowed everywhere except the textile room. The cafe is closed for repairs, but there are vending machines near the entrance. The tour will finish at twelve fifteen."}],
  qs:[{q:"What time does the museum open?",o:["9:00","9:30","10:00","10:30"],a:1,w:"'opens at nine thirty, not ten' 10:00 คือข้อมูลเก่าในแผ่นพับ (ตัวหลอก)"},
      {q:"Where is photography NOT allowed?",o:["The main hall","The maritime gallery","The textile room","The entrance"],a:2,w:"'allowed everywhere except the textile room'"},
      {q:"When will the tour finish?",o:["12:00","12:15","12:30","1:15"],a:1,w:"'The tour will finish at twelve fifteen'"}]},
 write:{prompt:"Speaking Part 2 practice. Describe a place you enjoy visiting. You should say: where it is, how often you go there, what you do there, and explain why you enjoy it.\n\nWrite what you would say (80–120 words). Then read it aloud and time yourself: aim for 1–2 minutes.",min:70,
  tips:["เรียงตามหัวข้อบนการ์ด: where, how often, what, why","ใช้คำเชื่อมพูด: The reason is that… / Also, …","เติมรายละเอียดจากประสาทสัมผัส: เห็น ได้ยิน รู้สึกอย่างไร","อ่านออกเสียงแล้วจับเวลา ถ้าไม่ถึง 1 นาทีให้เพิ่มตัวอย่าง"],
  model:"I'd like to talk about a small park near my house in Chiang Mai. It is about ten minutes away on foot, and I go there two or three times a week, usually in the early evening. Mostly I walk around the lake, and sometimes I meet friends to chat or read a book on a bench. The reason I enjoy it so much is that it feels peaceful even though it is in the middle of the city. After a long day of study, it helps me clear my head. Also, the trees give plenty of shade, so it stays pleasant even in the hot season."},
 quiz:[{q:"The speaker says: 'The meeting is at two… sorry, three o'clock.' The correct answer is:",o:["Two o'clock","Three o'clock","Two thirty","Five o'clock"],a:1,w:"ผู้พูดแก้ไขข้อมูล ให้เลือกคำตอบสุดท้าย"},
       {q:"In Speaking Part 2, how long should you speak?",o:["Under 30 seconds","About 1–2 minutes","5 minutes","Exactly 10 minutes"],a:1,w:"Part 2 ให้พูดต่อเนื่อง 1–2 นาที หลังเตรียม 1 นาที"},
       {q:"Which is the better answer to 'Do you like cooking?'",o:["Yes.","Yes, I do. I usually cook at weekends because it helps me relax.","No comment.","I don't know."],a:1,w:"ขยายคำตอบด้วยเหตุผลและตัวอย่างสั้นๆ"},
       {q:"What should you do when you forget a word in the Speaking test?",o:["Stay silent","Paraphrase it in English","Ask the examiner to translate","Change the topic"],a:1,w:"Paraphrase ช่วยให้พูดต่อเนื่อง และยังแสดงทักษะด้านคำศัพท์"}]}

{id:"b1",tr:"base",title:"Be, Have & Present Simple",th:"กริยาพื้นฐานและกิจวัตรประจำวัน",tag:"ระดับ A1",
 learn:{intro:"เริ่มจากกริยาที่ใช้บ่อยที่สุด คือ am/is/are, have/has และ Present Simple ใช้เล่าเรื่องตัวเอง กิจวัตร และข้อเท็จจริง ทุกบทที่เหลือต่อยอดจากบทนี้",
  pts:[["I am a student. She is a nurse. They are teachers.","be: I ใช้ am, he/she/it ใช้ is, you/we/they ใช้ are ปฏิเสธเติม not: She is not (isn't) late."],
       ["I work. She works.","Present Simple: ประธาน he/she/it เติม -s หรือ -es ที่กริยา (go → goes, study → studies)"],
       ["Do you work here? Does he work here?","คำถามใช้ do/does นำหน้า และกริยากลับเป็นรูปเดิม (Does he work…? ไม่ใช่ Does he works…?)"],
       ["I have a car. She has a car.","have ใช้กับ I/you/we/they ส่วน has ใช้กับ he/she/it"]],
  vocab:[["usually","ปกติ","I usually wake up at six."],["every day","ทุกวัน","She studies English every day."],["often","บ่อยๆ","They often eat out."],["never","ไม่เคย","He never drinks coffee."],["colleague","เพื่อนร่วมงาน","My colleague is friendly."],["schedule","ตารางเวลา","My schedule is busy."]],
  tip:"จำสูตร: he/she/it + กริยาเติม s ในประโยคบอกเล่า แต่ถ้ามี does หรือ doesn't แล้ว กริยากลับเป็นรูปเดิม"},
 read:{title:"My Morning",text:"My name is Nina. I am a nurse at a small hospital. I usually wake up at six o'clock and I have breakfast at home. My husband works in a bank, so he leaves the house at seven. Our son goes to school by bus. I start work at eight and I finish at four. In the evening, we eat dinner together and I study English for thirty minutes.",
  qs:[{q:"What is Nina's job?",o:["Teacher","Nurse","Bank clerk","Student"],a:1,w:"'I am a nurse at a small hospital'"},
      {q:"How does Nina's son go to school?",o:["On foot","By car","By bus","By train"],a:2,w:"'Our son goes to school by bus'"},
      {q:"What does Nina do for thirty minutes in the evening?",o:["Works at the hospital","Studies English","Goes to the bank","Takes the bus"],a:1,w:"'I study English for thirty minutes'"}]},
 listen:{lines:[{s:"A",t:"Hi, my name is Tom. I work in an office in Bangkok. I start at nine o'clock and finish at five thirty. I usually have lunch with my colleagues at twelve. On Saturdays, I don't work. I play football with my friends."}],
  qs:[{q:"What time does Tom start work?",o:["8:00","9:00","9:30","5:30"],a:1,w:"'I start at nine o'clock'"},
      {q:"Who does Tom usually have lunch with?",o:["His family","His friends","His colleagues","Nobody"],a:2,w:"'lunch with my colleagues'"},
      {q:"What does Tom do on Saturdays?",o:["Works in the office","Plays football","Has lunch at twelve","Studies English"],a:1,w:"'On Saturdays, I don't work. I play football'"}]},
 write:{prompt:"Write 5 to 6 sentences about your daily routine. Use Present Simple: I wake up…, I go to…, I usually…",min:30,
  tips:["ใช้ I + กริยารูปเดิม","ใส่คำบอกความถี่: usually, often, never","ใช้ and และ then เชื่อมประโยค","ถ้าเล่าถึงคนอื่น ตรวจว่า he/she/it เติม s"],
  model:"I wake up at six o'clock every day. I take a shower and have breakfast with my family. Then I go to work by bus. I usually start work at eight and finish at five. In the evening I cook dinner and watch TV. I go to bed at ten."},
 quiz:[{q:"She ____ a teacher.",o:["am","is","are","be"],a:1,w:"she ใช้ is"},
       {q:"My brother ____ in a bank.",o:["work","works","working","is work"],a:1,w:"he/she/it ในประโยคบอกเล่า เติม s"},
       {q:"____ he speak English?",o:["Do","Does","Is","Has"],a:1,w:"คำถามกับ he ใช้ Does"},
       {q:"We ____ a big house.",o:["has","have","haves","is have"],a:1,w:"we ใช้ have"}]},

{id:"b2",tr:"base",title:"Past Simple & Time Words",th:"เล่าเหตุการณ์ที่ผ่านมา",tag:"ระดับ A2",
 learn:{intro:"Past Simple ใช้เล่าเหตุการณ์ที่จบไปแล้ว มักมีคำบอกเวลา เช่น yesterday, last week, two days ago เป็นทักษะหลักของ IELTS Speaking Part 1 และ Part 2",
  pts:[["I worked. She visited. They played.","กริยาปกติเติม -ed (study → studied, stop → stopped)"],
       ["go → went · have → had · see → saw · buy → bought","กริยาไม่ปกติต้องจำ ที่เจอบ่อยควรท่องเป็นชุด"],
       ["Did you go? I didn't go.","คำถามและปฏิเสธใช้ did/didn't + กริยารูปเดิม (ไม่ใช่ didn't went)"],
       ["yesterday · last night · two days ago · in 2020","คำบอกเวลาที่ส่งสัญญาณว่าต้องใช้ Past Simple"]],
  vocab:[["yesterday","เมื่อวาน","I met her yesterday."],["ago","ที่แล้ว (นับย้อนหลัง)","He left two hours ago."],["last week","สัปดาห์ที่แล้ว","We moved last week."],["travel","เดินทาง","She travelled to Japan."],["arrive","มาถึง","The train arrived late."],["decide","ตัดสินใจ","I decided to study abroad."]],
  tip:"ในประโยคที่มี did แล้ว กริยากลับเป็นรูปเดิมเสมอ: Did she go? ไม่ใช่ Did she went?"},
 read:{title:"A Weekend in Chiang Mai",text:"Last weekend, Ploy travelled to Chiang Mai with two friends. They left Bangkok on Friday evening and arrived at the hotel at midnight. On Saturday they visited a temple and bought some handmade bags at the night market. It rained on Sunday morning, so they stayed in a cafe and played cards. They went home by train and got back at ten o'clock on Sunday night.",
  qs:[{q:"When did they arrive at the hotel?",o:["Friday evening","At midnight","Saturday morning","Sunday night"],a:1,w:"'arrived at the hotel at midnight'"},
      {q:"What did they buy at the night market?",o:["Food","Cards","Handmade bags","Train tickets"],a:2,w:"'bought some handmade bags'"},
      {q:"Why did they stay in a cafe on Sunday?",o:["It rained.","They were tired.","The temple was closed.","They missed the train."],a:0,w:"'It rained on Sunday morning, so they stayed in a cafe'"}]},
 listen:{lines:[{s:"A",t:"How was your holiday, Ben?"},{s:"B",t:"It was great. We went to Phuket for five days."},{s:"A",t:"Did you swim in the sea?"},{s:"B",t:"Yes, every morning. But on the last day we had a problem. We missed our flight because the taxi arrived late."},{s:"A",t:"Oh no! What did you do?"},{s:"B",t:"We bought new tickets and flew home the next day."}],
  qs:[{q:"How long was Ben's holiday?",o:["3 days","5 days","7 days","10 days"],a:1,w:"'for five days'"},
      {q:"Why did they miss the flight?",o:["They woke up late.","The taxi was late.","The airport was closed.","They lost their tickets."],a:1,w:"'because the taxi arrived late'"},
      {q:"When did they fly home?",o:["The same day","The next day","Two days later","A week later"],a:1,w:"'flew home the next day'"}]},
 write:{prompt:"Write 5 to 6 sentences about what you did last weekend. Use Past Simple and time words such as on Saturday, in the evening, after that.",min:30,
  tips:["ใช้กริยาช่อง 2 ทุกประโยค","เรียงเหตุการณ์ด้วย first, then, after that","ใช้ didn't สำหรับสิ่งที่ไม่ได้ทำ","เพิ่มความรู้สึก: It was fun. I was tired."],
  model:"Last weekend I visited my grandmother in Nonthaburi. On Saturday morning I took a bus there, and we cooked lunch together. After that, we watched a movie. In the evening I went to a market and bought some fruit. On Sunday I didn't go out because it rained. I was tired, but I had a lovely weekend."},
 quiz:[{q:"I ____ to the market yesterday.",o:["go","goes","went","going"],a:2,w:"yesterday ใช้ Past Simple: went"},
       {q:"She ____ her keys last night.",o:["lose","lost","losed","loses"],a:1,w:"lose เป็นกริยาไม่ปกติ: lost"},
       {q:"Did you ____ the report?",o:["finish","finished","finishing","finishes"],a:0,w:"หลัง did ใช้กริยารูปเดิม"},
       {q:"We arrived two hours ____.",o:["before","ago","last","yesterday"],a:1,w:"two hours ago = สองชั่วโมงที่แล้ว"}]},

{id:"b3",tr:"base",title:"Future, Modals & Requests",th:"แผนในอนาคต การขอร้อง และให้คำแนะนำ",tag:"ระดับ A2",
 learn:{intro:"บทนี้ใช้พูดถึงแผนในอนาคต ขอร้อง ให้คำแนะนำ และถามอย่างสุภาพ พบมากในข้อสอบ TOEIC Part 2–4 และ IELTS Speaking",
  pts:[["I will call you later. I'm going to study abroad.","will = ตัดสินใจตอนนั้นหรือสัญญา · be going to = แผนที่วางไว้แล้ว"],
       ["Can I…? Could I…? May I…?","Can = ขอทั่วไป · Could = สุภาพขึ้น · May = ทางการ"],
       ["should / must / have to","should = ควร (แนะนำ) · must / have to = ต้อง (ข้อบังคับ)"],
       ["Would you mind opening the window?","ขอร้องสุภาพ ตอบรับได้ว่า Not at all. หรือ Sure."]],
  vocab:[["appointment","นัดหมาย","I have a doctor's appointment."],["suggest","เสนอแนะ","I suggest we meet at noon."],["polite","สุภาพ","Please be polite to customers."],["permission","การอนุญาต","You need permission to enter."],["plan","แผน","What are your plans for July?"],["promise","สัญญา","I promise I will be on time."]],
  tip:"หลัง modal (can, could, should, must, will) ใช้กริยารูปเดิมเสมอ ไม่เติม s และไม่มี to: She can swim ถูก, She can swims ผิด"},
 read:{title:"A Message from the Manager",text:"Hi team. Next Monday we are going to move to the new office on Rose Street. You should pack your own desk by Friday, and you must not leave any documents on the shelves. Boxes will be delivered on Wednesday. If you need extra boxes, please ask Mina. Could everyone check their email on Thursday? I will send the new floor plan then. Thank you, Paul",
  qs:[{q:"When will the team move?",o:["This Friday","Next Monday","Next Thursday","On Wednesday"],a:1,w:"'Next Monday we are going to move'"},
      {q:"What must staff NOT do?",o:["Ask for boxes","Pack their desk","Leave documents on the shelves","Check email"],a:2,w:"'you must not leave any documents on the shelves'"},
      {q:"When will Paul send the floor plan?",o:["Wednesday","Thursday","Friday","Monday"],a:1,w:"'check their email on Thursday… I will send the new floor plan then'"}]},
 listen:{lines:[{s:"A",t:"Excuse me, could I ask something? I'd like to join the English club."},{s:"B",t:"Of course. You can sign up at the front desk. The club meets every Wednesday at six."},{s:"A",t:"Do I have to pay?"},{s:"B",t:"No, it's free, but you should bring your student card the first time."},{s:"A",t:"Great. I'll go to the desk now."}],
  qs:[{q:"How often does the club meet?",o:["Every day","Every Wednesday","Every weekend","Once a month"],a:1,w:"'every Wednesday at six'"},
      {q:"How much does it cost?",o:["Nothing","100 baht","A small fee","200 baht"],a:0,w:"'it's free'"},
      {q:"What should the student bring the first time?",o:["A pen","Money","A student card","A laptop"],a:2,w:"'you should bring your student card'"}]},
 write:{prompt:"Write 5 to 6 sentences about your plans for next month and one polite request to a colleague or teacher. Use will, be going to and could.",min:30,
  tips:["แผนที่วางไว้: I'm going to…","ขอร้อง: Could you…, please?","ตัดสินใจหรือสัญญา: I will…","หลัง modal ใช้กริยารูปเดิม"],
  model:"Next month I'm going to start a new English course. I will study for one hour every evening, and I'm going to take a practice test at the end of the month. I'm also going to visit my cousin in Rayong. I think I will take a bus because it's cheaper. Could you lend me your grammar book, please? I promise I will return it next week."},
 quiz:[{q:"____ I borrow your pen, please?",o:["Could","Do","Am","Must to"],a:0,w:"ขออนุญาตอย่างสุภาพใช้ Could I…?"},
       {q:"You ____ wear a helmet. It's the law.",o:["can","must","may","would"],a:1,w:"กฎหมายบังคับ ใช้ must"},
       {q:"She can ____ three languages.",o:["speaks","speak","speaking","to speak"],a:1,w:"หลัง can ใช้กริยารูปเดิม"},
       {q:"Look at the sky. It ____ rain soon.",o:["will","is going to","is","can"],a:1,w:"คาดการณ์จากสิ่งที่เห็น ใช้ be going to"}]},

{id:"b4",tr:"base",title:"Nouns, Articles & Quantity",th:"a/an/the นามนับได้และนับไม่ได้",tag:"ระดับ A2",
 learn:{intro:"ภาษาไทยไม่มีรูปพหูพจน์และไม่มี a/an/the ผู้เรียนไทยจึงพลาดเรื่องนี้บ่อยในข้อเขียน Part 5 ของ TOEIC และ Writing ของ IELTS",
  pts:[["a book · an apple · the sun","a/an ใช้กับนามนับได้เอกพจน์ที่ยังไม่เจาะจง · the ใช้เมื่อผู้ฟังรู้ว่าหมายถึงอะไร"],
       ["two books · three boxes · children · people","พหูพจน์เติม -s/-es และมีคำพิเศษ เช่น man → men, child → children"],
       ["water · money · information · advice","นามนับไม่ได้ ไม่เติม s และไม่ใช้ a/an: some information ถูก, an information ผิด"],
       ["many · much · a lot of · a few · a little","many + นามนับได้พหูพจน์ · much + นามนับไม่ได้ · a few + นับได้ · a little + นับไม่ได้"]],
  vocab:[["furniture","เฟอร์นิเจอร์ (นับไม่ได้)","We bought some furniture."],["information","ข้อมูล (นับไม่ได้)","I need more information."],["advice","คำแนะนำ (นับไม่ได้)","She gave me good advice."],["luggage","สัมภาระ (นับไม่ได้)","My luggage is heavy."],["equipment","อุปกรณ์ (นับไม่ได้)","The equipment is new."],["amount","ปริมาณ","The amount of work is huge."]],
  tip:"คำที่คนไทยพลาดบ่อย: information, advice, furniture, luggage, equipment, news เป็นนามนับไม่ได้ ไม่เติม s"},
 read:{title:"Our New Flat",text:"Last month, Mali and her sister rented a small flat near the station. There is one bedroom, a kitchen and a bathroom. They don't have much furniture yet, only a bed, a table and two chairs. Mali says they need some more equipment for the kitchen, such as a rice cooker and a few plates. The landlord gave them useful advice about local shops. He said the market sells a lot of cheap vegetables.",
  qs:[{q:"How many bedrooms does the flat have?",o:["None","One","Two","Three"],a:1,w:"'There is one bedroom'"},
      {q:"What furniture do they already have?",o:["A sofa and a TV","A bed, a table and two chairs","A rice cooker and plates","Nothing"],a:1,w:"'only a bed, a table and two chairs'"},
      {q:"What did the landlord give them?",o:["Furniture","Advice about local shops","A rice cooker","Vegetables"],a:1,w:"'gave them useful advice about local shops'"}]},
 listen:{lines:[{s:"A",t:"Hello, I'd like some information about the English course."},{s:"B",t:"Sure. We have a lot of students this year, but there are a few places left."},{s:"A",t:"How much homework is there?"},{s:"B",t:"Not much, only a little each night."},{s:"A",t:"And is there any equipment I need?"},{s:"B",t:"Just a notebook and a dictionary. We provide the textbooks."}],
  qs:[{q:"What does the speaker ask for?",o:["A dictionary","Information about a course","A notebook","A teacher"],a:1,w:"'I'd like some information about the English course'"},
      {q:"How many places are left?",o:["A lot","A few","None","Many"],a:1,w:"'there are a few places left'"},
      {q:"What must students bring?",o:["A textbook and a notebook","A notebook and a dictionary","A laptop","Only a dictionary"],a:1,w:"'Just a notebook and a dictionary. We provide the textbooks.'"}]},
 write:{prompt:"Describe your room or home in 5 to 6 sentences. Use a/an/the, some/any, and at least one of: a lot of, a few, a little.",min:30,
  tips:["ใช้ There is… กับนามเอกพจน์ และ There are… กับพหูพจน์","ใช้ a/an เมื่อพูดถึงสิ่งนั้นครั้งแรก แล้วใช้ the เมื่อพูดซ้ำ","ตรวจว่าไม่เติม s กับ furniture, information, advice","ลองใช้ a few หรือ a little อย่างน้อย 1 ครั้ง"],
  model:"I live in a small apartment near the river. There is a bedroom, a bathroom and a kitchen. I have a bed, a desk and a lot of books. There isn't much furniture, but I like it. I have a few plants on the balcony, and they need a little more light. The best thing is the view of the river."},
 quiz:[{q:"She gave me some good ____.",o:["advice","advices","an advice","advicies"],a:0,w:"advice นับไม่ได้ ไม่เติม s"},
       {q:"I need ____ umbrella. It's raining.",o:["a","an","the","some"],a:1,w:"umbrella ขึ้นต้นด้วยเสียงสระ ใช้ an"},
       {q:"There are too ____ cars on the road.",o:["much","many","a little","an"],a:1,w:"cars นับได้พหูพจน์ ใช้ many"},
       {q:"Two ____ are waiting outside.",o:["child","childs","children","childrens"],a:2,w:"พหูพจน์ของ child คือ children"}]},

{id:"b5",tr:"base",title:"Present Perfect & Comparisons",th:"ประสบการณ์ for/since และการเปรียบเทียบ",tag:"ระดับ B1",
 learn:{intro:"Present Perfect เชื่อมอดีตกับปัจจุบัน ใช้บอกประสบการณ์ ระยะเวลาที่ยังต่อเนื่อง และผลที่ยังเห็นอยู่ ส่วนการเปรียบเทียบใช้ทั้งใน Speaking และ Writing Task 1",
  pts:[["I have lived here for five years. She has finished.","have/has + กริยาช่อง 3 · for + ช่วงเวลา · since + จุดเริ่มต้น"],
       ["Have you ever been to Japan? Yes, I have.","ถามประสบการณ์ด้วย ever · never = ไม่เคย · already, yet, just"],
       ["Past Simple หรือ Present Perfect?","ระบุเวลาในอดีตชัดเจน (yesterday, in 2020) ใช้ Past Simple · ไม่ระบุเวลา เน้นผลหรือประสบการณ์ ใช้ Present Perfect"],
       ["taller than · the tallest · more expensive than · as cheap as","คำสั้นเติม -er/-est · คำยาวใช้ more/most · เท่ากันใช้ as…as"]],
  vocab:[["experience","ประสบการณ์","I have a lot of experience."],["already","เรียบร้อยแล้ว","I have already sent it."],["yet","ยัง (ในคำถามหรือปฏิเสธ)","Have you finished yet?"],["since","ตั้งแต่","I've worked here since 2022."],["compare","เปรียบเทียบ","Compare the two prices."],["expensive","แพง","This laptop is more expensive."]],
  tip:"since + จุดเวลา (since 2020, since Monday) · for + ช่วงเวลา (for two years, for a week) จำคู่นี้ให้แม่น เพราะออกสอบบ่อยมาก"},
 read:{title:"Two Phones",text:"Kim has used her old phone for four years. It is cheap, but the battery is weak. Last week she compared two new phones. Model A is cheaper than Model B, and its battery is as good as the old one. Model B is the most expensive in the shop, but it has the best camera. Kim hasn't decided yet. She has already asked three friends for advice, and she has read many reviews online.",
  qs:[{q:"How long has Kim used her old phone?",o:["Two years","Four years","Since last week","One month"],a:1,w:"'has used her old phone for four years'"},
      {q:"Which phone has the best camera?",o:["The old phone","Model A","Model B","All of them"],a:2,w:"'Model B… has the best camera'"},
      {q:"What is true about Kim now?",o:["She bought Model A.","She hasn't decided yet.","She sold her old phone.","She has asked nobody."],a:1,w:"'Kim hasn't decided yet'"}]},
 listen:{lines:[{s:"A",t:"Have you ever been to Chiang Rai?"},{s:"B",t:"Yes, I have. I went there twice. The first time was in 2019 and the second was last year."},{s:"A",t:"Which trip was better?"},{s:"B",t:"The second one. The weather was cooler and the hotel was much cheaper than the first. I've wanted to go back ever since."}],
  qs:[{q:"How many times has B been to Chiang Rai?",o:["Once","Twice","Three times","Never"],a:1,w:"'I went there twice'"},
      {q:"Why was the second trip better?",o:["Cooler weather and a cheaper hotel","A longer trip","A better camera","More friends"],a:0,w:"'The weather was cooler and the hotel was much cheaper'"},
      {q:"What does B want to do?",o:["Never go back","Go back","Move there","Sell the hotel"],a:1,w:"'I've wanted to go back ever since'"}]},
 write:{prompt:"Write 5 to 6 sentences about your experience with English or a place you have visited. Use have/has + past participle, for or since, and at least one comparison.",min:35,
  tips:["ใช้ for หรือ since ให้ถูกคู่กับช่วงเวลา","ใช้ never หรือ ever บอกประสบการณ์","เปรียบเทียบอย่างน้อยหนึ่งประโยค: better than, more … than","ถ้าระบุปีหรือวันที่ ให้เปลี่ยนเป็น Past Simple"],
  model:"I have studied English for six years, since I was twelve. I have never lived abroad, but I have visited Singapore twice. Singapore is cleaner than my city and the public transport is easier to use. I haven't taken an official test yet, but I have already booked one for March. My writing is better than my speaking, so I am practising more every day."},
 quiz:[{q:"I ____ here since 2021.",o:["live","lived","have lived","am living"],a:2,w:"since + จุดเวลา ใช้ Present Perfect"},
       {q:"She has worked here ____ three years.",o:["since","for","ago","from"],a:1,w:"three years เป็นช่วงเวลา ใช้ for"},

{id:"b6",tr:"base",title:"Linking Words & Sentence Building",th:"เชื่อมประโยคและขยายความ",tag:"ระดับ B1",
 learn:{intro:"ประโยคสั้นๆ ซ้ำๆ ทำให้คะแนนเขียนไม่ขึ้น บทนี้สอนเชื่อมประโยคด้วยคำสันธาน และขยายความด้วย who, which, that ซึ่งเป็นสะพานไปสู่ IELTS Writing และ TOEIC Part 6–7",
  pts:[["and · but · so · because · or","and = เพิ่ม · but = ขัดแย้ง · so = ผลลัพธ์ · because = เหตุผล"],
       ["although · however · therefore","Although + ประโยค: Although it rained, we went out. · However และ Therefore มักขึ้นต้นประโยคใหม่"],
       ["who · which · that","who = คน · which = สิ่งของ · that = ได้ทั้งสอง: The man who called you is my boss."],
       ["If + Present Simple, will + กริยารูปเดิม","If it rains, we will stay home. ใช้กับเงื่อนไขที่เป็นไปได้"]],
  vocab:[["although","แม้ว่า","Although he was tired, he kept working."],["however","อย่างไรก็ตาม","However, the price is high."],["therefore","ดังนั้น","Therefore, we need a plan."],["as a result","ผลก็คือ","As a result, sales fell."],["in addition","นอกจากนี้","In addition, the room is cheap."],["whereas","ในขณะที่","He likes tea, whereas I prefer coffee."]],
  tip:"ใช้คำเชื่อมให้หลากหลายแต่อย่าเยอะเกินไป 1 ถึง 2 คำต่อย่อหน้าก็พอ และห้ามใช้ because กับ so ในประโยคเดียวกัน"},
 read:{title:"Studying Online or in a Classroom",text:"Many people think online courses are better because they save time. However, some learners prefer classrooms, which give them a teacher they can ask directly. Although online lessons are cheaper, students who study alone often lose motivation. Therefore, many schools now offer a mix of both. If you choose a mixed course, you will study some lessons at home and attend others in person.",
  qs:[{q:"Why do many people prefer online courses?",o:["They save time.","They are free.","They have more teachers.","They are shorter."],a:0,w:"'online courses are better because they save time'"},
      {q:"What do students who study alone often lose?",o:["Money","Motivation","Time","Their teacher"],a:1,w:"'often lose motivation'"},
      {q:"What do many schools offer now?",o:["Only online lessons","Only classrooms","A mix of both","Free books"],a:2,w:"'many schools now offer a mix of both'"}]},
 listen:{lines:[{s:"A",t:"I'm thinking about changing jobs. The salary is higher, but the office is far from my home."},{s:"B",t:"If you take the job, you'll need to leave earlier every morning."},{s:"A",t:"That's true. Although I like my team, I want a new challenge. Therefore, I'm going to apply this week."},{s:"B",t:"Good luck! I hope you get the job."}],
  qs:[{q:"What is the good point of the new job?",o:["A higher salary","A closer office","A better team","Shorter hours"],a:0,w:"'The salary is higher'"},
      {q:"What is the problem with the new job?",o:["The salary is low","The office is far","The team is bad","The hours are long"],a:1,w:"'the office is far from my home'"},
      {q:"What will A do this week?",o:["Quit immediately","Apply for the job","Move house","Ask for a raise"],a:1,w:"'I'm going to apply this week'"}]},
 write:{prompt:"Write a short paragraph (6 to 8 sentences) about the advantages and disadvantages of living in a big city. Use at least four linking words such as because, but, however, although, so, therefore.",min:45,
  tips:["ฝั่งข้อดีใช้ On the one hand, ข้อเสียใช้ However,","ใช้ although หรือ whereas เปรียบเทียบสองด้าน","ประโยคสุดท้ายสรุปด้วย Therefore, I think…","อ่านออกเสียงเพื่อเช็กว่าไม่ซ้ำคำเชื่อมเดิม"],
  model:"Living in a big city has both advantages and disadvantages. On the one hand, there are many jobs, so people can earn more money. In addition, public transport is usually better, which makes travel easier. However, housing is expensive, and the air is often polluted. Although the city is exciting, it can be noisy and stressful. Therefore, I think it is a good choice for young people, whereas families may prefer a quieter place."},

{id:"b7",tr:"base",title:"Past Continuous & Past Perfect",th:"เล่าเรื่องในอดีตให้ละเอียดขึ้น",tag:"ระดับ B1–B2",
 learn:{intro:"สองกาลนี้ใช้เล่าเรื่องในอดีตให้ละเอียดขึ้น Past Continuous บอกสิ่งที่กำลังเกิดอยู่ในช่วงเวลาหนึ่ง ส่วน Past Perfect บอกเหตุการณ์ที่เกิดก่อนอีกเหตุการณ์ในอดีต พบมากใน IELTS Speaking Part 2 และบทอ่านเล่าเรื่อง",
  pts:[["I was cooking when the phone rang.","Past Continuous = was/were + V-ing บอกเหตุการณ์ที่กำลังดำเนินอยู่ แล้วมีเหตุการณ์สั้นๆ (Past Simple) แทรกเข้ามา"],
       ["While she was studying, her brother was playing games.","while ใช้กับสองเหตุการณ์ที่เกิดพร้อมกัน ส่วน when มักตามด้วยเหตุการณ์สั้นที่แทรก"],
       ["When I arrived, the meeting had already started.","Past Perfect = had + V3 บอกว่าเหตุการณ์นั้นเกิดก่อนอีกเหตุการณ์ในอดีต"],
       ["after · before · by the time · already · just","คำที่มักใช้ร่วมกับ Past Perfect เพื่อบอกลำดับเวลา"]],
  vocab:[["meanwhile","ในขณะเดียวกัน","Meanwhile, the team was preparing the room."],["suddenly","ทันใดนั้น","Suddenly, the lights went out."],["by the time","เมื่อถึงเวลาที่","By the time we arrived, it had started."],["earlier","ก่อนหน้านี้","I had spoken to him earlier."],["interrupt","ขัดจังหวะ","Sorry to interrupt you."],["witness","เป็นพยาน / เห็นเหตุการณ์","She witnessed the accident."]],
  tip:"ถ้ามีสองเหตุการณ์ในอดีต เหตุการณ์ที่เกิดก่อนใช้ Past Perfect เหตุการณ์ที่เกิดทีหลังใช้ Past Simple แต่ถ้าเล่าเรียงตามลำดับเวลาอยู่แล้ว ใช้ Past Simple ทั้งหมดก็พอ"},
 read:{title:"The Missed Train",text:"Last Friday, Lena was walking to the station when she realised she had left her ticket at home. By the time she got back, the train had already left. While she was waiting for the next one, she called her manager to say she would be late. He was having a meeting, so he did not answer. Lena was feeling worried, but when she finally arrived at the office, the meeting had just finished and nobody had noticed.",
  qs:[{q:"What was Lena doing when she realised her mistake?",o:["Waiting for a train","Walking to the station","Calling her manager","Sitting in a meeting"],a:1,w:"'Lena was walking to the station when she realised…'"},
      {q:"What had happened by the time she got back home?",o:["The meeting had finished","The train had left","Her manager had called","She had lost her phone"],a:1,w:"'By the time she got back, the train had already left'"},
      {q:"Why did her manager not answer the phone?",o:["He was having a meeting.","His phone was broken.","He was on a train.","He was angry."],a:0,w:"'He was having a meeting, so he did not answer'"}]},
 listen:{lines:[{s:"A",t:"Why were you late for the party?"},{s:"B",t:"I was driving there when the car broke down. Luckily, a man who was passing by stopped to help."},{s:"A",t:"Had you called a garage?"},{s:"B",t:"Yes, but by the time the mechanic arrived, the man had already fixed it!"},{s:"A",t:"Wow, lucky you!"}],
  qs:[{q:"What was B doing when the car broke down?",o:["Walking","Driving","Calling a garage","Eating"],a:1,w:"'I was driving there when the car broke down'"},
      {q:"Who stopped to help?",o:["A mechanic","A friend","A man passing by","A police officer"],a:2,w:"'a man who was passing by stopped to help'"},
      {q:"What had happened by the time the mechanic arrived?",o:["The car was fixed","The party had ended","B had gone home","The road was closed"],a:0,w:"'the man had already fixed it'"}]},
 write:{prompt:"Write 6 to 8 sentences about a memorable day in the past, such as a trip or an accident. Use at least two Past Continuous and two Past Perfect sentences.",min:45,
  tips:["ฉากเหตุการณ์ใช้ Past Continuous: It was raining…","เหตุการณ์ที่แทรกเข้ามาใช้ Past Simple: when the bus stopped…","เหตุการณ์ที่เกิดก่อนใช้ had + V3","ใช้ meanwhile, suddenly, by the time เพิ่มลำดับเวลา"],
  model:"Last summer I was travelling in the north when something unexpected happened. We were walking up a mountain path when it suddenly started to rain heavily. By the time we reached the village, we were completely wet, and our guide had already phoned the hotel. Meanwhile, the owner was preparing hot soup for us. We had never felt so tired! When we finally got to the hotel, the room had been heated and our clothes were dried by the fire. It was a day I will never forget."},
 quiz:[{q:"I ____ TV when the lights went out.",o:["watched","was watching","had watched","watch"],a:1,w:"กำลังทำอยู่แล้วมีเหตุการณ์แทรก ใช้ Past Continuous"},
       {q:"When we arrived at the cinema, the film ____.",o:["already started","has already started","had already started","was already starting"],a:2,w:"หนังเริ่มก่อนที่เราจะมาถึง ใช้ Past Perfect"},
       {q:"While she ____ dinner, her friends were setting the table.",o:["cooked","was cooking","had cooked","cooks"],a:1,w:"while + สองเหตุการณ์ที่เกิดพร้อมกัน ใช้ Past Continuous ทั้งคู่"},
       {q:"After she ____ the report, she sent it to her boss.",o:["had finished","finishes","finishing","is finished"],a:0,w:"after + เหตุการณ์ที่เกิดก่อน ใช้ Past Perfect"}]},

{id:"b8",tr:"base",title:"Passive Voice",th:"ประโยคกรรมวาจก",tag:"ระดับ B1–B2",
 learn:{intro:"Passive Voice เน้นสิ่งที่ถูกกระทำมากกว่าคนทำ พบมากใน TOEIC Part 5–7 (ประกาศ รายงาน) และ IELTS Writing Task 1 ตอนอธิบายขั้นตอนหรือกระบวนการ",
  pts:[["The report was written by Anna.","โครงสร้าง: be + V3 (+ by คนทำ) โดย be เปลี่ยนตามกาลและประธาน"],
       ["The office is cleaned every day. The office was cleaned yesterday.","Present ใช้ is/are + V3 · Past ใช้ was/were + V3"],
       ["will be + V3 · has/have been + V3 · can be + V3","Future, Present Perfect และ Modal ในรูป Passive"],
       ["My bag was stolen. The paper is cut and then packed.","ใช้ Passive เมื่อไม่รู้หรือไม่สำคัญว่าใครทำ หรือเมื่ออธิบายกระบวนการ"]],
  vocab:[["process","กระบวนการ","The process takes three days."],["produce","ผลิต","Rice is produced in Thailand."],["install","ติดตั้ง","The software was installed yesterday."],["deliver","ส่งมอบ","Orders are delivered within a week."],["inspect","ตรวจสอบ","Every product is inspected."],["damage","ทำให้เสียหาย","The package was damaged."]],
  tip:"ข้อสอบ TOEIC Part 5 มักให้เลือกระหว่าง V-ing, V3 และ V1 ถ้าหลัง be เป็นสิ่งของและไม่มี object ตามหลัง ให้นึกถึง Passive (be + V3)"},
 read:{title:"How Chocolate Is Made",text:"Cocoa beans are grown in tropical countries and are harvested by hand. After the beans have been collected, they are dried in the sun for about a week. Then they are shipped to factories, where they are roasted and ground into a paste. Sugar and milk are added, and the mixture is heated and stirred for several hours. Finally, the chocolate is poured into moulds, cooled and wrapped.",
  qs:[{q:"How are cocoa beans harvested?",o:["By machine","By hand","By boat","By robots"],a:1,w:"'are harvested by hand'"},
      {q:"What happens to the beans after they are dried?",o:["They are shipped to factories.","They are poured into moulds.","They are wrapped.","They are grown."],a:0,w:"'Then they are shipped to factories'"},
      {q:"What is the last step?",o:["The mixture is heated.","Sugar is added.","The chocolate is cooled and wrapped.","The beans are roasted."],a:2,w:"'Finally, the chocolate is poured into moulds, cooled and wrapped'"}]},
 listen:{lines:[{s:"A",t:"Hello, I'm calling about my order. It was supposed to be delivered yesterday."},{s:"B",t:"I'm sorry. Let me check. Your parcel was sent on Monday, but it was damaged during transport."},{s:"A",t:"Will it be replaced?"},{s:"B",t:"Yes, a new one will be sent tomorrow, and the delivery fee will be refunded."}],
  qs:[{q:"What problem does the caller have?",o:["The order was not delivered on time","The wrong item was sent","The price was too high","The shop was closed"],a:0,w:"'It was supposed to be delivered yesterday'"},
      {q:"What happened to the parcel?",o:["It was lost.","It was damaged during transport.","It was stolen.","It was returned."],a:1,w:"'it was damaged during transport'"},
      {q:"What will be refunded?",o:["The delivery fee","The whole order","Nothing","The new parcel"],a:0,w:"'the delivery fee will be refunded'"}]},
 write:{prompt:"Describe how a product is made or how a process works, such as making tea, recycling paper or applying for a visa. Write 6 to 8 sentences using Passive Voice and sequence words such as first, then, after that, finally.",min:45,
  tips:["ใช้ is/are + V3 สำหรับขั้นตอนในปัจจุบัน","ใช้ first, then, next, after that, finally เรียงลำดับ","ไม่ต้องใส่ผู้ทำถ้าไม่สำคัญ","ตรวจกริยาช่อง 3 ให้ถูก (grow → grown, make → made)"],
  model:"Paper is made from wood. First, trees are cut down and the logs are taken to a factory. There, the bark is removed and the wood is cut into small pieces. Then the pieces are mixed with water and heated until they become a soft pulp. After that, the pulp is pressed flat and dried. Finally, the paper is cut into sheets and packed. Today, a lot of paper is also made from recycled materials."},
 quiz:[{q:"The new library ____ by the mayor next month.",o:["will open","will be opened","opened","is opening"],a:1,w:"มี by the mayor บอกผู้ทำ และห้องสมุดเป็นผู้ถูกเปิด ใช้ will be + V3"},
       {q:"All products ____ before they leave the factory.",o:["inspect","are inspected","are inspecting","inspecting"],a:1,w:"สินค้าถูกตรวจสอบ ใช้ are + V3"},
       {q:"My wallet ____ yesterday.",o:["stole","was stolen","has stolen","is stolen"],a:1,w:"กระเป๋าถูกขโมย อดีตมี yesterday ใช้ was + V3"},
       {q:"The report has already ____.",o:["written","been written","be written","writing"],a:1,w:"Present Perfect Passive = has/have been + V3"}]},

{id:"b9",tr:"base",title:"Conditionals (0, 1, 2, 3)",th:"ประโยคเงื่อนไขทั้งสี่แบบ",tag:"ระดับ B1–B2",
 learn:{intro:"ประโยคเงื่อนไขใช้พูดถึงสิ่งที่เป็นไปได้ สิ่งที่สมมติ และสิ่งที่ไม่เกิดขึ้นจริงในอดีต ใช้บ่อยใน IELTS Speaking Part 3 และ Writing Task 2",
  pts:[["Type 0: If you heat ice, it melts.","ข้อเท็จจริงหรือกฎ: If + Present Simple, Present Simple"],
       ["Type 1: If it rains, we will stay home.","เป็นไปได้ในอนาคต: If + Present Simple, will + กริยารูปเดิม"],
       ["Type 2: If I had more time, I would learn French.","สมมติสิ่งที่ไม่จริงในปัจจุบัน: If + Past Simple, would + กริยารูปเดิม (If I were you,… ใช้ were ได้กับทุกประธาน)"],
       ["Type 3: If I had studied, I would have passed.","เสียใจกับอดีตที่เปลี่ยนไม่ได้: If + Past Perfect, would have + V3"]],
  vocab:[["unless","ถ้าไม่ (= if not)","Unless you hurry, you will be late."],["provided that","ตราบใดที่","You can go provided that you finish."],["suppose","สมมติว่า","Suppose you won a million baht."],["regret","เสียใจ","I regret not studying harder."],["otherwise","ไม่เช่นนั้น","Leave now, otherwise you'll miss it."],["in case","เผื่อ","Take an umbrella in case it rains."]],
  tip:"หลัง if ไม่ใช้ will: If it rains ถูก, If it will rain ผิด และ would ไม่ใช้ในส่วน if เช่นกัน"},
 read:{title:"Life Choices",text:"Marco often thinks about the past. If he had accepted the job abroad, he would have earned more money. However, he would not have met his wife. If he had a choice now, he would probably choose the same path. He tells his students that unless they make plans, they will not reach their goals. 'If you work steadily, you will succeed,' he says, 'but if you wait for luck, you may wait a very long time.'",
  qs:[{q:"What would Marco have done if he had accepted the job?",o:["Earned more money","Met his wife","Stayed at home","Taught students"],a:0,w:"'he would have earned more money'"},
      {q:"What would Marco do if he had a choice now?",o:["Choose a different path","Choose the same path","Leave his wife","Move abroad"],a:1,w:"'he would probably choose the same path'"},
      {q:"What happens, according to Marco, if students do not make plans?",o:["They will succeed.","They will not reach their goals.","They will be lucky.","They will find a job."],a:1,w:"'unless they make plans, they will not reach their goals'"}]},
 listen:{lines:[{s:"A",t:"If you could live anywhere, where would you live?"},{s:"B",t:"I would live in Japan. If I spoke Japanese, I would move there tomorrow."},{s:"A",t:"Why don't you study it?"},{s:"B",t:"I will, provided that I can find a cheap course. Unless I start soon, I'll never learn."}],
  qs:[{q:"Where would B like to live?",o:["Japan","Korea","England","Singapore"],a:0,w:"'I would live in Japan'"},
      {q:"Why can't B move there at the moment?",o:["B doesn't speak Japanese","B has no money","B has no job","B doesn't like it"],a:0,w:"'If I spoke Japanese, I would move there tomorrow' แปลว่าตอนนี้ยังพูดไม่ได้"},
      {q:"Under what condition will B study Japanese?",o:["If friends join","If the course is cheap","If it is online","If there is time"],a:1,w:"'provided that I can find a cheap course'"}]},
 write:{prompt:"Write 6 to 8 sentences about your dreams or regrets. Use at least one Type 1, one Type 2 and one Type 3 conditional sentence.",min:45,
  tips:["Type 1 แผนที่เป็นไปได้: If I pass the test, I will…","Type 2 ความฝัน: If I won the lottery, I would…","Type 3 ความเสียดาย: If I had studied harder, I would have…","อย่าใช้ will หรือ would ในส่วน if"],
  model:"If I pass the exam in March, I will apply to a university in Australia. If I had more savings, I would travel around Europe first, but that isn't possible now. I sometimes regret not learning English earlier. If I had started in high school, I would have reached a higher level by now. Anyway, unless I keep practising every day, I won't improve quickly, so I study for an hour each evening. If I could talk to my younger self, I would say, work hard from the beginning."},
 quiz:[{q:"If it ____ tomorrow, we will cancel the picnic.",o:["rains","will rain","rained","would rain"],a:0,w:"Type 1: if + Present Simple"},
       {q:"If I ____ you, I would take the job.",o:["am","was being","were","will be"],a:2,w:"Type 2 ใช้ were ในสำนวน If I were you"},
       {q:"If she had left earlier, she ____ the train.",o:["would catch","would have caught","will catch","caught"],a:1,w:"Type 3: would have + V3"},
       {q:"You won't pass ____ you study harder.",o:["if","unless","when","although"],a:1,w:"unless = if not"}]},

{id:"b10",tr:"base",title:"Reported Speech",th:"การเล่าสิ่งที่คนอื่นพูด",tag:"ระดับ B1–B2",
 learn:{intro:"Reported Speech ใช้เล่าสิ่งที่คนอื่นพูดไว้ พบใน TOEIC Part 7 (อีเมลหรือรายงานการประชุมที่อ้างถึงคำพูด) และใช้ใน IELTS Speaking เวลาเล่าเหตุการณ์",
  pts:[["He said (that) he was tired.","'I am tired' → He said he was tired. ถอยกาลหนึ่งขั้น: am/is → was, will → would, can → could"],
       ["She said, 'I bought a car.' → She said she had bought a car.","Past Simple ถอยเป็น Past Perfect"],

function merge(a,b){
  var r=emptyP();
  [a,b].forEach(function(x){
    if(!x)return;
    Object.keys(x.done||{}).forEach(function(k){r.done[k]=x.done[k]});
    Object.keys(x.scores||{}).forEach(function(k){var s=x.scores[k],c=r.scores[k]; if(!c||(s.s/s.n)>(c.s/c.n))r.scores[k]=s});
    Object.keys(x.drafts||{}).forEach(function(k){var d=x.drafts[k],c=r.drafts[k]; if(!c||d.at>c.at)r.drafts[k]=d});
    Object.keys(x.days||{}).forEach(function(k){r.days[k]=1});
    Object.keys(x.vocab||{}).forEach(function(k){var v=x.vocab[k],c=r.vocab[k]; if(!c||(v.at||0)>(c.at||0))r.vocab[k]=v});
    Object.keys(x.miss||{}).forEach(function(k){var v=x.miss[k],c=r.miss[k]; if(!c||(v.at||0)>(c.at||0))r.miss[k]=v});
    (x.mocks||[]).forEach(function(m){ if(!r.mocks.some(function(y){return y.at===m.at&&y.k===m.k}))r.mocks.push(m)});
    if(x.place&&(!r.place||x.place.at>r.place.at))r.place=x.place;
    if(x.exam&&(!r.exam||x.exam.at>r.exam.at))r.exam=x.exam;
    Object.keys((x.lib&&x.lib.saved)||{}).forEach(function(k){var v=x.lib.saved[k],c=r.lib.saved[k]; if(!c||(v.at||0)>(c.at||0))r.lib.saved[k]=v});
    r.xp=Math.max(r.xp,x.xp||0);
    Object.keys(x.xpd||{}).forEach(function(k){r.xpd[k]=Math.max(r.xpd[k]||0,x.xpd[k])});
    Object.keys(x.badges||{}).forEach(function(k){r.badges[k]=Math.min(r.badges[k]||Infinity,x.badges[k])});
    Object.keys(x.mn||{}).forEach(function(k){var v=x.mn[k],c=r.mn[k]; if(!c||(v.at||0)>(c.at||0))r.mn[k]=v});
    r.stats.pq=Math.max(r.stats.pq,(x.stats&&x.stats.pq)||0);
    r.stats.pc=Math.max(r.stats.pc,(x.stats&&x.stats.pc)||0);
    if((x.lastAt||0)>r.lastAt){r.last=x.last;r.lastAt=x.lastAt}
    r.updated=Math.max(r.updated,x.updated||0);
  });
  r.mocks.sort(function(p,q){return p.at-q.at}); r.mocks=r.mocks.slice(-30);
  return r;
}
