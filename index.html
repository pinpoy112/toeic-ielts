<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>WORDVERSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#0B0D12; --bg2:#141821; --card:#1B202B; --vio:#8B5CF6; --blue:#60A5FA; --mint:#5EEAD4;
  --tx:#F8FAFC; --tx2:#94A3B8; --line:rgba(255,255,255,.08); --glass:rgba(27,32,43,.72);
  --bad:#FB7185; --good:#5EEAD4; --warn:#FBBF24;
  --f:"Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sw:248px; --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 50% at 85% -5%,rgba(139,92,246,.22),transparent 70%),radial-gradient(45% 40% at -5% 100%,rgba(96,165,250,.16),transparent 70%),radial-gradient(35% 30% at 50% 110%,rgba(94,234,212,.08),transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
i[data-lucide],svg.lucide{width:20px;height:20px;stroke-width:2;flex:none;display:inline-block}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--tx2)} .small{font-size:.8125rem}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .25s}
.app.collapsed{--sw:76px}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:rgba(20,24,33,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);z-index:30;overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:800;letter-spacing:.08em;font-size:1.0625rem;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--vio),var(--blue));box-shadow:0 0 22px rgba(139,92,246,.55);flex:none}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--tx2);font-weight:500;text-align:left;white-space:nowrap;transition:background .2s,color .2s;min-height:44px}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(139,92,246,.28),rgba(96,165,250,.12));color:var(--tx);box-shadow:inset 0 0 0 1px rgba(139,92,246,.35)}
.nav .cnt{margin-left:auto;font-size:.75rem;background:rgba(255,255,255,.08);padding:1px 8px;border-radius:99px}
.collapsed .nav span,.collapsed .logo span.t,.collapsed .nav .cnt,.collapsed .side .foot span{display:none}
.side .foot{margin-top:auto;display:grid;gap:6px}
.side .foot button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--tx2);min-height:44px;white-space:nowrap}
.side .foot button:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.main{min-width:0;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrapin{max-width:1180px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 0;background:linear-gradient(var(--bg) 60%,transparent)}
.srch{position:relative;flex:1;min-width:0;max-width:460px}
.srch i,.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx2);pointer-events:none;width:18px;height:18px}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--tx);min-height:44px;transition:border-color .2s,box-shadow .2s}
.srch .inp{padding-left:42px}
.inp:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(139,92,246,.25);outline:0}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select.inp option{background:var(--bg2);color:var(--tx)}
.hd-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:.8125rem;white-space:nowrap}
.pill i,.pill svg{width:16px;height:16px}
.fire{color:#FB923C;animation:flame 1.4s ease-in-out infinite;transform-origin:50% 90%}
.ibtn{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--tx2);background:var(--glass);border:1px solid var(--line);transition:color .2s,border-color .2s,transform .15s}
.ibtn:hover{color:var(--tx);border-color:rgba(139,92,246,.5)}
.ibtn:active{transform:scale(.94)}
.ibtn.on{color:var(--bad);border-color:rgba(251,113,133,.4)}
.ibtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--vio),var(--mint));font-weight:700;color:#0B0D12;display:grid;place-items:center}
.menu-b{display:none}
.bnav{display:none}

/* ---------- Common ---------- */
.view{padding-bottom:24px}
.view.enter{animation:up .35s ease-out}
.gap{display:grid;gap:18px}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.hover{transition:transform .2s,border-color .2s,box-shadow .2s}
.card.hover:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.45);box-shadow:0 12px 34px -14px rgba(139,92,246,.5)}
.lbl{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
.sech{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 12px;flex-wrap:wrap}
.sech h2{font-size:1.25rem}
.pg-t{display:grid;gap:4px;margin:6px 0 14px}
.pg-t h1{font-size:1.75rem;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;font-weight:600;background:linear-gradient(135deg,var(--vio),#6D5CF6 55%,var(--blue));color:#fff;box-shadow:0 8px 24px -10px rgba(139,92,246,.8);transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:none;border:1px solid var(--line);color:var(--tx)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.875rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--vio),var(--blue),var(--mint));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.6875rem;font-weight:600;background:rgba(139,92,246,.18);color:#C4B5FD}
.tag.l1{background:rgba(94,234,212,.15);color:var(--mint)} .tag.l2{background:rgba(96,165,250,.16);color:var(--blue)} .tag.l3{background:rgba(251,113,133,.16);color:#FDA4AF}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.gauto{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.big{font-size:2.25rem;font-weight:800;line-height:1}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:26px 16px}
.empty .slot{width:min(260px,70%);aspect-ratio:1}

/* ---------- Spline slot + fallback ---------- */
.slot{position:relative;border-radius:var(--r);overflow:hidden;min-height:200px;width:100%}
.slot spline-viewer{display:block;width:100%;height:100%;min-height:260px}
.slot.hero{min-height:300px;height:100%}
.slotchip{position:absolute;left:10px;bottom:8px;font-size:.6875rem;color:var(--tx2);background:rgba(11,13,18,.6);border:1px solid var(--line);padding:2px 8px;border-radius:99px;pointer-events:none}
.orb{position:absolute;inset:0;display:grid;place-items:center;perspective:700px}
.orb .core{position:relative;width:min(46%,170px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,#E9D5FF,var(--vio) 38%,#3B2A8F 78%,#1A1446);box-shadow:0 0 60px rgba(139,92,246,.65),0 40px 40px -20px rgba(0,0,0,.6),inset -14px -18px 34px rgba(0,0,0,.4);animation:float 5s ease-in-out infinite}
.orb .core::after{content:"Aa";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:clamp(1.6rem,5vw,2.6rem);color:rgba(255,255,255,.92);text-shadow:0 2px 12px rgba(0,0,0,.35)}
.orb .ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid rgba(96,165,250,.45);transform:translate(-50%,-50%) rotateX(72deg)}
.orb .r1{width:68%;aspect-ratio:1;animation:spin 14s linear infinite}
.orb .r2{width:88%;aspect-ratio:1;border-color:rgba(94,234,212,.3);animation:spin 22s linear infinite reverse}
.orb .chip{position:absolute;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 20px -8px rgba(0,0,0,.6);animation:float 6s ease-in-out infinite}
.orb .c1{left:12%;top:18%;color:var(--mint)} .orb .c2{right:12%;top:24%;color:var(--blue);animation-delay:-2s} .orb .c3{left:22%;bottom:14%;color:#C4B5FD;animation-delay:-4s}
.orb .shadow{position:absolute;bottom:9%;left:50%;width:34%;height:14px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(4px)}

/* ---------- Home ---------- */
.welcome{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:stretch;overflow:hidden;position:relative;background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(27,32,43,.75) 55%)}
.welcome h1{font-size:clamp(1.75rem,3.4vw,2.5rem);font-weight:800;margin:6px 0 10px}
.welcome h1 em{font-style:normal;background:linear-gradient(90deg,var(--vio),var(--blue),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wk div{display:grid;justify-items:center;gap:4px;font-size:.6875rem;color:var(--tx2)}
.wk span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.wk .on span{background:linear-gradient(135deg,var(--vio),var(--blue));color:#fff;border-color:transparent}
.wk .td span{box-shadow:0 0 0 2px var(--mint)}
.dw .w{font-size:2rem;font-weight:800}
.ipa{color:var(--blue);font-weight:500}

/* ---------- Category cards ---------- */
.cat{display:grid;gap:10px;text-align:left;width:100%;color:inherit}
.cat .ci{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(96,165,250,.2));color:#DDD6FE}
.cat .no{font-size:.75rem;color:var(--tx2);font-weight:600}
.cat h3{font-size:1.0625rem}

/* ---------- Flip cards ---------- */
.fcard{perspective:900px;cursor:pointer;min-height:210px}
.fi{position:relative;width:100%;height:100%;min-height:210px;transition:transform .55s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.fcard.flip .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:16px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;overflow:hidden}
.ff.back{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(139,92,246,.22),rgba(27,32,43,.92))}
.fcard:hover .ff{border-color:rgba(139,92,246,.45)}
.ff .w{font-size:1.5rem;font-weight:800;overflow-wrap:anywhere}
.ff .acts{margin-top:auto;display:flex;gap:6px;align-items:center}
.ff .th{font-size:1.25rem;font-weight:700;color:var(--mint)}
.ff .dfn{font-size:.8125rem;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tx2);background:rgba(255,255,255,.05);transition:color .2s,background .2s,transform .15s}
.mini:hover{color:var(--tx);background:rgba(255,255,255,.1)}
.mini:active{transform:scale(.9)}
.mini.on{color:var(--bad)} .mini.ok{color:var(--mint)}
.mini.on svg,.mini.on i{fill:currentColor}
.badge-l{position:absolute;top:12px;right:12px}
.lrn{position:absolute;top:14px;right:14px;color:var(--mint)}

.filters{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:10px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.8125rem;font-weight:500;color:var(--tx2);min-height:36px}
.chip[aria-pressed="true"]{background:rgba(139,92,246,.25);color:#fff;border-color:rgba(139,92,246,.5)}

/* ---------- Modal / toast / notif ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(5,7,12,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .2s}
.mbox{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);animation:pop .25s ease-out}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.bigcard{perspective:1100px;cursor:pointer;min-height:300px}
.bigcard .fi{min-height:300px}
.bigcard .ff{padding:22px;gap:8px}
.bigcard .w{font-size:2.25rem}
.blur{filter:blur(7px);user-select:none}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--vio);border-radius:12px;padding:10px 14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.7);animation:up .25s ease-out;font-size:.9375rem}
.toast.ok{border-left-color:var(--mint)} .toast.warn{border-left-color:var(--warn)}
.notif{position:absolute;right:0;top:52px;width:min(340px,calc(100vw - 32px));background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 24px 60px -16px rgba(0,0,0,.8);z-index:40;animation:pop .2s ease-out;display:grid;gap:6px}
.notif div{display:flex;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04)}
.rel{position:relative}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:#000;color:#fff;font-size:.6875rem;padding:3px 8px;border-radius:6px;z-index:60;pointer-events:none}

/* ---------- Quiz / practice ---------- */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);min-height:52px;transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not(:disabled){border-color:rgba(139,92,246,.6);background:rgba(139,92,246,.12)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--mint);background:rgba(94,234,212,.14);animation:pulse .45s}
.opt.no{border-color:var(--bad);background:rgba(251,113,133,.14);animation:shake .4s}
.opt .k{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-weight:700;font-size:.8125rem;flex:none}
.qtype{display:grid;gap:8px;text-align:left;width:100%;padding:16px;border-radius:16px;background:rgba(255,255,255,.04);border:1.5px solid var(--line);transition:border-color .2s,background .2s}
.qtype[aria-pressed="true"]{border-color:var(--vio);background:rgba(139,92,246,.16)}
.qtype i,.qtype svg{color:var(--blue)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.sel{border-color:var(--blue);background:rgba(96,165,250,.18);box-shadow:inset 0 0 0 1px var(--blue)}
.mt .opt{justify-content:center;text-align:center;overflow-wrap:anywhere}
.mt .opt.sel{border-color:var(--blue);background:rgba(96,165,250,.16)}
.score{font-size:3.25rem;font-weight:800;background:linear-gradient(90deg,var(--vio),var(--blue),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.prow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .e{font-weight:700}
.kbd{font-size:.6875rem;padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx2)}

/* ---------- Charts ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars div{flex:1;display:grid;grid-template-rows:1fr auto;gap:6px;height:100%;justify-items:center;min-width:0;text-align:center}
.bars .col{width:100%;max-width:38px;align-self:end;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--vio),var(--blue));min-height:4px;transition:height .7s cubic-bezier(.2,.8,.2,1);position:relative}
.bars .col span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.6875rem;color:var(--tx2)}
.bars small{font-size:.6875rem;color:var(--tx2)}
.skel{height:110px;border-radius:var(--r);background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:shim 1.1s linear infinite}
.sw{position:relative;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--vio)} .sw[aria-checked="true"]::after{transform:translateX(20px)}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set:first-of-type{border-top:0}
.set .inp{width:auto;min-width:140px}
input[type=range]{accent-color:var(--vio);width:160px}

.ta{resize:vertical;min-height:170px;line-height:1.6;font-size:1rem}
.runbar{position:sticky;top:68px;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:16px;background:rgba(20,24,33,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}
.tmr{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotateX(72deg) rotate(360deg)}}

function say(text){
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){toast("This browser does not support speech playback.","warn");return false}
  try{
    var u=new SpeechSynthesisUtterance(text), vs=speechSynthesis.getVoices()||[], a=S.d.set.accent;
    u.lang=a; u.rate=S.d.set.rate;
    var v=vs.filter(function(x){return x.lang.replace("_","-")===a})[0]||vs.filter(function(x){return x.lang.slice(0,2)==="en"})[0];
    if(v)u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u); return true;
  }catch(e){toast("Could not play audio.","warn");return false}
}

  if(reduced())return;

    var cv=document.createElement("canvas"); cv.setAttribute("aria-hidden","true");
    cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120";
    var W=cv.width=innerWidth,H=cv.height=innerHeight; document.body.appendChild(cv);
    var cx=cv.getContext("2d"),cols=["#8B5CF6","#60A5FA","#5EEAD4","#F8FAFC","#FBBF24"],ps=[];
    for(var i=0;i<80;i++)ps.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.4,vx:(Math.random()-.5)*11,vy:-Math.random()*12-3,s:5+Math.random()*6,c:cols[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.4});
    var t0=Date.now();
    (function f(){var el=Date.now()-t0;cx.clearRect(0,0,W,H);
      ps.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-el/1700);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()});
      if(el<1700)requestAnimationFrame(f);else if(cv.parentNode)cv.parentNode.removeChild(cv)})();

}

/* ----- Quiz ----- */
function buildQuiz(type,scope){
  var pool=scopeWords(scope), need=type==="match"?5:4;
  if(type==="fill")pool=pool.filter(function(w){return new RegExp("\\b"+w.w+"\\b","i").test(w.ex)});
  if(pool.length<need){toast("Need at least "+need+" words in this set to play this quiz.","warn");return null}
  var Q={type:type,scope:scope,i:0,score:0,wrong:[],ans:null,done:false,items:[],rounds:null,total:0};
  if(type==="match"){
    var rn=pool.length>=10?2:1; var ws=shuffle(pool); Q.rounds=[]; Q.total=rn*5;
    for(var r=0;r<rn;r++){var ids=ws.slice(r*5,r*5+5).map(function(w){return w.id}); Q.rounds.push({ids:ids,right:shuffle(ids),dn:{},sel:null,bad:-1,miss:{}})}
    return Q;
  }
  var items=shuffle(pool).slice(0,10);
  Q.items=items.map(function(w){
    var others=shuffle(WORDS.filter(function(x){return x.id!==w.id})).slice(0,3), opts=shuffle([w].concat(others));
    var it={id:w.id,opts:opts.map(function(x){return x.id}),a:opts.indexOf(w)};
    if(type==="fill")it.s=w.ex.replace(new RegExp("\\b"+w.w+"\\b","i"),"_____");
    return it;
  });
  Q.total=Q.items.length; return Q;
}
function quizSetup(){
  var h=pageTitle("Quiz","Pick a quiz type and a word set.");
  h+='<div class="gap"><div class="g3" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">'+QTYPES.map(function(t){return '<button class="qtype" data-a="qtype" data-t="'+t[0]+'" aria-pressed="'+(S.qCfg.type===t[0])+'">'+ic(t[3])+'<b>'+t[1]+'</b><span class="muted small">'+t[2]+'</span></button>'}).join("")+'</div>'+
   '<div class="card row" style="justify-content:space-between"><div style="min-width:220px;flex:1">'+scopeSelect(S.qCfg.scope).replace('data-cfg="scope"','data-qcfg="scope"')+'</div><button class="btn" data-a="qstart">'+ic("play")+'Start quiz</button></div></div>';
  if(S.d.quiz.length){h+='<div class="sech" style="margin-top:22px"><h2>Recent scores</h2></div><div class="card">'+S.d.quiz.slice(-5).reverse().map(function(q){var tt=QTYPES.filter(function(t){return t[0]===q.t})[0];return '<div class="prow"><b>'+esc(tt?tt[1]:q.t)+'</b><span class="muted small">'+esc(new Date(q.at).toLocaleDateString())+'</span><span style="margin-left:auto;font-weight:700">'+q.s+'/'+q.n+' · '+Math.round(q.s/q.n*100)+'%</span></div>'}).join("")+'</div>'}
  return h;
}
function quizRun(){
  var Q=S.qz, tt=QTYPES.filter(function(t){return t[0]===Q.type})[0];
  var head='<div class="row" style="justify-content:space-between"><span class="lbl">'+esc(tt[1])+'</span><button class="btn sm ghost" data-a="qquit">Quit</button></div>';
  if(Q.type==="match"){
    var R=Q.rounds[Q.i], done=Object.keys(R.dn).length;
    return pageTitle("Quiz")+'<div class="card" style="max-width:640px">'+head+'<div class="row small muted" style="justify-content:space-between;margin:8px 0"><span>Round '+(Q.i+1)+' / '+Q.rounds.length+'</span><span>Matched '+done+' / 5</span></div>'+bar(Math.round((Q.i*5+done)/Q.total*100))+
     '<p class="muted small" style="margin:14px 0 10px">Tap an English word, then its Thai meaning.</p><div class="mt"><div class="gap" style="gap:8px">'+R.ids.map(function(id){var d=R.dn[id];return '<button class="opt'+(d?' ok':(R.sel===id?' sel':''))+'" data-a="mL" data-id="'+id+'"'+(d?' disabled':'')+'>'+esc(BYID[id].w)+'</button>'}).join("")+'</div><div class="gap" style="gap:8px">'+R.right.map(function(id){var d=R.dn[id];return '<button class="opt'+(d?' ok':(R.bad===id?' no':''))+'" data-a="mR" data-id="'+id+'"'+(d?' disabled':'')+'>'+esc(BYID[id].th)+'</button>'}).join("")+'</div></div></div>';
  }
  var it=Q.items[Q.i], w=BYID[it.id], q="", sub="";
  if(Q.type==="mc"){q='<div class="big" style="font-size:2rem;overflow-wrap:anywhere">'+esc(w.w)+'</div><div class="ipa">'+esc(w.ipa)+'</div>'; sub="Choose the Thai meaning"}
  else if(Q.type==="th2en"){q='<div class="big" style="font-size:1.75rem">'+esc(w.th)+'</div>'; sub="Choose the English word"}
  else if(Q.type==="fill"){q='<div style="font-size:1.25rem;font-weight:600">'+esc(it.s)+'</div>'; sub="Choose the word that fits"}
  else {q='<button class="btn" data-a="say" data-t="'+esc(w.w)+'">'+ic("volume-2")+'Play word</button>'; sub="Choose the word you hear"}
  var h=pageTitle("Quiz")+'<div class="card" style="max-width:640px">'+head+'<div class="row small muted" style="justify-content:space-between;margin:8px 0"><span>Question '+(Q.i+1)+' / '+Q.total+'</span><span>Score '+Q.score+'</span></div>'+bar(Math.round(Q.i/Q.total*100))+
   '<div style="margin:20px 0 6px;display:grid;gap:6px">'+q+'</div><p class="muted small" style="margin-bottom:12px">'+sub+'</p><div class="gap" style="gap:10px">'+it.opts.map(function(id,oi){
     var o=BYID[id], t=(Q.type==="mc")?o.th:o.w, c="";
     if(Q.ans!==null){c=oi===it.a?" ok":(oi===Q.ans?" no":"")}
     return '<button class="opt'+c+'" data-a="qans" data-i="'+oi+'"'+(Q.ans!==null?' disabled':'')+'><span class="k">'+"ABCD"[oi]+'</span><span>'+esc(t)+'</span></button>'}).join("")+'</div>';
  if(Q.ans!==null){
    var ok=Q.ans===it.a;
    h+='<div class="card" style="margin-top:14px;background:'+(ok?'rgba(94,234,212,.1)':'rgba(251,113,133,.1)')+'"><b>'+(ok?'Correct!':'Not quite')+'</b><p class="small muted" style="margin-top:4px">'+esc(w.w)+' = '+esc(w.th)+(w.ex?' · “'+esc(w.ex)+'”':'')+'</p></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-a="qnext">'+(Q.i===Q.total-1?"See results":"Next")+ic("chevron-right")+'</button></div>';
  }
  return h+'</div>';
}
function quizDone(){
  var Q=S.qz, pct=Math.round(Q.score/Q.total*100), msg=pct>=90?"Outstanding!":pct>=70?"Great work!":pct>=50?"Good effort, keep going!":"Every mistake is a lesson.";
  var h=pageTitle("Quiz results")+'<div class="card empty" style="max-width:640px">'+slot("quiz","Quiz complete","empty")+'<div class="score">'+Q.score+' / '+Q.total+'</div><h3>'+pct+'% · '+msg+'</h3><div class="row" style="justify-content:center"><button class="btn" data-a="qretry">'+ic("rotate-ccw")+'Retry</button><button class="btn ghost" data-a="qquit">New quiz</button>'+(Q.wrong.length?'<button class="btn ghost" data-a="qprac">Practice mistakes</button>':'')+'</div></div>';
  if(Q.wrong.length){h+='<div class="sech" style="margin-top:20px"><h2>Review incorrect answers</h2></div><div class="card" style="max-width:640px">'+Q.wrong.map(function(id){var w=BYID[id];return '<div class="prow"><div style="min-width:0"><div class="e">'+esc(w.w)+' <span class="ipa small">'+esc(w.ipa)+'</span></div><div class="muted small">'+esc(w.th)+' · '+esc(w.def)+'</div></div><span style="margin-left:auto;display:flex;gap:4px">'+audioBtn(w.w)+favBtn(w.id)+'</span></div>'}).join("")+'</div>'}
  return h;
}
pages.quiz=function(){var Q=S.qz; if(!Q)return quizSetup(); return Q.done?quizDone():quizRun()};
function finishQuiz(){
  var Q=S.qz; Q.done=true;
  S.d.quiz.push({t:Q.type,s:Q.score,n:Q.total,at:Date.now(),sc:Q.scope}); S.d.quiz=S.d.quiz.slice(-50);
  mark(); pushHist("quiz",Q.score+"/"+Q.total+" · "+QTYPES.filter(function(t){return t[0]===Q.type})[0][1]); save();
  if(Q.score/Q.total>=.8)confetti();
}

  var hist=S.d.hist.length?S.d.hist.slice(0,10).map(function(h){return '<div class="prow">'+ic(h.t==="quiz"?"list-checks":h.t==="exam"?"target":"circle-check")+'<div style="min-width:0"><b>'+(h.t==="quiz"?"Quiz":h.t==="exam"?"Exam":"Learned")+'</b> <span class="muted">'+esc(h.l)+'</span></div><span class="muted small" style="margin-left:auto;white-space:nowrap">'+esc(new Date(h.at).toLocaleDateString(undefined,{day:"numeric",month:"short"}))+'</span></div>'}).join(""):'<p class="muted">Your learning history will appear here.</p>';
  return pageTitle("My Progress","Your learning analytics")+'<div class="gap">'+
   '<section class="card welcome" style="grid-template-columns:1fr 1fr"><div style="align-self:center"><span class="tag">Level '+lv.n+' · '+lv.t+'</span><h2 style="font-size:1.6rem;margin:8px 0">'+lc+' of '+tot+' words learned</h2><p class="muted">Every 5 learned words raises your level.</p><div style="margin-top:14px">'+bar(Math.round(lc/tot*100))+'</div></div>'+slot("achievement","Achievement","hero")+'</section>'+

  return list.map(function(w){return '<div class="prow"><div style="min-width:0"><div class="e">'+esc(w.w)+' <span class="ipa small">'+esc(w.ipa)+'</span></div><div class="muted small">'+esc(w.th)+' · '+esc(w.pos)+'</div></div><span style="margin-left:auto;display:flex;gap:4px">'+audioBtn(w.w)+'<button class="mini" data-a="detail" data-id="'+w.id+'" aria-label="Open details" data-tip="Details">'+ic("book-open")+'</button><button class="mini on" data-a="unfav" data-id="'+w.id+'" aria-label="Remove from favorites" data-tip="Remove">'+ic("heart")+'</button></span></div>'}).join("");
}

function render(keepScroll){
  var v=$("#view"); v.innerHTML=pages[S.page](); v.classList.remove("enter"); void v.offsetWidth; if(!keepScroll)v.classList.add("enter");
  renderChrome(); refreshIcons(); ensureSpline();
}
function go(p,keep){
  if(p==="exam"&&!RUN)UX.unit=null;
  S.page=p; S.notif=false; $("#app").classList.remove("open");
  if(S.busy)return;
  if(reduced()||keep){render(keep); if(!keep)window.scrollTo(0,0); return}
  S.busy=true; $("#view").innerHTML='<div class="gap"><div class="skel" style="height:56px;width:50%"></div><div class="skel"></div><div class="skel"></div></div>'; renderChrome(); refreshIcons();
  window.scrollTo(0,0);
  setTimeout(function(){S.busy=false; render()},160);
}
function updateVres(){var r=$("#vres"); if(r){r.innerHTML=vocabResults(); refreshIcons()}}

   Events

function refreshHere(){render(true)}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");
  if(S.notif&&!e.target.closest("#np")&&!(el&&el.dataset.a==="notif")){S.notif=false; renderChrome(); refreshIcons()}
  if($("#app").classList.contains("open")&&!e.target.closest("#side")&&!(el&&el.dataset.a==="menu"))$("#app").classList.remove("open");
  if(!el)return;
  var a=el.dataset.a, id=+el.dataset.id;
  if(a==="ovclose"){if(e.target===el){S.modal=null; renderModal()} return}
  if(a==="go"){go(el.dataset.p)}
  else if(a==="menu"){$("#app").classList.toggle("open")}
  else if(a==="notif"){S.notif=!S.notif; renderChrome(); refreshIcons()}
  else if(a==="collapse"){S.d.set.collapsed=!S.d.set.collapsed; save(); renderChrome(); refreshIcons(); if(S.page==="settings")refreshHere()}
  else if(a==="slots"){S.d.set.slots=!S.d.set.slots; save(); refreshHere()}
  else if(a==="say"){say(el.dataset.t)}
  else if(a==="flip"){el.classList.toggle("flip")}
  else if(a==="flipbig"){el.classList.toggle("flip"); if(S.modal)S.modal.flip=el.classList.contains("flip"); if(S.pr)S.pr.rev=el.classList.contains("flip")}
  else if(a==="fav"){toggleFav(id); favSync(id)}
  else if(a==="unfav"){toggleFav(id); refreshHere(); renderChrome(); refreshIcons()}
  else if(a==="lrn"){toggleLearned(id); lrnSync(id)}
  else if(a==="detail"){openDetail(id,S.page==="vocabulary"?null:(S.page==="favorites"?Object.keys(S.d.fav).map(Number):null))}
  else if(a==="mclose"){S.modal=null; renderModal()}
  else if(a==="mprev"||a==="mnext"){var M=S.modal; M.i=(M.i+(a==="mnext"?1:-1)+M.list.length)%M.list.length; M.flip=false; renderModal()}
  else if(a==="mtr"){S.modal.tr=!S.modal.tr; renderModal()}
  else if(a==="openCat"){S.vf={cat:+el.dataset.c,sub:-1,lv:0,st:"all",fav:false,n:24}; S.vq=""; go("vocabulary")}
  else if(a==="clearf"){S.vf={cat:0,sub:-1,lv:0,st:"all",fav:false,n:24}; S.vq=""; $("#gq").value=""; render(true)}
  else if(a==="favf"){S.vf.fav=!S.vf.fav; S.vf.n=24; render(true)}
  else if(a==="sub"){S.vf.sub=+el.dataset.s; S.vf.n=24; render(true)}
  else if(a==="more"){S.vf.n+=24; updateVres()}
  else if(a==="pracCat"){var c=+el.dataset.c, ws=catWords(c), un=ws.filter(function(w){return !isL(w.id)}); startPractice(shuffle((un.length?un:ws)).map(function(w){return w.id}),c)}
  else if(a==="shuf"){S.prCfg.shuffle=!S.prCfg.shuffle; refreshHere()}
  else if(a==="pstart"){var ids=scopeWords(S.prCfg.scope).map(function(w){return w.id}); startPractice(S.prCfg.shuffle?shuffle(ids):ids)}
  else if(a==="pagain"){S.pr=null; refreshHere()}
  else if(a==="pexit"){S.pr=null; refreshHere()}
  else if(a==="pprev"){practiceMove(-1)}
  else if(a==="pnext"){practiceMove(1)}
  else if(a==="favReview"){startPractice(shuffle(Object.keys(S.d.fav).map(Number)).filter(function(i){return BYID[i]}))}
  else if(a==="favQuiz"){S.qCfg={type:"mc",scope:"fav"}; S.qz=buildQuiz("mc","fav"); if(S.qz){go("quiz",true)}}
  else if(a==="qtype"){S.qCfg.type=el.dataset.t; refreshHere()}
  else if(a==="qstart"){S.qz=buildQuiz(S.qCfg.type,S.qCfg.scope); if(S.qz){render(true); window.scrollTo(0,0); if(S.qz.type==="listen")autoSay()}}
  else if(a==="qquit"){S.qz=null; refreshHere()}
  else if(a==="qretry"){S.qz=buildQuiz(S.qz.type,S.qz.scope); refreshHere(); if(S.qz&&S.qz.type==="listen")autoSay()}
  else if(a==="qprac"){startPractice(S.qz.wrong.slice())}
  else if(a==="qans"){var Q=S.qz; if(!Q||Q.ans!==null)return; Q.ans=+el.dataset.i; var it=Q.items[Q.i]; if(Q.ans===it.a)Q.score++; else Q.wrong.push(it.id); render(true)}
  else if(a==="qnext"){var Q2=S.qz; if(Q2.i>=Q2.total-1){finishQuiz()}else{Q2.i++;Q2.ans=null} render(true); window.scrollTo(0,0); if(!Q2.done&&Q2.type==="listen")autoSay()}
  else if(a==="mL"){var R=S.qz.rounds[S.qz.i]; R.sel=id; R.bad=-1; render(true)}
  else if(a==="mR"){matchPick(id)}
  else if(a==="resetAsk"){S.modal={type:"reset"}; renderModal()}
  else if(a==="resetDo"){S.d=defData(); save(); S.modal=null; S.pr=null; S.qz=null; renderModal(); toast("Progress has been reset."); render(true)}
});
document.addEventListener("keydown",function(e){
  var tg=e.target, typing=tg&&(tg.tagName==="INPUT"||tg.tagName==="SELECT"||tg.tagName==="TEXTAREA");
  if(e.key==="Escape"){if(S.modal){S.modal=null;renderModal()} if(S.notif){S.notif=false;renderChrome();refreshIcons()} $("#app").classList.remove("open"); return}
  if((e.key==="Enter"||e.key===" ")&&tg&&tg.classList&&tg.classList.contains("fcard")){e.preventDefault(); tg.click(); return}
  if(typing)return;
  var M=S.modal&&S.modal.type==="word"?S.modal:null, P=(!M&&S.page==="practice"&&S.pr&&!S.pr.end)?S.pr:null;
  if(!M&&!P)return;
  if(e.key==="ArrowRight"){e.preventDefault(); M?($('[data-a="mnext"]').click()):practiceMove(1)}
  else if(e.key==="ArrowLeft"){e.preventDefault(); M?($('[data-a="mprev"]').click()):practiceMove(-1)}
  else if(e.key===" "){if(tg&&tg.tagName==="BUTTON")return; e.preventDefault(); var c=$(".bigcard"); if(c){c.classList.toggle("flip"); if(M)M.flip=c.classList.contains("flip"); else P.rev=c.classList.contains("flip")}}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="gq"){S.vq=t.value; if(S.page!=="vocabulary"){S.vf.n=24; go("vocabulary",true); var g=$("#gq"); if(g)g.focus()} else {var vq=$("#vq"); if(vq)vq.value=t.value; updateVres()}}
  else if(t.id==="vq"){S.vq=t.value; S.vf.n=24; $("#gq").value=t.value; updateVres()}
  else if(t.id==="fq"){S.fq=t.value; var l=$("#favlist"); if(l){var q=S.fq.trim().toLowerCase(); l.innerHTML=favRows(Object.keys(S.d.fav).map(Number).filter(function(i){return BYID[i]}).map(function(i){return BYID[i]}).filter(function(w){return !q||w.w.toLowerCase().indexOf(q)>=0||w.th.indexOf(q)>=0})); refreshIcons()}}
  else if(t.dataset.s==="rate"){S.d.set.rate=+t.value; var rt=$("#rt"); if(rt)rt.textContent=(+t.value).toFixed(1)+"×"; save()}
  else if(t.dataset.s==="name"){S.d.set.name=t.value.trim()||"Learner"; save(); renderChrome(); refreshIcons()}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.f){var k=t.dataset.f, v=t.value; S.vf[k]=(k==="st")?v:+v; if(k==="cat")S.vf.sub=-1; S.vf.n=24; render(true)}
  else if(t.dataset.cfg==="scope"){S.prCfg.scope=t.value; render(true)}
  else if(t.dataset.qcfg==="scope"){S.qCfg.scope=t.value; render(true)}
  else if(t.dataset.s==="goal"){S.d.set.goal=+t.value; save(); renderChrome(); refreshIcons(); toast("Daily target updated.","ok")}
  else if(t.dataset.s==="accent"){S.d.set.accent=t.value; save(); say("Hello, welcome to Wordverse.")}
});
function favSync(id){
  var on=isF(id);
  document.querySelectorAll('[data-a="fav"][data-id="'+id+'"],[data-a="fav"]').forEach(function(b){if(+b.dataset.id===id){b.classList.toggle("on",on); b.setAttribute("aria-pressed",on)}});
  if(S.modal&&S.modal.type==="word")renderModal();
  renderChrome(); refreshIcons();
}
function lrnSync(id){
  if(S.modal&&S.modal.type==="word"){renderModal()}
  if(S.page==="vocabulary"){var flipped=[].map.call(document.querySelectorAll(".fcard.flip:not(.bigcard)"),function(c){return c.dataset.id}); updateVres(); flipped.forEach(function(i){var c=document.querySelector('.fcard[data-id="'+i+'"]'); if(c)c.classList.add("flip")})}
  else if(S.page==="practice"){var c=$(".bigcard"), fl=c&&c.classList.contains("flip"); render(true); if(fl){var c2=$(".bigcard"); if(c2)c2.classList.add("flip")}; if(S.pr&&isL(id))S.pr.mast++}
  else render(true);
  renderChrome(); refreshIcons();
}
function practiceMove(d){
  var P=S.pr; if(!P)return;
  var n=P.i+d; if(n<0)return;
  if(n>=P.list.length){P.end=true; mark(); save(); confetti(); refreshHere(); return}
  P.i=n; P.rev=false; refreshHere();
}
function autoSay(){var Q=S.qz; if(Q&&Q.items[Q.i])setTimeout(function(){say(BYID[Q.items[Q.i].id].w)},250)}
function matchPick(id){
  var Q=S.qz, R=Q.rounds[Q.i]; if(R.sel===null){toast("Tap an English word first.","warn");return}
  if(id===R.sel){R.dn[id]=1; R.sel=null; R.bad=-1; if(!R.miss[id])Q.score++; if(Object.keys(R.dn).length===5){if(Q.i>=Q.rounds.length-1){finishQuiz()}else{Q.i++}}}
  else{R.miss[R.sel]=1; R.bad=id; if(Q.wrong.indexOf(R.sel)<0)Q.wrong.push(R.sel); R.sel=null}
  render(true);
}

 quiz:[{q:"The phone is ringing. I ____ answer it.",o:["will","am going to","have","was"],a:0,w:"ตัดสินใจทันทีตอนพูด ใช้ will"},

  pts:[["at 9:00 · on Monday · in March","at = เวลา/จุด, on = วันและวันที่, in = เดือน ปี ช่วงเวลายาว"],

 read:{title:"Order Confirmation",text:"Thank you for your order #48213.\n\nYour items, two standing desks and one office chair, will ship from our Chicago warehouse on 12 March and should arrive within five business days. A shipping notice with tracking information will be emailed once the package leaves the warehouse.\n\nReturns are accepted within 30 days of delivery, provided the items are in their original packaging. A refund will be issued to the original payment method within seven days after we receive the return.",

 write:{prompt:"Write a short email (60–90 words) to a hotel asking to change your reservation from 10 June to 12 June. Ask whether the price will change and what the cancellation policy is.",min:50,

{id:"t4",tr:"toeic",title:"Reports & Business Growth",th:"รายงานและการเติบโตทางธุรกิจ",tag:"Part 5–7",
 learn:{intro:"Part 5 ทดสอบไวยากรณ์ในประโยคเดียว ข้อที่ออกบ่อยคือรูปคำ (word form) บทนี้สอนดูตำแหน่งของคำในประโยค พร้อมคำศัพท์จากรายงานธุรกิจ และการเปรียบเทียบ",
  pts:[["a significant increase (noun) · sales increase (verb)","หลัง a/the + adjective ต้องเป็นคำนามเสมอ"],
       ["Sales rose sharply.","adverb (-ly) ขยายกริยา adjective หรือ adverb อื่น"],
       ["-tion / -ment / -ness → noun · -ive / -ful / -al → adjective · -ize / -ify → verb","ดูคำลงท้ายเพื่อเดาหน้าที่ของคำ"],
       ["more profitable than · the highest in the region","คำยาวใช้ more/most, คำสั้นเติม -er/-est"]],
  vocab:[["revenue","รายได้","Revenue rose by eight percent."],["decline","ลดลง","Profits declined in the second quarter."],["forecast","คาดการณ์","The forecast is positive."],["expand","ขยาย","We plan to expand into Asia."],["competitor","คู่แข่ง","Our main competitor lowered prices."],["quarter","ไตรมาส","The third quarter ends in September."],["margin","อัตรากำไร","Shipping costs reduced our margin."]],
  tip:"ข้อ word form: ตัดสินก่อนว่าช่องว่างต้องการ noun, verb, adjective หรือ adverb แล้วค่อยดูตัวเลือก โดยไม่ต้องรู้ความหมายทั้งประโยค"},
 read:{title:"Quarterly Report Summary",text:"Quarterly Report Summary\n\nRevenue for the third quarter rose 8 percent compared with the same period last year, reaching $2.4 million. The increase was driven mainly by online sales, which grew twice as fast as in-store sales.\n\nHowever, shipping costs also climbed, reducing overall profit margins slightly. Management forecasts moderate growth in the fourth quarter and plans to expand the customer service team to handle higher order volumes.",
  qs:[{q:"What mainly caused the increase in revenue?",o:["Lower prices","Growth in online sales","New stores","A larger customer service team"],a:1,w:"'driven mainly by online sales'"},
      {q:"What negative trend does the report mention?",o:["Falling revenue","Fewer online orders","Higher shipping costs","Lower in-store sales"],a:2,w:"'shipping costs also climbed, reducing… profit margins'"},
      {q:"What does management plan to do?",o:["Close a store","Expand the customer service team","Reduce online sales","Raise shipping prices"],a:1,w:"'plans to expand the customer service team'"}]},
 listen:{lines:[{s:"A",t:"Good morning, everyone. Before we begin, I'd like to share some good news. Our Osaka branch exceeded its sales target by twelve percent this quarter, the best result in the company. To celebrate, lunch will be provided in the cafeteria on Friday at noon. Please also remember to submit your expense reports by the end of this week."}],
  qs:[{q:"What is the good news?",o:["A new branch will open.","The Osaka branch beat its target.","Salaries will increase.","A manager is retiring."],a:1,w:"'Osaka branch exceeded its sales target by twelve percent'"},
      {q:"What will happen on Friday?",o:["A sales meeting","Staff will receive bonuses","Lunch will be provided","The cafeteria will close"],a:2,w:"'lunch will be provided in the cafeteria on Friday at noon'"},
      {q:"What are listeners reminded to do?",o:["Submit expense reports","Visit the Osaka branch","Sign up for lunch","Update their schedules"],a:0,w:"'remember to submit your expense reports'"}]},
 write:{prompt:"Write a short report summary (70–100 words). Facts: sales increased by 10% in Q2; costs rose by 3%; you recommend hiring two more staff.",min:50,
  tips:["เริ่มด้วยผลลัพธ์หลักพร้อมตัวเลข","ใช้ However เพื่อเชื่อมข้อมูลที่ตรงข้าม","ใช้ adverb บอกระดับ: slightly, sharply","จบด้วยข้อเสนอ: I recommend…"],
  model:"Subject: Q2 Sales Summary\n\nSales increased by 10 percent in the second quarter, reaching a record level for the year. However, costs also rose by 3 percent, mainly because of higher shipping fees. Overall, profit improved slightly. Based on these results, I recommend hiring two additional staff members to handle the growing number of orders and to maintain our delivery times."},
 quiz:[{q:"The company reported a significant ____ in profits.",o:["increase","increasingly","increased","increase to"],a:0,w:"หลัง a significant ต้องเป็น noun"},
       {q:"Sales rose ____ last quarter.",o:["sharp","sharply","sharpness","sharpen"],a:1,w:"ขยายกริยา rose ใช้ adverb"},
       {q:"This model is ____ than the previous one.",o:["more efficient","most efficient","efficiently","as efficient"],a:0,w:"มี than จึงเป็น comparative: more efficient"},
       {q:"Our new branch is the ____ in the region.",o:["large","larger","largest","more large"],a:2,w:"มี the + in the region เป็น superlative: largest"}]},

{id:"i1",tr:"ielts",title:"Reading: True / False / Not Given",th:"อ่าน: ข้อสอบ T/F/NG และการฟังกรอกแบบฟอร์ม",tag:"Reading + Listening S1",
 learn:{intro:"IELTS Reading ใช้เวลา 60 นาที มี 3 บทความ รวม 40 ข้อ ข้อ True / False / Not Given เป็นรูปแบบที่ผู้เรียนพลาดบ่อยที่สุด เพราะต้องแยก 'ขัดแย้ง' ออกจาก 'ไม่มีข้อมูล' บทนี้ยังฝึกฟังกรอกแบบฟอร์ม (Listening Section 1) ซึ่งเต็มไปด้วยตัวเลขและการสะกดชื่อ",
  pts:[["True = ข้อความตรงกับบทความ","บทความยืนยันตรงๆ หรือบอกเป็นคำพ้องความหมาย"],
       ["False = ข้อความขัดแย้งกับบทความ","บทความบอกตรงข้าม เช่น inside vs. outside"],
       ["Not Given = บทความไม่พูดถึง","ห้ามใช้ความรู้ส่วนตัวตัดสิน ถ้าหาหลักฐานในบทความไม่ได้ ให้เลือก Not Given"],
       ["ระวังคำจำกัด: all, only, never, always, some","ข้อความที่เปลี่ยนคำเหล่านี้จากบทความมักเป็น False หรือ Not Given"]],
  vocab:[["skim","กวาดอ่านเร็วเพื่อจับใจความ","Skim the passage first."],["scan","กวาดหาคำเฉพาะ","Scan for numbers and names."],["paraphrase","เรียบเรียงใหม่","Questions often paraphrase the text."],["synonym","คำพ้องความหมาย","'rise' is a synonym of 'increase'."],["contradict","ขัดแย้ง","The text contradicts the statement."],["qualifier","คำจำกัดขอบเขต","'Only' is a qualifier."],["evidence","หลักฐาน","Find evidence in the text."]],
  tip:"IELTS Reading: ไม่มีเวลาเพิ่มสำหรับลอกคำตอบ ต้องเขียนลงใบคำตอบภายใน 60 นาที จึงควรฝึกจับเวลาเป็นประจำ ส่วน Listening: เสียงเล่นครั้งเดียว และสะกดผิดถือว่าผิด"},
 read:{title:"The Honeybee Dance",text:"Honeybees communicate the location of food through a movement known as the waggle dance. A forager that has found a rich source of nectar returns to the hive and moves in a figure-eight pattern on the vertical surface of the comb. The angle of the straight central run, measured against the vertical, shows the direction of the food relative to the sun, while the length of the run signals distance.\n\nResearchers first described this system in the 1940s. Since then, experiments have shown that bees can adjust the dance when the sun is hidden by clouds, although accuracy tends to fall. The dance is performed inside a dark hive, so other bees follow it by touch and by detecting vibrations rather than by sight.",
  qs:[{q:"The waggle dance is performed outside the hive.",o:TF,a:1,w:"False: บทความบอกว่า 'performed inside a dark hive' ตรงข้ามกับข้อความ"},
      {q:"The length of the central run shows how far away the food is.",o:TF,a:0,w:"True: 'the length of the run signals distance' (signals = shows)"},
      {q:"Younger bees perform the dance more accurately than older bees.",o:TF,a:2,w:"Not Given: บทความไม่ได้พูดถึงอายุของผึ้งเลย"}]},
 listen:{lines:[{s:"A",t:"Good morning, Riverside Language Centre. How can I help you?"},{s:"B",t:"Hello, I would like to enrol in the evening English course."},{s:"A",t:"Certainly. Could I have your surname, please?"},{s:"B",t:"Yes, it's Phongsri. That's P H O N G S R I."},{s:"A",t:"Thank you. And a contact number?"},{s:"B",t:"It's zero seven eight four, five five two, nine one six."},{s:"A",t:"Lovely. The course starts on the fourteenth of October. It runs on Tuesdays and Thursdays, from six thirty to eight thirty in the evening."},{s:"B",t:"And how much is the fee?"},{s:"A",t:"It's two hundred and eighty pounds, including all materials. Last year it was two hundred and fifty, but prices went up in September."},{s:"B",t:"That's fine. Thank you."}],
  qs:[{q:"When does the course start?",o:["4 October","14 October","18 October","24 October"],a:1,w:"'the fourteenth of October' ฟังให้ชัดระหว่าง fourteenth กับ fortieth"},
      {q:"On which days does the course run?",o:["Mondays and Wednesdays","Tuesdays and Thursdays","Wednesdays and Fridays","Saturdays and Sundays"],a:1,w:"'Tuesdays and Thursdays'"},
      {q:"What is the course fee?",o:["£250","£208","£280","£218"],a:2,w:"£280 คือราคาปัจจุบัน ส่วน £250 เป็นราคาปีที่แล้ว (ตัวหลอก)"}]},
 write:{prompt:"Summarise the honeybee passage in 50–70 words, using your own words (paraphrase; do not copy whole phrases).",min:40,
  tips:["เปลี่ยนคำ: communicate → tell, location → where, distance → how far","เปลี่ยนโครงสร้างประโยค ไม่ใช่แค่เปลี่ยนคำ","ครอบคลุม 3 ประเด็น: ทิศทาง ระยะทาง และวิธีที่ผึ้งตัวอื่นรับรู้","ไม่ใส่ความเห็นส่วนตัว"],
  model:"Honeybees tell nest-mates where food is by performing a waggle dance inside the hive. The direction of the central run, compared with vertical, points to the food relative to the sun, and the duration of that run shows how far away it is. When clouds hide the sun, bees can still adjust their dance, although they are less accurate. Because the hive is dark, other bees follow the dance mainly through touch and vibration."},
 quiz:[{q:"A statement contradicts the passage. The answer is:",o:["True","False","Not Given","Cannot tell"],a:1,w:"ขัดแย้งกับบทความ = False"},
       {q:"You cannot find any information about the statement in the passage. The answer is:",o:["True","False","Not Given","Guess from your own knowledge"],a:2,w:"ไม่มีข้อมูลในบทความ = Not Given ห้ามใช้ความรู้ส่วนตัว"},
       {q:"In IELTS Listening, how many times is each recording played?",o:["Once","Twice","Three times","As many times as you want"],a:0,w:"เปิดครั้งเดียว จึงต้องอ่านคำถามล่วงหน้า"},
       {q:"The passage says 'some bees'. The statement says 'all bees'. This is most likely:",o:["True","False or Not Given","Always True","Always Not Given"],a:1,w:"การเปลี่ยน some เป็น all เกินกว่าที่บทความบอก จึงมักเป็น False หรือ Not Given"}]},

{id:"i2",tr:"ielts",title:"Writing Task 1: Describing Charts",th:"เขียน Task 1: อธิบายกราฟและตาราง",tag:"Academic Writing",
 learn:{intro:"Writing Task 1 (Academic) ให้เวลาประมาณ 20 นาที เขียนอย่างน้อย 150 คำ อธิบายข้อมูลจากกราฟ ตาราง หรือแผนภาพ โดยไม่ใส่ความเห็นส่วนตัว โครงสร้างที่ปลอดภัยคือ 4 ย่อหน้า",
  pts:[["Intro: paraphrase คำสั่งข้อสอบ","The graph shows… → The line graph illustrates…"],
       ["Overview: บอกแนวโน้มหลัก 1–2 ข้อ ไม่ใส่ตัวเลข","Overall, … rose, whereas … fell."],
       ["Body 1–2: จัดกลุ่มข้อมูล เปรียบเทียบด้วยตัวเลขสำคัญ","เลือกจุดเด่น ไม่ต้องใส่ทุกตัวเลข"],
       ["Trend language: rose from 20 to 35 · peaked at · levelled off · fluctuated","เติมระดับการเปลี่ยนแปลง: sharply, steadily, slightly, gradually"]],
  vocab:[["peak","ถึงจุดสูงสุด","Sales peaked at 50 million."],["plateau","คงที่ในระดับสูง","The figure reached a plateau."],["fluctuate","ขึ้นลงไม่คงที่","Prices fluctuated during the year."],["proportion","สัดส่วน","The proportion of users doubled."],["approximately","ประมาณ","Approximately 40 percent agreed."],["whereas","ในขณะที่ (เปรียบเทียบ)","Cars rose, whereas buses fell."],["overall","โดยภาพรวม","Overall, usage increased."]],
  tip:"ผู้ตรวจดูสี่ด้านเท่ากัน: Task Achievement, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy ย่อหน้า Overview ที่หายไปทำให้คะแนนด้านแรกลดลงมาก"},
 read:{title:"Model Answer: Internet Access",text:"The line graph shows the percentage of households in Country X with internet access between 2000 and 2020.\n\nOverall, internet access rose dramatically over the period, and by 2020 almost every household was connected.\n\nIn 2000, only 10 percent of households had access. This figure climbed steadily to 45 percent in 2008 and then rose more sharply, reaching 80 percent in 2014. After that, growth slowed, and the proportion levelled off at around 96 percent by 2020.",
  qs:[{q:"What percentage of households had internet access in 2008?",o:["10 percent","45 percent","80 percent","96 percent"],a:1,w:"'climbed steadily to 45 percent in 2008'"},
      {q:"Which period had the fastest growth?",o:["2000–2008","2008–2014","2014–2020","The growth was equal"],a:1,w:"2008–2014 เพิ่ม 35 จุดใน 6 ปี เร็วกว่า 2000–2008 (35 จุดใน 8 ปี) และ 2014–2020 (16 จุด)"},
      {q:"What is the function of the sentence starting 'Overall'?",o:["It lists every number","It gives the main trend","It gives the writer's opinion","It repeats the question"],a:1,w:"Overview สรุปแนวโน้มหลัก ไม่มีรายละเอียดตัวเลขและไม่มีความเห็น"}]},
 listen:{lines:[{s:"A",t:"Today I'd like to talk about cycling in our city. Over the last ten years, the number of people who cycle to work every day has doubled, from about eight thousand to sixteen thousand. The main reason is the network of protected bike lanes that was completed in twenty nineteen. However, cycling still accounts for only five percent of all commuting trips, compared with sixty percent by car."}],
  qs:[{q:"How many people now cycle to work every day?",o:["About 8,000","About 16,000","About 60,000","About 5,000"],a:1,w:"'doubled, from about eight thousand to sixteen thousand'"},
      {q:"What is the main reason for the increase?",o:["Cheaper bicycles","Protected bike lanes","Higher bus fares","A cycling festival"],a:1,w:"'The main reason is the network of protected bike lanes'"},
      {q:"What percentage of commuting trips are made by bicycle?",o:["5%","16%","60%","20%"],a:0,w:"'only five percent' (60% คือการเดินทางด้วยรถยนต์)"}]},
 write:{prompt:"The table shows the average hours per week spent on social media in a country.\n\nWrite a Task 1 report of at least 100 words (in the real test, 150 words) comparing the two groups.",
  data:"Hours per week\n               2010   2015   2020\nTeenagers        4      9     14\nAdults over 40   2      3      5",min:90,
  tips:["Intro: paraphrase 'The table shows… → The table compares…'","Overview: ทั้งสองกลุ่มเพิ่มขึ้น แต่วัยรุ่นเพิ่มมากกว่า","Body 1: ปี 2010 และ 2015   Body 2: ปี 2020 และช่องว่างที่กว้างขึ้น","ใช้ whereas / while เปรียบเทียบสองกลุ่ม"],
  model:"The table compares the average number of hours per week that teenagers and adults over 40 spent on social media in 2010, 2015 and 2020.\n\nOverall, time spent on social media rose for both groups, but the increase was far greater among teenagers.\n\nIn 2010, teenagers spent 4 hours a week online, which was double the figure for older adults (2 hours). By 2015, the teenage figure had more than doubled to 9 hours, whereas adults over 40 rose only slightly, to 3 hours.\n\nThe gap widened further by 2020. Teenagers reached 14 hours, the highest figure in the table, while adults over 40 recorded 5 hours, still well below the teenage level."},

{id:"i3",tr:"ielts",title:"Writing Task 2: Opinion Essays",th:"เขียน Task 2: เรียงความแสดงความเห็น",tag:"Writing (60% of score)",
 learn:{intro:"Task 2 ใช้เวลาประมาณ 40 นาที เขียนอย่างน้อย 250 คำ และมีน้ำหนักคะแนนมากกว่า Task 1 ต้องตอบคำถามให้ครบทุกส่วนและมีจุดยืนที่ชัดตลอดบทความ",
  pts:[["Intro: paraphrase หัวข้อ + บอกจุดยืน (thesis)","Some people believe… In my opinion, …"],
       ["Body paragraph ใช้โครงสร้าง PEEL","Point (ประเด็น) → Explain (อธิบาย) → Example (ตัวอย่าง) → Link (โยงกลับไปที่คำถาม)"],
       ["คำเชื่อม: Firstly · Moreover · However · Therefore · For instance","ใช้ให้หลากหลาย อย่าใช้ also หรือ and ซ้ำทุกประโยค"],
       ["To what extent do you agree? → ต้องมีความเห็นชัดตลอดบทความ","ถ้าเห็นด้วยบางส่วน ให้บอกส่วนที่เห็นด้วยและไม่เห็นด้วยให้ชัด"]],
  vocab:[["advantage","ข้อดี","A key advantage is lower cost."],["drawback","ข้อเสีย","One drawback is the time required."],["society","สังคม","Technology has changed society."],["benefit","ผลประโยชน์","Exercise has many benefits."],["impact","ผลกระทบ","The impact on children is serious."],["ensure","ทำให้แน่ใจ","Schools must ensure safety."],["essential","จำเป็นอย่างยิ่ง","Sleep is essential for learning."]],
  tip:"วางแผน 5 นาทีก่อนเขียน: จุดยืน ประเด็นหลัก 2 ข้อ และตัวอย่างอย่างละหนึ่ง จะช่วยให้เขียนครบ 250 คำโดยไม่หลงประเด็น"},
 read:{title:"Model Answer: Free University Education",text:"Some people believe that university education should be free for all students. I partly agree with this view.\n\nOn the one hand, free tuition would give talented students from poor families an equal chance to succeed. For instance, in countries such as Germany, public universities charge very low fees, and many graduates enter skilled professions regardless of background.\n\nOn the other hand, completely free education places a heavy burden on taxpayers, who may not all benefit directly. Therefore, a better solution would be low fees combined with grants for students in need.",
  qs:[{q:"What is the writer's position?",o:["Strongly agrees","Partly agrees","Strongly disagrees","Has no opinion"],a:1,w:"'I partly agree with this view'"},
      {q:"Which phrase introduces an example?",o:["On the other hand","Therefore","For instance","Regardless"],a:2,w:"For instance = ยกตัวอย่าง"},
      {q:"What solution does the writer propose?",o:["Free education for everyone","Higher fees for all","Low fees plus grants for students in need","Closing public universities"],a:2,w:"'low fees combined with grants for students in need'"}]},
 listen:{lines:[{s:"A",t:"So, Maya, how is your essay on remote working going?"},{s:"B",t:"I've finished the introduction, but my second paragraph feels weak."},{s:"A",t:"What's the problem?"},{s:"B",t:"I make a point about productivity, but I don't give any example."},{s:"A",t:"Then add a specific one, for instance a study or a company case. Also, check your linking words. You use 'also' in almost every sentence."},{s:"B",t:"OK, I'll vary them and send the revised draft by Thursday."}],
  qs:[{q:"What is the problem with Maya's second paragraph?",o:["It is too long","It has no example","It has no introduction","It is off topic"],a:1,w:"'I make a point… but I don't give any example'"},
      {q:"Which linking word does Maya use too often?",o:["However","Therefore","Also","For instance"],a:2,w:"'You use also in almost every sentence'"},
      {q:"When will Maya send the revised draft?",o:["Tuesday","Wednesday","Thursday","Friday"],a:2,w:"'send the revised draft by Thursday'"}]},
 write:{prompt:"Some people think children should start learning a foreign language at primary school. Others believe it is better to start at secondary school.\n\nDiscuss both views and give your own opinion. (Practice: at least 120 words. In the real test: 250 words.)",min:120,
  tips:["Intro: paraphrase + บอกจุดยืนของคุณ","Body 1: มุมมองของฝ่ายที่ให้เริ่มทีหลัง   Body 2: มุมมองที่คุณเห็นด้วยพร้อมตัวอย่าง","ใช้ PEEL ในแต่ละย่อหน้า","Conclusion: สรุปจุดยืนด้วยคำพูดใหม่ ไม่เพิ่มประเด็นใหม่"],
  model:"People disagree about when children should begin learning a foreign language. While some argue that primary school is the best starting point, others prefer to wait until secondary school. In my opinion, an early start is more beneficial, provided that lessons are well designed.\n\nSupporters of starting later say that young children already have to master reading, writing and mathematics in their own language. Adding another subject could overload them. Moreover, secondary schools usually have specialist teachers.\n\nHowever, I believe the advantages of an early start are greater. Children imitate sounds easily, so they develop better pronunciation. For instance, many pupils in Scandinavian countries begin English at age seven and become confident speakers by their teens.\n\nIn conclusion, although a later start has some merits, I support teaching languages in primary school, using games and songs rather than heavy grammar."},
 quiz:[{q:"What is the minimum word count for IELTS Writing Task 2?",o:["150","200","250","300"],a:2,w:"Task 2 ต้องการอย่างน้อย 250 คำ (Task 1 คือ 150 คำ)"},
       {q:"Choose the best word: Cars are convenient; ____, they cause pollution.",o:["moreover","however","therefore","for instance"],a:1,w:"ประโยคหลังขัดแย้งกับประโยคแรก ใช้ however"},
       {q:"Which is the strongest thesis sentence for 'Is technology making people lonelier?'",o:["Technology is everywhere.","I will talk about technology.","I believe technology increases loneliness because it replaces face-to-face contact.","Many people like phones."],a:2,w:"Thesis ที่ดีมีจุดยืนและเหตุผลหลัก"},
       {q:"In the PEEL structure, what does the last step 'L' do?",o:["Lists new ideas","Links the paragraph back to the question","Leaves the topic","Lowers the argument"],a:1,w:"Link = โยงกลับไปตอบคำถามของโจทย์"}]},

{id:"i4",tr:"ielts",title:"Listening & Speaking Strategies",th:"กลยุทธ์ฟังและพูด",tag:"Listening + Speaking",

 read:{title:"Tips for Fluent Speaking",text:"Fluency does not mean speaking fast. Examiners listen for ideas that flow naturally, with few long pauses. Candidates often lose marks because they try to find the perfect word and stop talking.\n\nA better strategy is to paraphrase: if you forget the word 'ferry', say 'a boat that carries cars across the river'. It also helps to extend short answers with a reason and a short example.\n\nIn Part 2, use the one minute of preparation to note four or five key words rather than full sentences, because reading complete sentences sounds unnatural.",
  qs:[{q:"According to the passage, what does fluency mean?",o:["Speaking very fast","Ideas flowing naturally with few long pauses","Using difficult words","Never making mistakes"],a:1,w:"'Fluency does not mean speaking fast. Examiners listen for ideas that flow naturally'"},
      {q:"What should you do if you forget a word?",o:["Stop and wait","Say it in your own language","Paraphrase it","Skip the question"],a:2,w:"'A better strategy is to paraphrase'"},
      {q:"How should you make notes in the Part 2 preparation minute?",o:["Write full sentences","Write key words","Draw pictures only","Do not write anything"],a:1,w:"'note four or five key words rather than full sentences'"}]},
 listen:{lines:[{s:"A",t:"Welcome to the Harbour Museum. The museum opens at nine thirty, not ten as printed on the old leaflet. Today's guided tour begins in the main hall, then moves to the maritime gallery on the second floor. Photography is allowed everywhere except the textile room. The cafe is closed for repairs, but there are vending machines near the entrance. The tour will finish at twelve fifteen."}],

      {q:"Where is photography NOT allowed?",o:["The main hall","The maritime gallery","The textile room","The entrance"],a:2,w:"'allowed everywhere except the textile room'"},

 write:{prompt:"Speaking Part 2 practice. Describe a place you enjoy visiting. You should say: where it is, how often you go there, what you do there, and explain why you enjoy it.\n\nWrite what you would say (80–120 words). Then read it aloud and time yourself: aim for 1–2 minutes.",min:70,
  tips:["เรียงตามหัวข้อบนการ์ด: where, how often, what, why","ใช้คำเชื่อมพูด: The reason is that… / Also, …","เติมรายละเอียดจากประสาทสัมผัส: เห็น ได้ยิน รู้สึกอย่างไร","อ่านออกเสียงแล้วจับเวลา ถ้าไม่ถึง 1 นาทีให้เพิ่มตัวอย่าง"],
  model:"I'd like to talk about a small park near my house in Chiang Mai. It is about ten minutes away on foot, and I go there two or three times a week, usually in the early evening. Mostly I walk around the lake, and sometimes I meet friends to chat or read a book on a bench. The reason I enjoy it so much is that it feels peaceful even though it is in the middle of the city. After a long day of study, it helps me clear my head. Also, the trees give plenty of shade, so it stays pleasant even in the hot season."},

{id:"b1",tr:"base",title:"Be, Have & Present Simple",th:"กริยาพื้นฐานและกิจวัตรประจำวัน",tag:"ระดับ A1",
 learn:{intro:"เริ่มจากกริยาที่ใช้บ่อยที่สุด คือ am/is/are, have/has และ Present Simple ใช้เล่าเรื่องตัวเอง กิจวัตร และข้อเท็จจริง ทุกบทที่เหลือต่อยอดจากบทนี้",
  pts:[["I am a student. She is a nurse. They are teachers.","be: I ใช้ am, he/she/it ใช้ is, you/we/they ใช้ are ปฏิเสธเติม not: She is not (isn't) late."],
       ["I work. She works.","Present Simple: ประธาน he/she/it เติม -s หรือ -es ที่กริยา (go → goes, study → studies)"],
       ["Do you work here? Does he work here?","คำถามใช้ do/does นำหน้า และกริยากลับเป็นรูปเดิม (Does he work…? ไม่ใช่ Does he works…?)"],
       ["I have a car. She has a car.","have ใช้กับ I/you/we/they ส่วน has ใช้กับ he/she/it"]],
  vocab:[["usually","ปกติ","I usually wake up at six."],["every day","ทุกวัน","She studies English every day."],["often","บ่อยๆ","They often eat out."],["never","ไม่เคย","He never drinks coffee."],["colleague","เพื่อนร่วมงาน","My colleague is friendly."],["schedule","ตารางเวลา","My schedule is busy."]],

 read:{title:"My Morning",text:"My name is Nina. I am a nurse at a small hospital. I usually wake up at six o'clock and I have breakfast at home. My husband works in a bank, so he leaves the house at seven. Our son goes to school by bus. I start work at eight and I finish at four. In the evening, we eat dinner together and I study English for thirty minutes.",
  qs:[{q:"What is Nina's job?",o:["Teacher","Nurse","Bank clerk","Student"],a:1,w:"'I am a nurse at a small hospital'"},
      {q:"How does Nina's son go to school?",o:["On foot","By car","By bus","By train"],a:2,w:"'Our son goes to school by bus'"},
      {q:"What does Nina do for thirty minutes in the evening?",o:["Works at the hospital","Studies English","Goes to the bank","Takes the bus"],a:1,w:"'I study English for thirty minutes'"}]},

 write:{prompt:"Write 5 to 6 sentences about your daily routine. Use Present Simple: I wake up…, I go to…, I usually…",min:30,
  tips:["ใช้ I + กริยารูปเดิม","ใส่คำบอกความถี่: usually, often, never","ใช้ and และ then เชื่อมประโยค","ถ้าเล่าถึงคนอื่น ตรวจว่า he/she/it เติม s"],

 read:{title:"A Weekend in Chiang Mai",text:"Last weekend, Ploy travelled to Chiang Mai with two friends. They left Bangkok on Friday evening and arrived at the hotel at midnight. On Saturday they visited a temple and bought some handmade bags at the night market. It rained on Sunday morning, so they stayed in a cafe and played cards. They went home by train and got back at ten o'clock on Sunday night.",

 write:{prompt:"Write 5 to 6 sentences about what you did last weekend. Use Past Simple and time words such as on Saturday, in the evening, after that.",min:30,
  tips:["ใช้กริยาช่อง 2 ทุกประโยค","เรียงเหตุการณ์ด้วย first, then, after that","ใช้ didn't สำหรับสิ่งที่ไม่ได้ทำ","เพิ่มความรู้สึก: It was fun. I was tired."],
  model:"Last weekend I visited my grandmother in Nonthaburi. On Saturday morning I took a bus there, and we cooked lunch together. After that, we watched a movie. In the evening I went to a market and bought some fruit. On Sunday I didn't go out because it rained. I was tired, but I had a lovely weekend."},
 quiz:[{q:"I ____ to the market yesterday.",o:["go","goes","went","going"],a:2,w:"yesterday ใช้ Past Simple: went"},
       {q:"She ____ her keys last night.",o:["lose","lost","losed","loses"],a:1,w:"lose เป็นกริยาไม่ปกติ: lost"},
