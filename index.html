{id:"b3",tr:"base",title:"Future, Modals & Requests",th:"แผนในอนาคต การขอร้อง และให้คำแนะนำ",tag:"ระดับ A2",
 learn:{intro:"บทนี้ใช้พูดถึงแผนในอนาคต ขอร้อง ให้คำแนะนำ และถามอย่างสุภาพ พบมากในข้อสอบ TOEIC Part 2–4 และ IELTS Speaking",
  pts:[["I will call you later. I'm going to study abroad.","will = ตัดสินใจตอนนั้นหรือสัญญา · be going to = แผนที่วางไว้แล้ว"],
       ["Can I…? Could I…? May I…?","Can = ขอทั่วไป · Could = สุภาพขึ้น · May = ทางการ"],
       ["should / must / have to","should = ควร (แนะนำ) · must / have to = ต้อง (ข้อบังคับ)"],
       ["Would you mind opening the window?","ขอร้องสุภาพ ตอบรับได้ว่า Not at all. หรือ Sure."]],
  vocab:[["appointment","นัดหมาย","I have a doctor's appointment."],["suggest","เสนอแนะ","I suggest we meet at noon."],["polite","สุภาพ","Please be polite to customers."],["permission","การอนุญาต","You need permission to enter."],["plan","แผน","What are your plans for July?"],["promise","สัญญา","I promise I will be on time."]],
  tip:"หลัง modal (can, could, should, must, will) ใช้กริยารูปเดิมเสมอ ไม่เติม s และไม่มี to: She can swim ถูก, She can swims ผิด"},
 read:{title:"A Message from the Manager",text:"Hi team. Next Monday we are going to move to the new office on Rose Street. You should pack your own desk by Friday, and you must not leave any documents on the shelves. Boxes will be delivered on Wednesday. If you need extra boxes, please ask Mina. Could everyone check their email on Thursday? I will send the new floor plan then. Thank you, Paul",
  qs:[{q:"When will the team move?",o:["This Friday","Next Monday","Next Thursday","On Wednesday"],a:1,w:"'Next Monday we are going to move'"},
      {q:"What must staff NOT do?",o:["Ask for boxes","Pack their desk","Leave documents on the shelves","Check email"],a:2,w:"'you must not leave any documents on the shelves'"},
      {q:"When will Paul send the floor plan?",o:["Wednesday","Thursday","Friday","Monday"],a:1,w:"'check their email on Thursday… I will send the new floor plan then'"}]},
 listen:{lines:[{s:"A",t:"Excuse me, could I ask something? I'd like to join the English club."},{s:"B",t:"Of course. You can sign up at the front desk. The club meets every Wednesday at six."},{s:"A",t:"Do I have to pay?"},{s:"B",t:"No, it's free, but you should bring your student card the first time."},{s:"A",t:"Great. I'll go to the desk now."}],
  qs:[{q:"How often does the club meet?",o:["Every day","Every Wednesday","Every weekend","Once a month"],a:1,w:"'every Wednesday at six'"},
      {q:"How much does it cost?",o:["Nothing","100 baht","A small fee","200 baht"],a:0,w:"'it's free'"},
      {q:"What should the student bring the first time?",o:["A pen","Money","A student card","A laptop"],a:2,w:"'you should bring your student card'"}]},
 write:{prompt:"Write 5 to 6 sentences about your plans for next month and one polite request to a colleague or teacher. Use will, be going to and could.",min:30,
  tips:["แผนที่วางไว้: I'm going to…","ขอร้อง: Could you…, please?","ตัดสินใจหรือสัญญา: I will…","หลัง modal ใช้กริยารูปเดิม"],
  model:"Next month I'm going to start a new English course. I will study for one hour every evening, and I'm going to take a practice test at the end of the month. I'm also going to visit my cousin in Rayong. I think I will take a bus because it's cheaper. Could you lend me your grammar book, please? I promise I will return it next week."},
 quiz:[{q:"____ I borrow your pen, please?",o:["Could","Do","Am","Must to"],a:0,w:"ขออนุญาตอย่างสุภาพใช้ Could I…?"},
       {q:"You ____ wear a helmet. It's the law.",o:["can","must","may","would"],a:1,w:"กฎหมายบังคับ ใช้ must"},
       {q:"She can ____ three languages.",o:["speaks","speak","speaking","to speak"],a:1,w:"หลัง can ใช้กริยารูปเดิม"},
       {q:"Look at the sky. It ____ rain soon.",o:["will","is going to","is","can"],a:1,w:"คาดการณ์จากสิ่งที่เห็น ใช้ be going to"}]},

{id:"b4",tr:"base",title:"Nouns, Articles & Quantity",th:"a/an/the นามนับได้และนับไม่ได้",tag:"ระดับ A2",
 learn:{intro:"ภาษาไทยไม่มีรูปพหูพจน์และไม่มี a/an/the ผู้เรียนไทยจึงพลาดเรื่องนี้บ่อยในข้อเขียน Part 5 ของ TOEIC และ Writing ของ IELTS",
  pts:[["a book · an apple · the sun","a/an ใช้กับนามนับได้เอกพจน์ที่ยังไม่เจาะจง · the ใช้เมื่อผู้ฟังรู้ว่าหมายถึงอะไร"],
       ["two books · three boxes · children · people","พหูพจน์เติม -s/-es และมีคำพิเศษ เช่น man → men, child → children"],
       ["water · money · information · advice","นามนับไม่ได้ ไม่เติม s และไม่ใช้ a/an: some information ถูก, an information ผิด"],
       ["many · much · a lot of · a few · a little","many + นามนับได้พหูพจน์ · much + นามนับไม่ได้ · a few + นับได้ · a little + นับไม่ได้"]],
  vocab:[["furniture","เฟอร์นิเจอร์ (นับไม่ได้)","We bought some furniture."],["information","ข้อมูล (นับไม่ได้)","I need more information."],["advice","คำแนะนำ (นับไม่ได้)","She gave me good advice."],["luggage","สัมภาระ (นับไม่ได้)","My luggage is heavy."],["equipment","อุปกรณ์ (นับไม่ได้)","The equipment is new."],["amount","ปริมาณ","The amount of work is huge."]],
  tip:"คำที่คนไทยพลาดบ่อย: information, advice, furniture, luggage, equipment, news เป็นนามนับไม่ได้ ไม่เติม s"},
 read:{title:"Our New Flat",text:"Last month, Mali and her sister rented a small flat near the station. There is one bedroom, a kitchen and a bathroom. They don't have much furniture yet, only a bed, a table and two chairs. Mali says they need some more equipment for the kitchen, such as a rice cooker and a few plates. The landlord gave them useful advice about local shops. He said the market sells a lot of cheap vegetables.",
  qs:[{q:"How many bedrooms does the flat have?",o:["None","One","Two","Three"],a:1,w:"'There is one bedroom'"},
      {q:"What furniture do they already have?",o:["A sofa and a TV","A bed, a table and two chairs","A rice cooker and plates","Nothing"],a:1,w:"'only a bed, a table and two chairs'"},
      {q:"What did the landlord give them?",o:["Furniture","Advice about local shops","A rice cooker","Vegetables"],a:1,w:"'gave them useful advice about local shops'"}]},
 listen:{lines:[{s:"A",t:"Hello, I'd like some information about the English course."},{s:"B",t:"Sure. We have a lot of students this year, but there are a few places left."},{s:"A",t:"How much homework is there?"},{s:"B",t:"Not much, only a little each night."},{s:"A",t:"And is there any equipment I need?"},{s:"B",t:"Just a notebook and a dictionary. We provide the textbooks."}],
  qs:[{q:"What does the speaker ask for?",o:["A dictionary","Information about a course","A notebook","A teacher"],a:1,w:"'I'd like some information about the English course'"},
      {q:"How many places are left?",o:["A lot","A few","None","Many"],a:1,w:"'there are a few places left'"},
      {q:"What must students bring?",o:["A textbook and a notebook","A notebook and a dictionary","A laptop","Only a dictionary"],a:1,w:"'Just a notebook and a dictionary. We provide the textbooks.'"}]},
 write:{prompt:"Describe your room or home in 5 to 6 sentences. Use a/an/the, some/any, and at least one of: a lot of, a few, a little.",min:30,
  tips:["ใช้ There is… กับนามเอกพจน์ และ There are… กับพหูพจน์","ใช้ a/an เมื่อพูดถึงสิ่งนั้นครั้งแรก แล้วใช้ the เมื่อพูดซ้ำ","ตรวจว่าไม่เติม s กับ furniture, information, advice","ลองใช้ a few หรือ a little อย่างน้อย 1 ครั้ง"],
  model:"I live in a small apartment near the river. There is a bedroom, a bathroom and a kitchen. I have a bed, a desk and a lot of books. There isn't much furniture, but I like it. I have a few plants on the balcony, and they need a little more light. The best thing is the view of the river."},
 quiz:[{q:"She gave me some good ____.",o:["advice","advices","an advice","advicies"],a:0,w:"advice นับไม่ได้ ไม่เติม s"},
       {q:"I need ____ umbrella. It's raining.",o:["a","an","the","some"],a:1,w:"umbrella ขึ้นต้นด้วยเสียงสระ ใช้ an"},
       {q:"There are too ____ cars on the road.",o:["much","many","a little","an"],a:1,w:"cars นับได้พหูพจน์ ใช้ many"},
       {q:"Two ____ are waiting outside.",o:["child","childs","children","childrens"],a:2,w:"พหูพจน์ของ child คือ children"}]},

{id:"b5",tr:"base",title:"Present Perfect & Comparisons",th:"ประสบการณ์ for/since และการเปรียบเทียบ",tag:"ระดับ B1",
 learn:{intro:"Present Perfect เชื่อมอดีตกับปัจจุบัน ใช้บอกประสบการณ์ ระยะเวลาที่ยังต่อเนื่อง และผลที่ยังเห็นอยู่ ส่วนการเปรียบเทียบใช้ทั้งใน Speaking และ Writing Task 1",
  pts:[["I have lived here for five years. She has finished.","have/has + กริยาช่อง 3 · for + ช่วงเวลา · since + จุดเริ่มต้น"],
       ["Have you ever been to Japan? Yes, I have.","ถามประสบการณ์ด้วย ever · never = ไม่เคย · already, yet, just"],
       ["Past Simple หรือ Present Perfect?","ระบุเวลาในอดีตชัดเจน (yesterday, in 2020) ใช้ Past Simple · ไม่ระบุเวลา เน้นผลหรือประสบการณ์ ใช้ Present Perfect"],
       ["taller than · the tallest · more expensive than · as cheap as","คำสั้นเติม -er/-est · คำยาวใช้ more/most · เท่ากันใช้ as…as"]],
  vocab:[["experience","ประสบการณ์","I have a lot of experience."],["already","เรียบร้อยแล้ว","I have already sent it."],["yet","ยัง (ในคำถามหรือปฏิเสธ)","Have you finished yet?"],["since","ตั้งแต่","I've worked here since 2022."],["compare","เปรียบเทียบ","Compare the two prices."],["expensive","แพง","This laptop is more expensive."]],
  tip:"since + จุดเวลา (since 2020, since Monday) · for + ช่วงเวลา (for two years, for a week) จำคู่นี้ให้แม่น เพราะออกสอบบ่อยมาก"},
 read:{title:"Two Phones",text:"Kim has used her old phone for four years. It is cheap, but the battery is weak. Last week she compared two new phones. Model A is cheaper than Model B, and its battery is as good as the old one. Model B is the most expensive in the shop, but it has the best camera. Kim hasn't decided yet. She has already asked three friends for advice, and she has read many reviews online.",
  qs:[{q:"How long has Kim used her old phone?",o:["Two years","Four years","Since last week","One month"],a:1,w:"'has used her old phone for four years'"},
      {q:"Which phone has the best camera?",o:["The old phone","Model A","Model B","All of them"],a:2,w:"'Model B… has the best camera'"},
      {q:"What is true about Kim now?",o:["She bought Model A.","She hasn't decided yet.","She sold her old phone.","She has asked nobody."],a:1,w:"'Kim hasn't decided yet'"}]},
 listen:{lines:[{s:"A",t:"Have you ever been to Chiang Rai?"},{s:"B",t:"Yes, I have. I went there twice. The first time was in 2019 and the second was last year."},{s:"A",t:"Which trip was better?"},{s:"B",t:"The second one. The weather was cooler and the hotel was much cheaper than the first. I've wanted to go back ever since."}],
  qs:[{q:"How many times has B been to Chiang Rai?",o:["Once","Twice","Three times","Never"],a:1,w:"'I went there twice'"},
      {q:"Why was the second trip better?",o:["Cooler weather and a cheaper hotel","A longer trip","A better camera","More friends"],a:0,w:"'The weather was cooler and the hotel was much cheaper'"},
      {q:"What does B want to do?",o:["Never go back","Go back","Move there","Sell the hotel"],a:1,w:"'I've wanted to go back ever since'"}]},
 write:{prompt:"Write 5 to 6 sentences about your experience with English or a place you have visited. Use have/has + past participle, for or since, and at least one comparison.",min:35,
  tips:["ใช้ for หรือ since ให้ถูกคู่กับช่วงเวลา","ใช้ never หรือ ever บอกประสบการณ์","เปรียบเทียบอย่างน้อยหนึ่งประโยค: better than, more … than","ถ้าระบุปีหรือวันที่ ให้เปลี่ยนเป็น Past Simple"],
  model:"I have studied English for six years, since I was twelve. I have never lived abroad, but I have visited Singapore twice. Singapore is cleaner than my city and the public transport is easier to use. I haven't taken an official test yet, but I have already booked one for March. My writing is better than my speaking, so I am practising more every day."},
 quiz:[{q:"I ____ here since 2021.",o:["live","lived","have lived","am living"],a:2,w:"since + จุดเวลา ใช้ Present Perfect"},
       {q:"She has worked here ____ three years.",o:["since","for","ago","from"],a:1,w:"three years เป็นช่วงเวลา ใช้ for"},
       {q:"This is the ____ film I have ever seen.",o:["good","better","best","most good"],a:2,w:"superlative ของ good คือ best"},
       {q:"Have you ____ been to London?",o:["ever","yet","already","ago"],a:0,w:"ถามประสบการณ์ใช้ ever"}]},

{id:"b6",tr:"base",title:"Linking Words & Sentence Building",th:"เชื่อมประโยคและขยายความ",tag:"ระดับ B1",
 learn:{intro:"ประโยคสั้นๆ ซ้ำๆ ทำให้คะแนนเขียนไม่ขึ้น บทนี้สอนเชื่อมประโยคด้วยคำสันธาน และขยายความด้วย who, which, that ซึ่งเป็นสะพานไปสู่ IELTS Writing และ TOEIC Part 6–7",
  pts:[["and · but · so · because · or","and = เพิ่ม · but = ขัดแย้ง · so = ผลลัพธ์ · because = เหตุผล"],
       ["although · however · therefore","Although + ประโยค: Although it rained, we went out. · However และ Therefore มักขึ้นต้นประโยคใหม่"],
       ["who · which · that","who = คน · which = สิ่งของ · that = ได้ทั้งสอง: The man who called you is my boss."],
       ["If + Present Simple, will + กริยารูปเดิม","If it rains, we will stay home. ใช้กับเงื่อนไขที่เป็นไปได้"]],
  vocab:[["although","แม้ว่า","Although he was tired, he kept working."],["however","อย่างไรก็ตาม","However, the price is high."],["therefore","ดังนั้น","Therefore, we need a plan."],["as a result","ผลก็คือ","As a result, sales fell."],["in addition","นอกจากนี้","In addition, the room is cheap."],["whereas","ในขณะที่","He likes tea, whereas I prefer coffee."]],
  tip:"ใช้คำเชื่อมให้หลากหลายแต่อย่าเยอะเกินไป 1 ถึง 2 คำต่อย่อหน้าก็พอ และห้ามใช้ because กับ so ในประโยคเดียวกัน"},
 read:{title:"Studying Online or in a Classroom",text:"Many people think online courses are better because they save time. However, some learners prefer classrooms, which give them a teacher they can ask directly. Although online lessons are cheaper, students who study alone often lose motivation. Therefore, many schools now offer a mix of both. If you choose a mixed course, you will study some lessons at home and attend others in person.",
  qs:[{q:"Why do many people prefer online courses?",o:["They save time.","They are free.","They have more teachers.","They are shorter."],a:0,w:"'online courses are better because they save time'"},
      {q:"What do students who study alone often lose?",o:["Money","Motivation","Time","Their teacher"],a:1,w:"'often lose motivation'"},
      {q:"What do many schools offer now?",o:["Only online lessons","Only classrooms","A mix of both","Free books"],a:2,w:"'many schools now offer a mix of both'"}]},
 listen:{lines:[{s:"A",t:"I'm thinking about changing jobs. The salary is higher, but the office is far from my home."},{s:"B",t:"If you take the job, you'll need to leave earlier every morning."},{s:"A",t:"That's true. Although I like my team, I want a new challenge. Therefore, I'm going to apply this week."},{s:"B",t:"Good luck! I hope you get the job."}],
  qs:[{q:"What is the good point of the new job?",o:["A higher salary","A closer office","A better team","Shorter hours"],a:0,w:"'The salary is higher'"},
      {q:"What is the problem with the new job?",o:["The salary is low","The office is far","The team is bad","The hours are long"],a:1,w:"'the office is far from my home'"},
      {q:"What will A do this week?",o:["Quit immediately","Apply for the job","Move house","Ask for a raise"],a:1,w:"'I'm going to apply this week'"}]},
 write:{prompt:"Write a short paragraph (6 to 8 sentences) about the advantages and disadvantages of living in a big city. Use at least four linking words such as because, but, however, although, so, therefore.",min:45,
  tips:["ฝั่งข้อดีใช้ On the one hand, ข้อเสียใช้ However,","ใช้ although หรือ whereas เปรียบเทียบสองด้าน","ประโยคสุดท้ายสรุปด้วย Therefore, I think…","อ่านออกเสียงเพื่อเช็กว่าไม่ซ้ำคำเชื่อมเดิม"],
  model:"Living in a big city has both advantages and disadvantages. On the one hand, there are many jobs, so people can earn more money. In addition, public transport is usually better, which makes travel easier. However, housing is expensive, and the air is often polluted. Although the city is exciting, it can be noisy and stressful. Therefore, I think it is a good choice for young people, whereas families may prefer a quieter place."},
 quiz:[{q:"I was tired, ____ I went to bed early.",o:["so","but","although","or"],a:0,w:"so บอกผลลัพธ์"},
       {q:"____ it was raining, we played football.",o:["Because","So","Although","Therefore"],a:2,w:"แม้ว่าฝนตกก็ยังเล่น ใช้ Although"},
       {q:"The woman ____ lives next door is a doctor.",o:["which","who","what","whose is"],a:1,w:"อ้างถึงคน ใช้ who"},
       {q:"If she ____ late, we will start without her.",o:["is","will be","was","be"],a:0,w:"if clause ใช้ Present Simple"}]}
];

{id:"b7",tr:"base",title:"Past Continuous & Past Perfect",th:"เล่าเรื่องในอดีตให้ละเอียดขึ้น",tag:"ระดับ B1–B2",
 learn:{intro:"สองกาลนี้ใช้เล่าเรื่องในอดีตให้ละเอียดขึ้น Past Continuous บอกสิ่งที่กำลังเกิดอยู่ในช่วงเวลาหนึ่ง ส่วน Past Perfect บอกเหตุการณ์ที่เกิดก่อนอีกเหตุการณ์ในอดีต พบมากใน IELTS Speaking Part 2 และบทอ่านเล่าเรื่อง",
  pts:[["I was cooking when the phone rang.","Past Continuous = was/were + V-ing บอกเหตุการณ์ที่กำลังดำเนินอยู่ แล้วมีเหตุการณ์สั้นๆ (Past Simple) แทรกเข้ามา"],
       ["While she was studying, her brother was playing games.","while ใช้กับสองเหตุการณ์ที่เกิดพร้อมกัน ส่วน when มักตามด้วยเหตุการณ์สั้นที่แทรก"],
       ["When I arrived, the meeting had already started.","Past Perfect = had + V3 บอกว่าเหตุการณ์นั้นเกิดก่อนอีกเหตุการณ์ในอดีต"],
       ["after · before · by the time · already · just","คำที่มักใช้ร่วมกับ Past Perfect เพื่อบอกลำดับเวลา"]],
  vocab:[["meanwhile","ในขณะเดียวกัน","Meanwhile, the team was preparing the room."],["suddenly","ทันใดนั้น","Suddenly, the lights went out."],["by the time","เมื่อถึงเวลาที่","By the time we arrived, it had started."],["earlier","ก่อนหน้านี้","I had spoken to him earlier."],["interrupt","ขัดจังหวะ","Sorry to interrupt you."],["witness","เป็นพยาน / เห็นเหตุการณ์","She witnessed the accident."]],
  tip:"ถ้ามีสองเหตุการณ์ในอดีต เหตุการณ์ที่เกิดก่อนใช้ Past Perfect เหตุการณ์ที่เกิดทีหลังใช้ Past Simple แต่ถ้าเล่าเรียงตามลำดับเวลาอยู่แล้ว ใช้ Past Simple ทั้งหมดก็พอ"},
 read:{title:"The Missed Train",text:"Last Friday, Lena was walking to the station when she realised she had left her ticket at home. By the time she got back, the train had already left. While she was waiting for the next one, she called her manager to say she would be late. He was having a meeting, so he did not answer. Lena was feeling worried, but when she finally arrived at the office, the meeting had just finished and nobody had noticed.",
  qs:[{q:"What was Lena doing when she realised her mistake?",o:["Waiting for a train","Walking to the station","Calling her manager","Sitting in a meeting"],a:1,w:"'Lena was walking to the station when she realised…'"},
      {q:"What had happened by the time she got back home?",o:["The meeting had finished","The train had left","Her manager had called","She had lost her phone"],a:1,w:"'By the time she got back, the train had already left'"},
      {q:"Why did her manager not answer the phone?",o:["He was having a meeting.","His phone was broken.","He was on a train.","He was angry."],a:0,w:"'He was having a meeting, so he did not answer'"}]},
 listen:{lines:[{s:"A",t:"Why were you late for the party?"},{s:"B",t:"I was driving there when the car broke down. Luckily, a man who was passing by stopped to help."},{s:"A",t:"Had you called a garage?"},{s:"B",t:"Yes, but by the time the mechanic arrived, the man had already fixed it!"},{s:"A",t:"Wow, lucky you!"}],
  qs:[{q:"What was B doing when the car broke down?",o:["Walking","Driving","Calling a garage","Eating"],a:1,w:"'I was driving there when the car broke down'"},
      {q:"Who stopped to help?",o:["A mechanic","A friend","A man passing by","A police officer"],a:2,w:"'a man who was passing by stopped to help'"},
      {q:"What had happened by the time the mechanic arrived?",o:["The car was fixed","The party had ended","B had gone home","The road was closed"],a:0,w:"'the man had already fixed it'"}]},
 write:{prompt:"Write 6 to 8 sentences about a memorable day in the past, such as a trip or an accident. Use at least two Past Continuous and two Past Perfect sentences.",min:45,
  tips:["ฉากเหตุการณ์ใช้ Past Continuous: It was raining…","เหตุการณ์ที่แทรกเข้ามาใช้ Past Simple: when the bus stopped…","เหตุการณ์ที่เกิดก่อนใช้ had + V3","ใช้ meanwhile, suddenly, by the time เพิ่มลำดับเวลา"],
  model:"Last summer I was travelling in the north when something unexpected happened. We were walking up a mountain path when it suddenly started to rain heavily. By the time we reached the village, we were completely wet, and our guide had already phoned the hotel. Meanwhile, the owner was preparing hot soup for us. We had never felt so tired! When we finally got to the hotel, the room had been heated and our clothes were dried by the fire. It was a day I will never forget."},
 quiz:[{q:"I ____ TV when the lights went out.",o:["watched","was watching","had watched","watch"],a:1,w:"กำลังทำอยู่แล้วมีเหตุการณ์แทรก ใช้ Past Continuous"},
       {q:"When we arrived at the cinema, the film ____.",o:["already started","has already started","had already started","was already starting"],a:2,w:"หนังเริ่มก่อนที่เราจะมาถึง ใช้ Past Perfect"},
       {q:"While she ____ dinner, her friends were setting the table.",o:["cooked","was cooking","had cooked","cooks"],a:1,w:"while + สองเหตุการณ์ที่เกิดพร้อมกัน ใช้ Past Continuous ทั้งคู่"},
       {q:"After she ____ the report, she sent it to her boss.",o:["had finished","finishes","finishing","is finished"],a:0,w:"after + เหตุการณ์ที่เกิดก่อน ใช้ Past Perfect"}]},

{id:"b8",tr:"base",title:"Passive Voice",th:"ประโยคกรรมวาจก",tag:"ระดับ B1–B2",
 learn:{intro:"Passive Voice เน้นสิ่งที่ถูกกระทำมากกว่าคนทำ พบมากใน TOEIC Part 5–7 (ประกาศ รายงาน) และ IELTS Writing Task 1 ตอนอธิบายขั้นตอนหรือกระบวนการ",
  pts:[["The report was written by Anna.","โครงสร้าง: be + V3 (+ by คนทำ) โดย be เปลี่ยนตามกาลและประธาน"],
       ["The office is cleaned every day. The office was cleaned yesterday.","Present ใช้ is/are + V3 · Past ใช้ was/were + V3"],
       ["will be + V3 · has/have been + V3 · can be + V3","Future, Present Perfect และ Modal ในรูป Passive"],
       ["My bag was stolen. The paper is cut and then packed.","ใช้ Passive เมื่อไม่รู้หรือไม่สำคัญว่าใครทำ หรือเมื่ออธิบายกระบวนการ"]],
  vocab:[["process","กระบวนการ","The process takes three days."],["produce","ผลิต","Rice is produced in Thailand."],["install","ติดตั้ง","The software was installed yesterday."],["deliver","ส่งมอบ","Orders are delivered within a week."],["inspect","ตรวจสอบ","Every product is inspected."],["damage","ทำให้เสียหาย","The package was damaged."]],
  tip:"ข้อสอบ TOEIC Part 5 มักให้เลือกระหว่าง V-ing, V3 และ V1 ถ้าหลัง be เป็นสิ่งของและไม่มี object ตามหลัง ให้นึกถึง Passive (be + V3)"},
 read:{title:"How Chocolate Is Made",text:"Cocoa beans are grown in tropical countries and are harvested by hand. After the beans have been collected, they are dried in the sun for about a week. Then they are shipped to factories, where they are roasted and ground into a paste. Sugar and milk are added, and the mixture is heated and stirred for several hours. Finally, the chocolate is poured into moulds, cooled and wrapped.",
  qs:[{q:"How are cocoa beans harvested?",o:["By machine","By hand","By boat","By robots"],a:1,w:"'are harvested by hand'"},
      {q:"What happens to the beans after they are dried?",o:["They are shipped to factories.","They are poured into moulds.","They are wrapped.","They are grown."],a:0,w:"'Then they are shipped to factories'"},
      {q:"What is the last step?",o:["The mixture is heated.","Sugar is added.","The chocolate is cooled and wrapped.","The beans are roasted."],a:2,w:"'Finally, the chocolate is poured into moulds, cooled and wrapped'"}]},
 listen:{lines:[{s:"A",t:"Hello, I'm calling about my order. It was supposed to be delivered yesterday."},{s:"B",t:"I'm sorry. Let me check. Your parcel was sent on Monday, but it was damaged during transport."},{s:"A",t:"Will it be replaced?"},{s:"B",t:"Yes, a new one will be sent tomorrow, and the delivery fee will be refunded."}],
  qs:[{q:"What problem does the caller have?",o:["The order was not delivered on time","The wrong item was sent","The price was too high","The shop was closed"],a:0,w:"'It was supposed to be delivered yesterday'"},
      {q:"What happened to the parcel?",o:["It was lost.","It was damaged during transport.","It was stolen.","It was returned."],a:1,w:"'it was damaged during transport'"},
      {q:"What will be refunded?",o:["The delivery fee","The whole order","Nothing","The new parcel"],a:0,w:"'the delivery fee will be refunded'"}]},
 write:{prompt:"Describe how a product is made or how a process works, such as making tea, recycling paper or applying for a visa. Write 6 to 8 sentences using Passive Voice and sequence words such as first, then, after that, finally.",min:45,
  tips:["ใช้ is/are + V3 สำหรับขั้นตอนในปัจจุบัน","ใช้ first, then, next, after that, finally เรียงลำดับ","ไม่ต้องใส่ผู้ทำถ้าไม่สำคัญ","ตรวจกริยาช่อง 3 ให้ถูก (grow → grown, make → made)"],
  model:"Paper is made from wood. First, trees are cut down and the logs are taken to a factory. There, the bark is removed and the wood is cut into small pieces. Then the pieces are mixed with water and heated until they become a soft pulp. After that, the pulp is pressed flat and dried. Finally, the paper is cut into sheets and packed. Today, a lot of paper is also made from recycled materials."},
 quiz:[{q:"The new library ____ by the mayor next month.",o:["will open","will be opened","opened","is opening"],a:1,w:"มี by the mayor บอกผู้ทำ และห้องสมุดเป็นผู้ถูกเปิด ใช้ will be + V3"},
       {q:"All products ____ before they leave the factory.",o:["inspect","are inspected","are inspecting","inspecting"],a:1,w:"สินค้าถูกตรวจสอบ ใช้ are + V3"},
       {q:"My wallet ____ yesterday.",o:["stole","was stolen","has stolen","is stolen"],a:1,w:"กระเป๋าถูกขโมย อดีตมี yesterday ใช้ was + V3"},
       {q:"The report has already ____.",o:["written","been written","be written","writing"],a:1,w:"Present Perfect Passive = has/have been + V3"}]},

{id:"b9",tr:"base",title:"Conditionals (0, 1, 2, 3)",th:"ประโยคเงื่อนไขทั้งสี่แบบ",tag:"ระดับ B1–B2",
 learn:{intro:"ประโยคเงื่อนไขใช้พูดถึงสิ่งที่เป็นไปได้ สิ่งที่สมมติ และสิ่งที่ไม่เกิดขึ้นจริงในอดีต ใช้บ่อยใน IELTS Speaking Part 3 และ Writing Task 2",
  pts:[["Type 0: If you heat ice, it melts.","ข้อเท็จจริงหรือกฎ: If + Present Simple, Present Simple"],
       ["Type 1: If it rains, we will stay home.","เป็นไปได้ในอนาคต: If + Present Simple, will + กริยารูปเดิม"],
       ["Type 2: If I had more time, I would learn French.","สมมติสิ่งที่ไม่จริงในปัจจุบัน: If + Past Simple, would + กริยารูปเดิม (If I were you,… ใช้ were ได้กับทุกประธาน)"],
       ["Type 3: If I had studied, I would have passed.","เสียใจกับอดีตที่เปลี่ยนไม่ได้: If + Past Perfect, would have + V3"]],
  vocab:[["unless","ถ้าไม่ (= if not)","Unless you hurry, you will be late."],["provided that","ตราบใดที่","You can go provided that you finish."],["suppose","สมมติว่า","Suppose you won a million baht."],["regret","เสียใจ","I regret not studying harder."],["otherwise","ไม่เช่นนั้น","Leave now, otherwise you'll miss it."],["in case","เผื่อ","Take an umbrella in case it rains."]],
  tip:"หลัง if ไม่ใช้ will: If it rains ถูก, If it will rain ผิด และ would ไม่ใช้ในส่วน if เช่นกัน"},
 read:{title:"Life Choices",text:"Marco often thinks about the past. If he had accepted the job abroad, he would have earned more money. However, he would not have met his wife. If he had a choice now, he would probably choose the same path. He tells his students that unless they make plans, they will not reach their goals. 'If you work steadily, you will succeed,' he says, 'but if you wait for luck, you may wait a very long time.'",
  qs:[{q:"What would Marco have done if he had accepted the job?",o:["Earned more money","Met his wife","Stayed at home","Taught students"],a:0,w:"'he would have earned more money'"},
      {q:"What would Marco do if he had a choice now?",o:["Choose a different path","Choose the same path","Leave his wife","Move abroad"],a:1,w:"'he would probably choose the same path'"},
      {q:"What happens, according to Marco, if students do not make plans?",o:["They will succeed.","They will not reach their goals.","They will be lucky.","They will find a job."],a:1,w:"'unless they make plans, they will not reach their goals'"}]},
 listen:{lines:[{s:"A",t:"If you could live anywhere, where would you live?"},{s:"B",t:"I would live in Japan. If I spoke Japanese, I would move there tomorrow."},{s:"A",t:"Why don't you study it?"},{s:"B",t:"I will, provided that I can find a cheap course. Unless I start soon, I'll never learn."}],
  qs:[{q:"Where would B like to live?",o:["Japan","Korea","England","Singapore"],a:0,w:"'I would live in Japan'"},
      {q:"Why can't B move there at the moment?",o:["B doesn't speak Japanese","B has no money","B has no job","B doesn't like it"],a:0,w:"'If I spoke Japanese, I would move there tomorrow' แปลว่าตอนนี้ยังพูดไม่ได้"},
      {q:"Under what condition will B study Japanese?",o:["If friends join","If the course is cheap","If it is online","If there is time"],a:1,w:"'provided that I can find a cheap course'"}]},
 write:{prompt:"Write 6 to 8 sentences about your dreams or regrets. Use at least one Type 1, one Type 2 and one Type 3 conditional sentence.",min:45,
  tips:["Type 1 แผนที่เป็นไปได้: If I pass the test, I will…","Type 2 ความฝัน: If I won the lottery, I would…","Type 3 ความเสียดาย: If I had studied harder, I would have…","อย่าใช้ will หรือ would ในส่วน if"],
  model:"If I pass the exam in March, I will apply to a university in Australia. If I had more savings, I would travel around Europe first, but that isn't possible now. I sometimes regret not learning English earlier. If I had started in high school, I would have reached a higher level by now. Anyway, unless I keep practising every day, I won't improve quickly, so I study for an hour each evening. If I could talk to my younger self, I would say, work hard from the beginning."},
 quiz:[{q:"If it ____ tomorrow, we will cancel the picnic.",o:["rains","will rain","rained","would rain"],a:0,w:"Type 1: if + Present Simple"},
       {q:"If I ____ you, I would take the job.",o:["am","was being","were","will be"],a:2,w:"Type 2 ใช้ were ในสำนวน If I were you"},
       {q:"If she had left earlier, she ____ the train.",o:["would catch","would have caught","will catch","caught"],a:1,w:"Type 3: would have + V3"},
       {q:"You won't pass ____ you study harder.",o:["if","unless","when","although"],a:1,w:"unless = if not"}]},

{id:"b10",tr:"base",title:"Reported Speech",th:"การเล่าสิ่งที่คนอื่นพูด",tag:"ระดับ B1–B2",
 learn:{intro:"Reported Speech ใช้เล่าสิ่งที่คนอื่นพูดไว้ พบใน TOEIC Part 7 (อีเมลหรือรายงานการประชุมที่อ้างถึงคำพูด) และใช้ใน IELTS Speaking เวลาเล่าเหตุการณ์",
  pts:[["He said (that) he was tired.","'I am tired' → He said he was tired. ถอยกาลหนึ่งขั้น: am/is → was, will → would, can → could"],
       ["She said, 'I bought a car.' → She said she had bought a car.","Past Simple ถอยเป็น Past Perfect"],
       ["He asked me where I lived. She asked if I was ready.","คำถามเปลี่ยนเป็นประโยคบอกเล่า ไม่ใช้ do/does และใช้ if หรือ whether กับคำถามแบบ yes/no"],
       ["now → then · today → that day · tomorrow → the next day · here → there","เปลี่ยนคำบอกเวลาและสถานที่ให้ตรงกับมุมมองของผู้เล่า"]],
  vocab:[["announce","ประกาศ","The company announced a new plan."],["explain","อธิบาย","She explained the rules."],["mention","กล่าวถึง","He mentioned the deadline."],["suggest","เสนอแนะ","She suggested meeting earlier."],["admit","ยอมรับ","He admitted his mistake."],["promise","สัญญา","I promised to call back."]],
  tip:"say ไม่ต้องตามด้วยคน (He said that…) แต่ tell ต้องมีคน (He told me that…) และถ้าสิ่งที่พูดยังเป็นจริงอยู่ตอนเล่า จะไม่ถอยกาลก็ได้"},
 read:{title:"Meeting Notes",text:"At the Monday meeting, the director announced that the company would open a new branch in Chiang Mai. She explained that the plan had been approved the week before. A staff member asked whether the new branch would hire more people, and the director said that around twenty employees would be needed. She also mentioned that the opening date was not final, and she told everyone to wait for an email.",
  qs:[{q:"What did the director announce?",o:["A new branch would open in Chiang Mai.","The company would close.","Salaries would rise.","A new director would start."],a:0,w:"'announced that the company would open a new branch in Chiang Mai'"},
      {q:"When had the plan been approved?",o:["The week before","The same day","A month earlier","The day after"],a:0,w:"'the plan had been approved the week before'"},
      {q:"What were staff told to do?",o:["Apply for jobs","Wait for an email","Visit Chiang Mai","Call the director"],a:1,w:"'she told everyone to wait for an email'"}]},
 listen:{lines:[{s:"A",t:"Did you speak to Mr. Lee about the schedule?"},{s:"B",t:"Yes. He said that he couldn't come on Friday, so he suggested meeting on Monday instead."},{s:"A",t:"Did he say what time?"},{s:"B",t:"He told me that he would be free after two o'clock."},{s:"A",t:"Great, I'll book the room."}],
  qs:[{q:"What did Mr. Lee suggest?",o:["Meeting on Monday","Meeting on Friday","Cancelling the meeting","Meeting online"],a:0,w:"'he suggested meeting on Monday instead'"},
      {q:"When will Mr. Lee be free on that day?",o:["After two o'clock","Before noon","At nine","All day"],a:0,w:"'he would be free after two o'clock'"},
      {q:"What will A do?",o:["Book the room","Call Mr. Lee","Send an email","Cancel the schedule"],a:0,w:"'I'll book the room'"}]},
 write:{prompt:"Your friend told you: 'I'm moving to Chiang Mai next month because I got a new job. I will start on 1st December, and I can't take my cat.' Report what she said in 5 to 6 sentences, using said, told, and asked whether.",min:40,
  tips:["ถอยกาล: am → was, will → would, can't → couldn't","เปลี่ยน next month → the following month","ใช้ told + คน และ said + that","คำถามใช้ asked if/whether + ประโยคบอกเล่า"],
  model:"My friend told me that she was moving to Chiang Mai the following month because she had got a new job. She said that she would start on the first of December. She also said that she couldn't take her cat, so she asked me whether I could look after it. I told her that I would think about it. She mentioned that she would pay for the cat food."},
 quiz:[{q:"She said, 'I am busy.' → She said that she ____ busy.",o:["is","was","has been","will be"],a:1,w:"am/is ถอยเป็น was"},
       {q:"He said, 'I will call you.' → He said he ____ call me.",o:["will","would","can","has"],a:1,w:"will ถอยเป็น would"},
       {q:"She asked me, 'Do you like coffee?' → She asked me ____ I liked coffee.",o:["do","that","if","what"],a:2,w:"คำถาม yes/no ใช้ if หรือ whether"},
       {q:"He ____ me that the meeting was cancelled.",o:["said","told","spoke","asked"],a:1,w:"tell ตามด้วยคนที่ฟัง"}]}
];

/* ----- Timed run (placement, mock, mistakes) ----- */
function startRun(kind){
  var items,title,mins=0,tr=X().track;
  if(kind==="place"){items=PLACE;title="Level check"}
  else if(kind==="mock"){var m=MOCK[tr];items=m.items;title=m.title;mins=m.mins}
  else{var refs=missList(); items=refs.map(function(r){return Object.assign({ref:r},qFromRef(r))}); title="Review mistakes"; if(!items.length){toast("No mistakes to review.");return}}
  var qs=items.filter(function(x){return x.q});
  RUN={kind:kind,tr:tr,items:items,qs:qs,n:qs.length,sel:{},title:title,mins:mins,t0:Date.now(),end:mins?Date.now()+mins*60000:0,done:false,res:null};
  clearRun(); if(mins)runTimer=setInterval(runTick,1000);
  S.page="exam"; render(); window.scrollTo(0,0);
}
function clearRun(){if(runTimer){clearInterval(runTimer);runTimer=null}}
function runTick(){
  if(!RUN||RUN.done||!RUN.end){clearRun();return}
  var left=Math.max(0,Math.round((RUN.end-Date.now())/1000)), el=document.getElementById("tm");
  if(el){el.textContent=fmtT(left); if(left<=60)el.style.color="var(--bad)"}
  if(left<=0)submitRun(true);
}
function submitRun(auto){
  var R=RUN; if(!R||R.done)return; clearRun();
  var c=0,tags={},wrong=[];
  R.qs.forEach(function(q,i){
    var ok=R.sel[i]===q.a; if(ok)c++;
    if(q.tag){var t=tags[q.tag]||(tags[q.tag]={c:0,n:0}); t.n++; if(ok)t.c++}
    if(!ok)wrong.push(i);
    if(R.kind==="mock")recMiss("m|"+R.tr+"|"+i,ok); else if(R.kind==="miss"&&q.ref)recMiss(q.ref,ok);
  });
  var used=Math.round((Date.now()-R.t0)/1000);
  R.res={c:c,n:R.n,tags:tags,wrong:wrong,used:used,auto:!!auto,prev:null};
  if(R.kind==="mock"){
    var prev=X().mocks.filter(function(m){return m.k===R.tr}).slice(-1)[0];
    R.res.prev=prev?Math.round(prev.s/prev.n*100):null;
    X().mocks.push({k:R.tr,s:c,n:R.n,at:Date.now(),t:used}); X().mocks=X().mocks.slice(-30);
  } else if(R.kind==="place"){
    var start=c<=4?0:c<=7?2:c<=9?4:6; X().place={s:c,n:R.n,start:start,at:Date.now()};
  }
  mark(); pushHist("exam",R.title+" · "+c+"/"+R.n); save(); R.done=true; render(true); window.scrollTo(0,0);
  if(c/R.n>=.8)confetti();
}
function runView(){
  var R=RUN, h='<div class="gap">';
  if(!R.done){
    var left=R.end?Math.max(0,Math.round((R.end-Date.now())/1000)):0, qi=0;
    h+='<div class="runbar"><div><div class="lbl">'+esc(R.title)+'</div><b id="ans">'+Object.keys(R.sel).length+'/'+R.n+'</b> <span class="small muted">answered</span></div>'+(R.end?'<div class="tmr" id="tm" role="timer">'+fmtT(left)+'</div>':'')+'<div class="row"><button class="btn sm ghost" data-a="x-rexit">Exit</button><button class="btn sm" data-a="x-rsubmit">Submit</button></div></div>';
    R.items.forEach(function(it){
      if(it.p){h+='<div class="card"><div class="lbl">Passage</div><h3 style="margin:8px 0">'+esc(it.title)+'</h3><p style="line-height:1.75">'+esc(it.text)+'</p></div>'; return}
      var i=qi++;
      h+='<div class="card"><p style="font-weight:600;margin-bottom:10px"><span class="muted">'+(i+1)+'.</span> '+esc(it.q)+'</p><div class="gap" style="gap:8px">'+it.o.map(function(o,oi){return '<button class="opt'+(R.sel[i]===oi?" sel":"")+'" data-a="x-rpick" data-q="'+i+'" data-i="'+oi+'"><span class="k">'+"ABCD"[oi]+'</span><span>'+esc(o)+'</span></button>'}).join("")+'</div></div>';
    });
    return h+'<div class="row" style="justify-content:flex-end"><button class="btn" data-a="x-rsubmit">Submit answers</button></div></div>';
  }
  var res=R.res, pct=Math.round(res.c/res.n*100);
  h+='<div class="card empty">'+slot("quiz","Exam result","empty")+'<div class="score">'+res.c+' / '+res.n+'</div><h3>'+pct+'% · time '+fmtT(res.used)+(res.auto?" · time ran out":"")+'</h3>'+(res.prev!==null?'<p class="muted small">Previous attempt: '+res.prev+'%</p>':'')+'</div>';
  if(R.kind==="place"){var st=X().place.start; h+='<div class="card"><div class="lbl">Recommendation</div><p style="margin-top:8px">Your learning path now starts at foundation unit '+(st+1)+'.</p></div>'}
  var tg=Object.keys(res.tags); if(tg.length)h+='<div class="card"><div class="lbl">By topic</div>'+tg.map(function(t){var x=res.tags[t],p=Math.round(x.c/x.n*100);return '<div style="padding:8px 0"><div class="row small" style="justify-content:space-between;flex-wrap:nowrap"><span>'+esc(t)+'</span><span class="muted">'+x.c+'/'+x.n+'</span></div>'+bar(p)+'</div>'}).join("")+'</div>';
  if(res.wrong.length){h+='<div class="sech"><h2>Review your mistakes</h2></div>'+res.wrong.map(function(i){var q=R.qs[i]; return '<div class="card"><p style="font-weight:600">'+esc(q.q)+'</p><p class="small" style="margin-top:8px"><span class="muted">Your answer:</span> '+(R.sel[i]===undefined?"(none)":esc(q.o[R.sel[i]]))+'</p><p class="small"><span class="muted">Correct:</span> <b style="color:var(--mint)">'+esc(q.o[q.a])+'</b></p>'+(q.w?'<p class="small muted" style="margin-top:6px">'+esc(q.w)+'</p>':'')+'</div>'}).join("")}
  return h+'<div class="row"><button class="btn" data-a="x-rexit">Back to Exam Prep</button>'+(R.kind!=="miss"?'<button class="btn ghost" data-a="x-run" data-k="'+R.kind+'">Try again</button>':'')+'</div></div>';
}
pages.exam=function(){if(RUN)return runView(); if(UX.unit)return xUnit(); return examHome()};

/* ----- Listening playback ----- */
function xStop(){try{speechSynthesis.cancel()}catch(e){} UX.speaking=false; var b=document.getElementById("playBtn"); if(b){b.innerHTML=ic("play")+"Play audio"; refreshIcons()}}
function xPlay(){
  if(UX.speaking){xStop();return}
  var u=byId(UX.unit), m=document.getElementById("lmsg");
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){if(m)m.textContent="This browser cannot play speech. Show the transcript and read it instead.";UX.tr=true;render(true);return}
  var vs=speechSynthesis.getVoices()||[], v=vs.filter(function(x){return /^en[-_]US/i.test(x.lang)})[0]||vs.filter(function(x){return /^en/i.test(x.lang)})[0], parts=[];
  u.listen.lines.forEach(function(l){(l.t.match(/[^.!?]+[.!?]+/g)||[l.t]).forEach(function(s){parts.push({s:l.s,t:s.trim()})})});
  speechSynthesis.cancel(); UX.speaking=true; var b=document.getElementById("playBtn"); if(b){b.innerHTML=ic("x")+"Stop"; refreshIcons()}
  var started=false, tm;
  parts.forEach(function(p,i){
    var ut=new SpeechSynthesisUtterance(p.t); ut.lang="en-US"; if(v)ut.voice=v; ut.rate=S.d.set.rate; ut.pitch=p.s==="B"?0.8:1.05;
    ut.onstart=function(){started=true;clearTimeout(tm)};
    if(i===parts.length-1)ut.onend=function(){xStop()};
    ut.onerror=function(){xStop()};
    speechSynthesis.speak(ut);
  });
  tm=setTimeout(function(){if(!started){xStop(); var mm=document.getElementById("lmsg"); if(mm)mm.textContent="Audio did not start on this device. Use the transcript instead."; UX.tr=true; render(true)}},3000);
}

/* ----- Exam events (second delegated listener) ----- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]"); if(!el)return; var a=el.dataset.a; if(a.indexOf("x-")!==0)return;
  if(a==="x-track"){X().track=el.dataset.v; save(); render(true)}
  else if(a==="x-open"){S.page="exam"; UX.unit=el.dataset.u; UX.step=el.dataset.s||"learn"; UX.model=false; UX.tr=false; xStop(); render(); window.scrollTo(0,0)}
  else if(a==="x-back"){xStop(); UX.unit=null; render(); window.scrollTo(0,0)}
  else if(a==="x-step"){xStop(); UX.step=el.dataset.s; UX.model=false; render(true); window.scrollTo(0,0)}
  else if(a==="x-learned"){xMark(UX.unit,"learn"); toast("Step complete","ok"); render(true)}
  else if(a==="x-tr"){UX.tr=!UX.tr; render(true)}
  else if(a==="x-model"){UX.model=!UX.model; render(true)}
  else if(a==="x-play"){xPlay()}
  else if(a==="x-pick"){var A=UX.A[el.dataset.k]; if(!A||A.checked)return; A.sel[+el.dataset.q]=+el.dataset.i; render(true)}
  else if(a==="x-retry"){UX.A[el.dataset.k]={sel:{},checked:false}; render(true)}
  else if(a==="x-check"){
    var key=el.dataset.k, pr=key.split("_"), qs=qsFor(pr[0],pr[1]), A2=UX.A[key];
    if(Object.keys(A2.sel).length<qs.length){var hn=document.getElementById("xhint"); if(hn)hn.textContent="Answer every question first."; return}
    A2.checked=true; var c=0; qs.forEach(function(q,i){if(A2.sel[i]===q.a)c++});
    var sc={s:c,n:qs.length,at:Date.now()}, old=X().scores[key]; if(!old||sc.s/sc.n>old.s/old.n)X().scores[key]=sc;
    qs.forEach(function(q,i){recMiss(pr[0]+"|"+pr[1]+"|"+i,A2.sel[i]===q.a)});
    xMark(pr[0],pr[1]); if(c===qs.length)confetti(); render(true);
  }
  else if(a==="x-wdone"){var u=byId(UX.unit), t=(X().drafts[u.id]||""); if(wc(t)<Math.round(u.write.min*0.6)){toast("Write at least "+Math.round(u.write.min*0.6)+" words first.","warn");return} xMark(u.id,"write"); toast("Step complete","ok"); render(true)}
  else if(a==="x-run"){startRun(el.dataset.k)}
  else if(a==="x-rpick"){RUN.sel[+el.dataset.q]=+el.dataset.i; [].forEach.call(el.parentNode.children,function(b){b.classList.remove("sel")}); el.classList.add("sel"); var an=document.getElementById("ans"); if(an)an.textContent=Object.keys(RUN.sel).length+"/"+RUN.n}
  else if(a==="x-rsubmit"){submitRun(false)}
  else if(a==="x-rexit"){clearRun(); RUN=null; render(); window.scrollTo(0,0)}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="wr"&&UX.unit){X().drafts[UX.unit]=t.value; var c=document.getElementById("wcnt"); if(c)c.textContent=wc(t.value)+" words (aim for "+byId(UX.unit).write.min+"+)"; clearTimeout(UX.dt); UX.dt=setTimeout(save,500)}
});
document.addEventListener("change",function(e){
  if(e.target.id==="exdate"){X().date=e.target.value; save(); render(true)}
});
